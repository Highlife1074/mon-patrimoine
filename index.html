    function PatrimoineApp() {
      const [themeName, setThemeName] = useState("dark");
      const t = THEMES[themeName];
      const [positions, setPositions] = useState(stockPositions);
      const [monthly, setMonthly] = useState(initialMonthlySnapshots);
      // Suivi hebdo retiré (pas fiable) : les anciens points sont conservés tels quels dans la sauvegarde,
      // mais ne sont plus affichés ni utilisés dans les calculs.
      const [weeklyArchive, setWeeklyArchive] = useState([]);
      const [transfers, setTransfers] = useState(initialTransfers);
      const [recurringTransfers, setRecurringTransfers] = useState([]);
      // Budget : opérations Revolut importées (un document Firestore par année) et catégories apprises par marchand
      const [budgetTx, setBudgetTx] = useState([]);
      const [budgetRules, setBudgetRules] = useState({});
      const [budgetLimits, setBudgetLimits] = useState({});
      const [customCats, setCustomCats] = useState([]);
      const [forecast, setForecast] = useState({ revenus: [], depenses: [], inclureMoyennes: true });
      // Les catégories créées par l'utilisateur rejoignent la liste partagée avant tout calcul
      applyCustomCategories(customCats);
      setKnownHolders(useMemo(() => deriveHolders(budgetTx), [budgetTx]));
      const [monthlyModalOpen, setMonthlyModalOpen] = useState(false);
      const [monthlyModalKey, setMonthlyModalKey] = useState(0);
      const [tab, setTab] = useState("dashboard");
      const isMobile = useIsMobile();
      const [menuOpen, setMenuOpen] = useState(false);
      const [monthlyRange, setMonthlyRange] = useState(() => (window.matchMedia(MOBILE_QUERY).matches ? 12 : 0));
      const goTab = (id) => { setTab(id); setMenuOpen(false); window.scrollTo({ top: 0 }); };
      const openMonthlyModal = () => { setMonthlyModalKey((k) => k + 1); setMonthlyModalOpen(true); };

      // Persistance Firebase
      const [loaded, setLoaded] = useState(false);
      // Réparation : virements entre vos comptes mal classés (ex. après une suppression de règle sans titulaires connus)
      useEffect(() => {
        if (!loaded) return;
        const { out, n } = repairOwnTransfers(budgetTx, budgetRules);
        if (n) setBudgetTx(out);
      }, [budgetTx, budgetRules, loaded]);
      // Lecture Firebase échouée : on n'affiche pas l'application et on n'enregistre RIEN,
      // sinon l'état vide par défaut écraserait le document sauvegardé
      const [loadError, setLoadError] = useState("");
      const [saveStatus, setSaveStatus] = useState("idle"); 
      const [saveError, setSaveError] = useState("");
      const [lastSaved, setLastSaved] = useState(null);
      const docRef = doc(db, "patrimoine", "mon_portefeuille");

      useEffect(() => {
        let annule = false;
        (async () => {
          try {
            let docSnap;
            for (let essai = 0; ; essai++) {
              try { docSnap = await getDoc(docRef); break; }
              catch (err) { if (essai >= 3 || annule) throw err; await new Promise((r) => setTimeout(r, 1500 * (essai + 1))); }
            }
            if (!annule && docSnap.exists()) {
              const saved = docSnap.data();
              const seedAJour = saved.seedVersion === SEED_VERSION;
              
              if (saved.positions) {
                const hasIbkr = saved.positions.some((p) => p.accountId === "ibkr");
                setPositions(hasIbkr ? saved.positions : [...saved.positions, ...stockPositions.filter((p) => p.accountId === "ibkr")]);
              }
              if (saved.monthly) {
                if (seedAJour) setMonthly(saved.monthly);
                else {
                  // Nouvel historique SYNTHESE : on remplace tous les anciens relevés importés, on garde les saisies de l'app
                  setMonthly([...initialMonthlySnapshots, ...saved.monthly.filter((m) => m.source !== "csv")]);
                }
              }
              if (saved.weekly) setWeeklyArchive(saved.weekly);
              if (saved.transfers) setTransfers(saved.transfers);
              if (saved.recurringTransfers) setRecurringTransfers(saved.recurringTransfers);
              if (saved.budget) {
                setBudgetTx(saved.budget.tx || []);
                setBudgetRules(saved.budget.rules || {});
                setBudgetLimits(saved.budget.limits || {});
                if (saved.budget.forecast) setForecast(saved.budget.forecast);
                if (saved.budget.categories) { applyCustomCategories(saved.budget.categories); setCustomCats(saved.budget.categories); }
                // Remboursements de notes de frais classés avant la création de leur catégorie
                setBudgetTx((prev) => prev.map((x) => (!x.manual && x.cat === "Autres revenus" && x.amt > 0 && /expense note|exp notes?|note de frais/i.test(x.detail || "") ? { ...x, cat: "Paiement note de frais" } : x)));
              }
            }
          } catch (e) {
            console.error("Erreur de chargement Firebase:", e);
            if (!annule) setLoadError(e?.code === "permission-denied" ? "accès refusé par Firebase" : e?.message || String(e));
            return;
          }
          if (!annule) setLoaded(true);
        })();
        return () => { annule = true; };
      }, []);

      useEffect(() => {
        if (!loaded || loadError) return;
        setSaveStatus("saving");
        const delai = setTimeout(async () => {
          try {
            const payload = {
              positions,
              monthly,
              weekly: weeklyArchive,
              transfers,
              recurringTransfers,
              // Budget (opérations bancaires + catégories apprises) : dans le même document, seul autorisé en écriture
              // Montants vides ("") gardés tels quels : pas de valeur undefined pour Firestore
              budget: { tx: budgetTx, rules: budgetRules, limits: budgetLimits, categories: customCats, forecast },
              seedVersion: SEED_VERSION,
              derniereMiseAJour: new Date().toISOString()
            };
            // Firestore limite un document à 1 Mo
            const taille = new Blob([JSON.stringify(payload)]).size;
            if (taille > 1000000) throw new Error(`données trop volumineuses (${Math.round(taille / 1024)} Ko, maximum 1 000 Ko)`);
            await setDoc(docRef, payload);
            setSaveStatus("saved"); 
            setSaveError("");
            setLastSaved(new Date());
          } catch (e) {
            console.error("Erreur de sauvegarde Firebase:", e);
            setSaveStatus("erreur");
            setSaveError(e?.code === "permission-denied" ? "accès refusé par Firebase" : e?.message || String(e));
          }
        }, 800); 
        return () => clearTimeout(delai);
      }, [positions, monthly, weeklyArchive, transfers, recurringTransfers, budgetTx, budgetRules, budgetLimits, customCats, forecast, loaded]);

      const handleBudgetImport = async (files) => {
        const batches = []; // une liste d'opérations par fichier
        const warnings = [];
        let skippedCurrency = 0, skippedState = 0, controles = 0;
        for (const file of files) {
          try {
            const pdfPages = file.name.toLowerCase().endsWith(".pdf") ? await readPdfPages(file) : null;
            if (pdfPages && isRevolutPdf(pdfPages)) {
              const parsed = parseRevolutPdfPages(pdfPages);
              if (!parsed.ops.length) throw new Error("aucune opération trouvée dans ce relevé Revolut");
              if (parsed.ecarts) warnings.push(`${file.name} : ${parsed.ecarts} ligne${parsed.ecarts > 1 ? "s" : ""} ne retombe${parsed.ecarts > 1 ? "nt" : ""} pas sur le solde affiché — vérifiez-les`);
              else controles++;
              batches.push(revolutPdfTransactions(parsed, budgetRules));
            } else if (pdfPages) {
              const parsed = parseLclPages(pdfPages);
              if (!parsed.ops.length) throw new Error("aucune opération trouvée (seuls les relevés de compte LCL en PDF sont reconnus)");
              const total = parsed.ancienSolde + parsed.ops.reduce((s, o) => s + o.amt, 0);
              if (parsed.ancienSolde !== null && parsed.nouveauSolde !== null && Math.abs(total - parsed.nouveauSolde) > 0.01) {
                warnings.push(`${file.name} : le total lu (${fmtEURcents(total)}) ne retombe pas sur le solde du relevé (${fmtEURcents(parsed.nouveauSolde)}) — vérifiez ses opérations`);
              } else if (parsed.nouveauSolde !== null) controles++;
              batches.push(lclTransactions(parsed, budgetRules));
            } else {
              const { headers, rows } = await readFileAsRows(file);
              if (!headers?.length) throw new Error("fichier vide ou illisible");
              const r = parseRevolutRows(headers, rows, budgetRules);
              if (!r.transactions.length) throw new Error("aucune opération en euros trouvée");
              batches.push(r.transactions);
              skippedCurrency += r.skippedCurrency; skippedState += r.skippedState;
            }
          } catch (e) {
            warnings.push(`${file.name} : ${e.message || "lecture impossible"}`);
          }
        }
        const transactions = batches.flat();
        if (!transactions.length) throw new Error(warnings.join(" · ") || "aucune opération trouvée");
        // Opérations déjà présentes (même si vous avez changé leur catégorie depuis) : ignorées, rien n'est dupliqué
        const merged = mergeImportedTx(budgetTx, batches);
        const { fresh, recat, settled, dup } = merged;
        setBudgetTx((prev) => applyMergedTx(prev, merged));
        const ds = transactions.map((tx) => tx.d).sort();
        const parts = [`${fresh.length} nouvelle${fresh.length > 1 ? "s" : ""} opération${fresh.length > 1 ? "s" : ""} (du ${new Date(ds[0]).toLocaleDateString("fr-FR")} au ${new Date(ds[ds.length - 1]).toLocaleDateString("fr-FR")})`];
        if (dup) parts.push(`${dup} déjà importée${dup > 1 ? "s" : ""} (ignorée${dup > 1 ? "s" : ""}, catégories conservées)`);
        if (settled.size) parts.push(`${settled.size} opération${settled.size > 1 ? "s" : ""} en attente finalisée${settled.size > 1 ? "s" : ""}`);
        if (recat.size) parts.push(`${recat.size} catégorie${recat.size > 1 ? "s" : ""} automatique${recat.size > 1 ? "s" : ""} mise${recat.size > 1 ? "s" : ""} à jour`);
        if (controles) parts.push(`soldes vérifiés sur ${controles} relevé${controles > 1 ? "s" : ""} PDF ✓`);
        if (skippedCurrency) parts.push(`${skippedCurrency} hors euros ignorée${skippedCurrency > 1 ? "s" : ""}`);
        if (skippedState) parts.push(`${skippedState} annulée${skippedState > 1 ? "s" : ""} ignorée${skippedState > 1 ? "s" : ""}`);
        // Analyse du dernier mois terminé couvert par ces relevés
        const apres = applyMergedTx(budgetTx, merged);
        const moisApres = buildBudgetMonths(apres);
        const importes = buildBudgetMonths(transactions);
        const focus = lastCompleteMonth(importes);
        const alerte = focus ? budgetAlertText(analyzeBudgetMonth(moisApres, focus, budgetLimits)) : "";
        return { info: parts.join(" · "), warnings, focus, alerte };
      };
      // Changer la catégorie d'une ligne ne touche que cette ligne ; on demande ensuite s'il faut l'étendre
      // aux opérations au même libellé et la retenir pour les prochains relevés.
      const [catPrompt, setCatPrompt] = useState(null);
      const handleBudgetCategory = (tx, cat) => {
        setBudgetTx((prev) => prev.map((x) => (x.id === tx.id ? { ...x, cat, manual: true } : x)));
        const key = budgetKey(tx.desc);
        if (!key) return;
        const others = budgetTx.filter((x) => x.id !== tx.id && !x.manual && budgetKey(x.desc) === key && x.cat !== cat);
        if (!others.length && budgetRules[key] === cat) return;
        setCatPrompt({ tx, cat, key, others });
      };
      const applyCatPrompt = (withOthers) => {
        const { cat, key, others } = catPrompt;
        setBudgetRules((r) => ({ ...r, [key]: cat }));
        if (withOthers && others.length) {
          const ids = new Set(others.map((x) => x.id));
          setBudgetTx((prev) => prev.map((x) => (ids.has(x.id) ? { ...x, cat } : x)));
        }
        setCatPrompt(null);
      };
      // Commentaire : texte vide = suppression (pas de champ undefined, refusé par Firestore)
      const handleSetNote = (id, text) => {
        const v = String(text || "").trim();
        setBudgetTx((prev) => prev.map((x) => {
          if (x.id !== id) return x;
          const { note, ...rest } = x;
          return v ? { ...rest, note: v } : rest;
        }));
      };
      const handleBulkCategory = (ids, cat) => {
        const set = new Set(ids);
        setBudgetTx((prev) => prev.map((x) => (set.has(x.id) ? { ...x, cat, manual: true } : x)));
      };
      const handleSetBudgetLimit = (cat, value, periode = "mois") => setBudgetLimits((l) => {
        const n = { ...l };
        if (value === null || !(value > 0)) delete n[cat];
        else n[cat] = periode === "an" ? { montant: Math.round(value), periode: "an" } : Math.round(value);
        return n;
      });
      // Oublier une règle : les opérations qu'elle avait classées (hors choix manuels) reprennent leur catégorie automatique
      const handleDeleteBudgetRule = (key) => {
        const { [key]: _, ...rest } = budgetRules;
        setBudgetRules(rest);
        setBudgetTx((prev) => prev.map((x) => (!x.manual && budgetKey(x.desc) === key ? { ...x, cat: categorizeTx(x, rest) } : x)));
      };
      const handleDeleteBudgetMonth = (p) => setBudgetTx((prev) => prev.filter((tx) => !tx.d.startsWith(p)));
      const budgetMonths = useMemo(() => buildBudgetMonths(budgetTx), [budgetTx, customCats]);
      const catsVersion = customCats.map((c) => `${c.id}:${c.kind}`).join("|");
      const handleAddCategory = (id, kind) => {
        const name = String(id || "").trim();
        if (!name || BUDGET_CATEGORIES.some((c) => c.id.toLowerCase() === name.toLowerCase())) return false;
        setCustomCats((l) => [...l, { id: name, kind }]);
        return true;
      };
      // Supprimer une catégorie créée : ses opérations reprennent une catégorie automatique, ses règles et son budget disparaissent
      const handleDeleteCategory = (id) => {
        const reste = customCats.filter((c) => c.id !== id);
        applyCustomCategories(reste);
        const rules = Object.fromEntries(Object.entries(budgetRules).filter(([, c]) => c !== id));
        setCustomCats(reste);
        setBudgetRules(rules);
        setBudgetLimits(({ [id]: _, ...l }) => l);
        setBudgetTx((prev) => prev.map((x) => {
          if (x.cat !== id) return x;
          const { manual, ...rest } = x;
          return { ...rest, cat: categorizeTx(rest, rules) };
        }));
      };

      const handleReset = () => {
        setPositions(stockPositions);
        setMonthly(initialMonthlySnapshots);
        setWeeklyArchive([]);
        setTransfers(initialTransfers);
        setRecurringTransfers([]);
      };

      const handleExport = () => {
        const payload = { positions, monthly, weekly: weeklyArchive, transfers, recurringTransfers, budget: { transactions: budgetTx, rules: budgetRules, limits: budgetLimits, categories: customCats, forecast }, seedVersion: SEED_VERSION, exportedAt: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `patrimoine-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleImportFile = async (file) => {
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (data.positions) setPositions(data.positions);
          if (data.monthly) setMonthly(data.monthly);
          if (data.weekly) setWeeklyArchive(data.weekly);
          if (data.transfers) setTransfers(data.transfers);
          if (data.recurringTransfers) setRecurringTransfers(data.recurringTransfers);
          if (data.budget?.transactions) setBudgetTx(data.budget.transactions);
          if (data.budget?.rules) setBudgetRules(data.budget.rules);
          if (data.budget?.limits) setBudgetLimits(data.budget.limits);
          if (data.budget?.forecast) setForecast(data.budget.forecast);
          if (data.budget?.categories) { applyCustomCategories(data.budget.categories); setCustomCats(data.budget.categories); }
        } catch (e) {
          alert("Fichier de sauvegarde illisible");
        }
      };

      useEffect(() => {
        const today = new Date();
        setTransfers((trs) => {
          const toAdd = [];
          recurringTransfers.filter((rt) => rt.active).forEach((rt) => {
            dueOccurrences(rt, today).forEach((date) => {
              const dateKey = date.toISOString().slice(0, 10);
              const already = trs.some((tr) => tr.recurringId === rt.id && tr.departureDate.slice(0, 10) === dateKey)
                || toAdd.some((tr) => tr.recurringId === rt.id && tr.departureDate.slice(0, 10) === dateKey);
              if (!already) {
                toAdd.push({
                  id: `rt-${rt.id}-${dateKey}`,
                  sourceAccountId: rt.sourceAccountId,
                  destinationAccountId: rt.destinationAccountId,
                  label: rt.label,
                  amount: rt.amount,
                  departureDate: date.toISOString(),
                  status: "attente",
                  arrivalDate: null,
                  recurringId: rt.id,
                });
              }
            });
          });
          return toAdd.length ? [...trs, ...toAdd] : trs;
        });
      }, [recurringTransfers]);

      const handleAddTransfer = (tr) => setTransfers((trs) => [...trs, tr]);
      const handleValidateTransfer = (id, arrivalDate) =>
        setTransfers((trs) => trs.map((tr) => (tr.id === id ? { ...tr, status: "valide", arrivalDate } : tr)));
      const handleUnlinkTransfer = (id) =>
        setTransfers((trs) => trs.map((tr) => (tr.id === id ? { ...tr, consumedMonthly: false } : tr)));
      const handleAddRecurring = (rt) => setRecurringTransfers((rts) => [...rts, rt]);
      const handleToggleRecurring = (id) => setRecurringTransfers((rts) => rts.map((rt) => (rt.id === id ? { ...rt, active: !rt.active } : rt)));
      const handleDeleteRecurring = (id) => setRecurringTransfers((rts) => rts.filter((rt) => rt.id !== id));
      const handleImportPositions = (accountId, newPositions) =>
        setPositions((prev) => [...prev.filter((p) => p.accountId !== accountId), ...newPositions]);

      // Met à jour intelligemment les virements "orphelins" si on supprime un historique
      useEffect(() => {
        if (!loaded) return;
        const referencedMonthly = new Set(
          monthly.flatMap((m) => m.transferIds || [])
        );
        const orphans = transfers.filter((tr) => tr.consumedMonthly && !referencedMonthly.has(tr.id));
        if (orphans.length) {
          const idsToFix = new Set(orphans.map((tr) => tr.id));
          setTransfers((trs) => trs.map((tr) => (idsToFix.has(tr.id) ? { ...tr, consumedMonthly: false } : tr)));
        }
      }, [loaded, monthly, transfers]);

      const pendingMonthlyTransfers = useMemo(
        () => transfers.filter((tr) => tr.status === "valide" && !tr.consumedMonthly),
        [transfers]
      );

      const handleSaveMonthly = (snap, consumedTransferIds) => {
        setMonthly((m) => [...m, snap]);
        if (consumedTransferIds?.length) {
          setTransfers((trs) => trs.map((tr) => consumedTransferIds.includes(tr.id) ? { ...tr, consumedMonthly: true } : tr));
        }
      };

      // L'historique importé (source "csv") fait foi jusqu'à son dernier relevé : les saisies faites dans l'app
      // jusqu'à cette date (points mensuels, virements) sont déjà incluses et seraient comptées deux fois.
      const seedEnd = useMemo(
        () => monthly.filter((m) => m.source === "csv").reduce((max, m) => (m.date > max ? m.date : max), ""),
        [monthly]
      );
      const monthlyEff = useMemo(
        () => monthly.filter((m) => m.source === "csv" || m.date > seedEnd).sort((a, b) => new Date(a.date) - new Date(b.date)),
        [monthly, seedEnd]
      );

      const allFlows = useMemo(() => {
        const monthlyFlows = monthlyEff.flatMap((m) =>
          Object.entries(m.flows || {}).map(([accountId, amount]) => ({ id: `${m.id}-${accountId}`, accountId, date: m.date, amount }))
        );
        
        // On évite les doubles comptages : un virement intégré à un point mensuel est déjà dans ses flux
        const transferFlows = transfers
          .filter((tr) => tr.status === "valide" && !tr.consumedMonthly)
          .flatMap(transferToFlows);

        return [
          ...monthlyFlows,
          ...transferFlows.filter((f) => f.date > seedEnd),
        ];
      }, [monthlyEff, transfers, seedEnd]);

      const monthlyMetrics = useMemo(() => buildMonthlyMetrics(monthlyEff, allFlows), [monthlyEff, allFlows]);
      const yearlyMetrics = useMemo(() => buildYearlyMetrics(monthlyMetrics), [monthlyMetrics]);
      // Plan vs réel : recalculé à chaque relevé de patrimoine, modification du prévisionnel ou import de relevés bancaires
      const suiviPlan = useMemo(() => buildSuiviPlan(forecast, budgetMonths, budgetLimits, monthlyMetrics), [forecast, budgetMonths, budgetLimits, monthlyMetrics, catsVersion]);
      const categoryAlloc = useMemo(() => aggregatePositions(positions, "category"), [positions]);
      const sectorAlloc = useMemo(() => aggregateSectors(positions), [positions]);

      const lastMonthly = monthlyEff[monthlyEff.length - 1];
      const monthlyWarnings = useMemo(
        () => monthly.filter((m) => m.warning).sort((a, b) => new Date(a.date) - new Date(b.date)),
        [monthly]
      );
      const lastMetric = monthlyMetrics[monthlyMetrics.length - 1];
      const cumGainRevenus = monthlyMetrics.reduce((s, m) => s + m.gainRevenus, 0);
      const cumVersements = monthlyMetrics.reduce((s, m) => s + m.savings, 0);
      const cumGain = monthlyMetrics.reduce((s, m) => s + m.gain, 0);
      // Variation réelle du patrimoine vs le mois précédent (épargne, trésorerie comprise, + gain de placement)
      const totalWealthChange = lastMetric ? lastMetric.monthChange : 0;
      const lastMonthWealthPrev = lastMetric ? lastMetric.wealth - totalWealthChange : 0;
      const lastMonthVariationPct = lastMonthWealthPrev ? totalWealthChange / lastMonthWealthPrev : 0;
      const investedNow = lastMetric?.invested || 0;
      const cumGainPct = investedNow ? cumGain / investedNow : 0;
      // Moyennes ramenées à 12 mois sur toute la période suivie (années partielles comprises)
      const monthsTracked = (() => {
        if (monthlyMetrics.length < 2) return 0;
        const [y0, m0] = monthlyMetrics[0].periode.split("-").map(Number);
        const [y1, m1] = lastMetric.periode.split("-").map(Number);
        return (y1 - y0) * 12 + (m1 - m0);
      })();
      const avgAnnualGainPlacement = monthsTracked ? (cumGain / monthsTracked) * 12 : 0;
      const avgAnnualGainRevenus = monthsTracked ? (cumGainRevenus / monthsTracked) * 12 : 0;
      const avgAnnualVersements = monthsTracked ? (cumVersements / monthsTracked) * 12 : 0;

      const yearlyYields = yearlyMetrics.filter(y => y.startWealth > 0);
      const avgYield = yearlyYields.length > 0 
        ? yearlyYields.reduce((s, y) => s + y.yieldPct, 0) / yearlyYields.length 
        : 0;

      const [chatOpen, setChatOpen] = useState(false);
      const [chatSeed, setChatSeed] = useState(null);
      const askClaude = (label, value) => {
        setChatSeed({ text: `Explique-moi le chiffre « ${label} : ${value} ». Comment est-il calculé ?`, n: Date.now() });
        setChatOpen(true);
      };
      const chatContext = useMemo(() => buildChatContext({
        monthlyEff, monthlyMetrics, yearlyMetrics, positions, transfers, budgetMonths,
        kpis: {
          "Patrimoine total": fmtEUR(lastMonthly?.totalWealth),
          "Variation sur le dernier mois": `${fmtEUR(totalWealthChange)} (${fmtPct(lastMonthVariationPct)})`,
          "Gain lié aux placements": `${fmtEUR(cumGain)}, soit ${fmtPct(cumGainPct)} du capital investi (${fmtEUR(investedNow)})`,
          "Gain lié aux revenus (revenus - dépenses)": fmtEUR(cumGainRevenus),
          "Épargne versée cumulée": fmtEUR(cumVersements),
          "Gain placement moyen / an": `${fmtEUR(avgAnnualGainPlacement)} (sur ${monthsTracked} mois)`,
          "Gain revenus moyen / an": `${fmtEUR(avgAnnualGainRevenus)} (sur ${monthsTracked} mois)`,
          "Épargne versée moyenne / an": `${fmtEUR(avgAnnualVersements)} (sur ${monthsTracked} mois)`,
          "Rendement annuel moyen": fmtPct(avgYield),
        },
      }), [monthlyEff, monthlyMetrics, yearlyMetrics, positions, transfers, budgetMonths]);

      const NAV_ITEMS = [
        { id: "dashboard", label: "Tableau de bord", short: "Accueil", icon: LayoutDashboard },
        { id: "positions", label: "Positions", short: "Positions", icon: Briefcase },
        { id: "budget", label: "Budget", short: "Budget", icon: Receipt },
        { id: "operations", label: "Opérations", short: "Opérations", icon: List },
        { id: "previsionnel", label: "Prévisionnel", short: "Prévision", icon: Target },
        { id: "virements", label: "Virements", short: "Virements", icon: ArrowLeftRight },
        { id: "historique", label: "Historique", short: "Historique", icon: History },
      ];

      const handleLogout = () => {
        signOut(auth).catch((error) => console.error("Erreur déconnexion:", error));
      };

      if (loadError) {
        return (
          <div className="min-h-screen w-full flex items-center justify-center p-6" style={{ background: t.bg }}>
            <div className="max-w-md text-center space-y-3">
              <p className="text-base font-semibold" style={{ color: t.loss }}>Impossible de lire vos données</p>
              <p className="text-sm" style={{ color: t.textMuted }}>{loadError}</p>
              <p className="text-sm" style={{ color: t.textMuted }}>Rien n'a été enregistré : vos données sauvegardées ne sont pas modifiées. Vérifiez votre connexion puis réessayez.</p>
              <button onClick={() => window.location.reload()} className="text-sm px-4 py-2 rounded-lg" style={{ background: t.accent, color: t.onAccent }}>Réessayer</button>
            </div>
          </div>
        );
      }
      if (!loaded) {
        return (
          <div className="min-h-screen w-full flex items-center justify-center" style={{ background: t.bg }}>
            <p className="text-sm" style={{ color: t.textMuted }}>Chargement du patrimoine…</p>
          </div>
        );
      }

      return (
        <ThemeCtx.Provider value={t}>
          <div className="min-h-screen w-full" style={{ background: t.bg }}>
            <div className="sticky top-0 z-40" style={{ background: `${t.bg}d9`, backdropFilter: "blur(12px)", WebkitBackdropFilter: "blur(12px)", borderBottom: `1px solid ${t.border}`, paddingTop: "env(safe-area-inset-top)" }}>
              <div className="max-w-6xl mx-auto px-4 md:px-6 py-3 md:py-4">
                <div className="flex items-center justify-between gap-3">
                  <div className="flex items-center gap-3 min-w-0">
                    <span className="w-9 h-9 md:w-10 md:h-10 shrink-0 rounded-xl flex items-center justify-center" style={{ background: `linear-gradient(135deg, ${t.s1}, ${t.s7})` }}>
                      <Wallet size={18} color="#ffffff" />
                    </span>
                    <div className="min-w-0">
                      <h1 className="text-base font-semibold tracking-tight" style={{ color: t.text }}>Mon patrimoine</h1>
                      <p className="text-xs truncate" style={{ color: t.textMuted }}>
                        {isMobile ? "Relevé du " : "Dernier relevé le "}
                        {new Date(lastMonthly.date).toLocaleDateString("fr-FR", isMobile ? { day: "numeric", month: "short", year: "numeric" } : { day: "numeric", month: "long", year: "numeric" })}
                        {saveStatus === "saving" && " · Enregistrement…"}
                        {saveStatus === "saved" && lastSaved && ` · ${isMobile ? "" : "Sauvegardé à "}${lastSaved.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`}
                        {saveStatus === "erreur" && <span style={{ color: t.loss }} title={saveError}> · Échec de la sauvegarde{saveError && !isMobile ? ` : ${saveError}` : ""}</span>}
                      </p>
                    </div>
                  </div>

                  {isMobile ? (
                    <div className="flex items-center gap-1 relative">
                      <button onClick={() => setChatOpen(true)} title="Demander à Claude" className="p-2.5 rounded-xl" style={{ color: t.textMuted }}>
                        <MessageCircle size={18} />
                      </button>
                      <button onClick={() => setThemeName((n) => (n === "dark" ? "light" : "dark"))} title="Changer de thème" className="p-2.5 rounded-xl" style={{ color: t.textMuted }}>
                        {themeName === "dark" ? <Sun size={18} /> : <Moon size={18} />}
                      </button>
                      <button onClick={() => setMenuOpen((o) => !o)} title="Plus d'actions" className="p-2.5 rounded-xl" style={{ color: t.text, background: menuOpen ? t.panelAlt : "transparent" }}>
                        <MoreHorizontal size={18} />
                      </button>
                      {menuOpen && (
                        <>
                          <div className="fixed inset-0 z-40" onClick={() => setMenuOpen(false)} />
                          <div className="absolute right-0 top-12 z-50 w-60 rounded-2xl p-1.5" style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadow }}>
                            <button onClick={() => { handleExport(); setMenuOpen(false); }} className="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm text-left" style={{ color: t.text }}>
                              <Download size={16} /> Télécharger une sauvegarde
                            </button>
                            <label className="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm cursor-pointer" style={{ color: t.text }}>
                              <Upload size={16} /> Restaurer une sauvegarde
                              <input type="file" accept="application/json" className="hidden"
                                onChange={(e) => { e.target.files[0] && handleImportFile(e.target.files[0]); setMenuOpen(false); }} />
                            </label>
                            <div className="px-3 py-2"><ResetButton onConfirm={() => { handleReset(); setMenuOpen(false); }} /></div>
                            <div className="my-1" style={{ borderTop: `1px solid ${t.border}` }} />
                            <button onClick={handleLogout} className="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm text-left" style={{ color: t.loss }}>
                              <LogOut size={16} /> Se déconnecter
                            </button>
                          </div>
                        </>
                      )}
                    </div>
                  ) : (
                  <div className="flex items-center gap-1.5">
                    <ResetButton onConfirm={handleReset} />
                    <button onClick={handleExport} title="Télécharger une sauvegarde JSON" className="p-2 rounded-lg transition-colors" style={{ color: t.textMuted }}>
                      <Download size={16} />
                    </button>
                    <label title="Restaurer une sauvegarde JSON" className="p-2 rounded-lg cursor-pointer" style={{ color: t.textMuted }}>
                      <Upload size={16} />
                      <input type="file" accept="application/json" className="hidden"
                        onChange={(e) => e.target.files[0] && handleImportFile(e.target.files[0])} />
                    </label>
                    <button onClick={() => setThemeName((n) => (n === "dark" ? "light" : "dark"))} title="Changer de thème" className="p-2 rounded-lg transition-colors" style={{ color: t.textMuted }}>
                      {themeName === "dark" ? <Sun size={16} /> : <Moon size={16} />}
                    </button>
                    <button onClick={handleLogout} title="Se déconnecter" className="p-2 rounded-lg transition-colors" style={{ color: t.textMuted }}>
                      <LogOut size={16} />
                    </button>
                    <button onClick={() => setChatOpen(true)} title="Poser une question sur vos chiffres"
                      className="flex items-center gap-1.5 pl-3 pr-4 py-2 rounded-xl text-sm font-medium ml-1"
                      style={{ background: t.panelAlt, color: t.text, border: `1px solid ${t.border}` }}>
                      <MessageCircle size={15} /> Demander à Claude
                    </button>
                    <button
                      onClick={openMonthlyModal}
                      className="flex items-center gap-1.5 pl-3 pr-4 py-2 rounded-xl text-sm font-medium ml-1"
                      style={{ background: t.accent, color: t.onAccent, boxShadow: `0 4px 14px ${t.accent}55` }}
                    >
                      <Plus size={15} /> Point mensuel
                    </button>
                  </div>
                  )}
                </div>
                {!isMobile && (
                  <div className="flex items-center gap-1 p-1 rounded-xl mt-4 w-fit" style={{ background: t.panelAlt, border: `1px solid ${t.border}` }}>
                    {NAV_ITEMS.map((n) => (
                      <button
                        key={n.id}
                        onClick={() => goTab(n.id)}
                        className="whitespace-nowrap px-4 py-1.5 text-sm rounded-lg transition-all"
                        style={{
                          color: tab === n.id ? t.text : t.textMuted,
                          background: tab === n.id ? t.panel : "transparent",
                          boxShadow: tab === n.id ? t.shadow : "none",
                          fontWeight: tab === n.id ? 600 : 400,
                        }}
                      >
                        {n.label}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="max-w-6xl mx-auto px-3 md:px-6 pt-4 md:py-8 pb-32 md:pb-8" style={{ fontFamily: FONT }}>
              {tab === "dashboard" && (
                <div className="space-y-3 md:space-y-5">
                  <WarningsPanel items={monthlyWarnings} onOpen={() => setTab("historique")} />

                  <div className="rounded-2xl p-4 md:p-7" style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadow }}>
                    <div className="flex flex-wrap items-end justify-between gap-4 mb-4">
                      <div>
                        <div className="text-sm font-medium" style={{ color: t.textMuted }}>Patrimoine total</div>
                        <div className="text-4xl md:text-5xl font-semibold tracking-tight mt-1" style={{ color: t.text }}>{fmtEUR(lastMonthly.totalWealth)}</div>
                        <div className="flex flex-wrap items-center gap-2 mt-2 text-sm">
                          <span className="px-2 py-0.5 rounded-full font-medium"
                            style={{ color: totalWealthChange >= 0 ? t.gain : t.loss, background: `${totalWealthChange >= 0 ? t.gain : t.loss}1f` }}>
                            {totalWealthChange >= 0 ? "▲" : "▼"} {signed(totalWealthChange)} ({fmtPct(lastMonthVariationPct)})
                          </span>
                          <span style={{ color: t.textMuted }}>sur le dernier mois</span>
                          <button onClick={() => askClaude("Variation du patrimoine sur le dernier mois", `${signed(totalWealthChange)} (${fmtPct(lastMonthVariationPct)})`)}
                            title="Demander à Claude d'expliquer cette variation" className="p-1 rounded-lg" style={{ color: t.textMuted }}>
                            <MessageCircle size={15} />
                          </button>
                        </div>
                      </div>
                    </div>
                    <WealthChart data={monthlyMetrics} />
                  </div>

                  <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4">
                    <KPICard icon={TrendingUp} label="Gain lié aux placements" value={fmtEUR(cumGain)} onAsk={() => askClaude("Gain lié aux placements", fmtEUR(cumGain))}
                      sub={isMobile ? `${fmtPct(cumGainPct)} du capital investi` : `${fmtPct(cumGainPct)} du capital investi (${fmtEUR(investedNow)})`} tone={cumGain >= 0 ? "up" : "down"} />
                    <KPICard icon={Wallet} label="Gain lié aux revenus" value={fmtEUR(cumGainRevenus)} onAsk={() => askClaude("Gain lié aux revenus", fmtEUR(cumGainRevenus))}
                      sub={isMobile ? "Revenus − dépenses" : "Évolution du patrimoine − gain sur placements"} tone={cumGainRevenus >= 0 ? "up" : "down"} />
                    <KPICard icon={PiggyBank} label="Épargne versée cumulée" value={fmtEUR(cumVersements)} onAsk={() => askClaude("Épargne versée cumulée", fmtEUR(cumVersements))}
                      sub={isMobile ? "Virements vers placements" : "Versements nets vers les placements"} />
                    <KPICard icon={Percent} label="Gain placement moyen / an" value={fmtEUR(avgAnnualGainPlacement)} onAsk={() => askClaude("Gain placement moyen / an", fmtEUR(avgAnnualGainPlacement))}
                      sub={isMobile ? `Sur ${monthsTracked} mois` : `Ramené à 12 mois (sur ${monthsTracked} mois)`} />
                    <KPICard icon={Wallet} label="Gain revenus moyen / an" value={fmtEUR(avgAnnualGainRevenus)} onAsk={() => askClaude("Gain revenus moyen / an", fmtEUR(avgAnnualGainRevenus))}
                      sub={isMobile ? `Sur ${monthsTracked} mois` : `Ramené à 12 mois (sur ${monthsTracked} mois)`} />
                    <KPICard icon={PiggyBank} label="Épargne versée moyenne / an" value={fmtEUR(avgAnnualVersements)} onAsk={() => askClaude("Épargne versée moyenne / an", fmtEUR(avgAnnualVersements))}
                      sub={isMobile ? `Sur ${monthsTracked} mois` : `Ramené à 12 mois (sur ${monthsTracked} mois)`} />
                  </div>

                  {budgetMonths.length > 0 && (() => {
                    const b = budgetMonths.find((m) => m.periode === lastCompleteMonth(budgetMonths)) || budgetMonths[budgetMonths.length - 1];
                    const an = analyzeBudgetMonth(budgetMonths, b.periode, budgetLimits);
                    return (
                      <button type="button" onClick={() => goTab("budget")} className="w-full text-left rounded-2xl p-4 md:p-5 flex flex-wrap items-center gap-x-6 gap-y-2"
                        style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadow }}>
                        <span className="text-sm font-semibold flex items-center gap-2" style={{ color: t.text }}>
                          <Receipt size={16} color={t.accent} /> Budget de {monthLong(b.periode)}
                        </span>
                        {[["Salaires", fmtEUR(b.salaire)], ["Dépenses", fmtEUR(b.depenses)], ["Écart", signed(b.solde)]].map(([l, v]) => (
                          <span key={l} className="text-xs" style={{ color: t.textMuted }}>{l} <span className="text-sm font-semibold ml-1" style={{ color: t.text, ...NUM }}>{v}</span></span>
                        ))}
                        {an?.over.length > 0 && (
                          <span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{ color: t.loss, background: `${t.loss}1f` }}>
                            ⚠ {an.over.length} budget{an.over.length > 1 ? "s" : ""} dépassé{an.over.length > 1 ? "s" : ""}
                          </span>
                        )}
                        <ChevronRight size={16} color={t.textMuted} className="ml-auto" />
                      </button>
                    );
                  })()}

                  {suiviPlan?.dernier && (() => {
                    const d = suiviPlan.dernier;
                    const col = (v) => (v >= 0 ? t.gain : t.loss);
                    return (
                      <button type="button" onClick={() => goTab("previsionnel")} className="w-full text-left rounded-2xl p-4 md:p-5 flex flex-wrap items-center gap-x-6 gap-y-2"
                        style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadow }}>
                        <span className="text-sm font-semibold flex items-center gap-2" style={{ color: t.text }}>
                          <Target size={16} color={t.accent} /> Plan vs réel · {monthLong(d.periode)}
                        </span>
                        {[["Réel", fmtEUR(d.reel), null], ["Théorique", fmtEUR(d.theo), null], ["Écart du mois", signed(d.ecartMois), d.ecartMois], [`Depuis ${monthLabel(suiviPlan.debut)}`, signed(d.ecartCumul), d.ecartCumul]].map(([l, v, n]) => (
                          <span key={l} className="text-xs" style={{ color: t.textMuted }}>{l} <span className="text-sm font-semibold ml-1" style={{ color: n === null ? t.text : col(n), ...NUM }}>{v}</span></span>
                        ))}
                        <ChevronRight size={16} color={t.textMuted} className="ml-auto" />
                      </button>
                    );
                  })()}

                  <Panel title="Évolution mensuelle" subtitle="Ce que vos revenus (moins vos dépenses) et vos placements ont apporté au patrimoine, mois par mois"
                    action={
                      <div className="flex shrink-0 p-0.5 rounded-lg text-xs" style={{ background: t.panelAlt, border: `1px solid ${t.border}` }}>
                        {[[12, "12 mois"], [0, "Tout"]].map(([v, label]) => (
                          <button key={v} onClick={() => setMonthlyRange(v)} className="px-2.5 py-1 rounded-md"
                            style={{ background: monthlyRange === v ? t.panel : "transparent", color: monthlyRange === v ? t.text : t.textMuted, fontWeight: monthlyRange === v ? 600 : 400 }}>
                            {label}
                          </button>
                        ))}
                      </div>
                    }>
                    <MonthlyEvolutionChart data={monthlyRange ? monthlyMetrics.slice(-(monthlyRange + 1)) : monthlyMetrics} />
                  </Panel>

                  <Panel title="Bilan annuel" subtitle="Gain lié aux revenus, gain sur placements et variation du patrimoine par année">
                    <YearlyBarChart data={yearlyMetrics} />
                  </Panel>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                    <Panel title="Répartition par catégorie">
                      <AllocationDonut data={categoryAlloc} colorFor={(k) => CATEGORY_COLOR(t)[k] || t.textMuted} />
                      <div className="mt-2 space-y-1">
                        {categoryAlloc.map((c) => (
                          <div key={c.key} className="flex items-center justify-between text-xs">
                            <span className="flex items-center gap-2" style={{ color: t.textMuted }}>
                              <span className="w-2 h-2 rounded-full" style={{ background: CATEGORY_COLOR(t)[c.key] }} />
                              {c.key}
                            </span>
                            <span style={{ color: t.text }}>{(c.weight * 100).toFixed(0)} %</span>
                          </div>
                        ))}
                      </div>
                    </Panel>
                    <Panel title="Répartition sectorielle">
                      <AllocationDonut data={sectorAlloc} colorFor={(k, i) => SECTOR_PALETTE(t)[i % SECTOR_PALETTE(t).length]} />
                      <div className="mt-2 space-y-2">
                        {sectorAlloc.map((g, i) => (
                          <div key={g.key}>
                            <div className="flex items-center justify-between text-xs">
                              <span className="flex items-center gap-2" style={{ color: t.text, fontWeight: 600 }}>
                                <span className="w-2 h-2 rounded-full" style={{ background: SECTOR_PALETTE(t)[i % SECTOR_PALETTE(t).length] }} />
                                {g.key}
                              </span>
                              <span style={{ color: t.text, fontWeight: 600 }}>{fmtEUR(g.value)} · {(g.weight * 100).toFixed(0)} %</span>
                            </div>
                            {g.subs.length > 1 && g.subs.map((sub) => (
                              <div key={sub.key} className="flex items-center justify-between text-[11px] pl-5">
                                <span style={{ color: t.textMuted }}>{sub.key}</span>
                                <span style={{ color: t.textMuted }}>{fmtEUR(sub.value)} · {(sub.weight * 100).toFixed(1)} %</span>
                              </div>
                            ))}
                          </div>
                        ))}
                      </div>
                    </Panel>
                  </div>

                  <Panel title="Comptes bourse" subtitle="Valeur de chaque compte à chaque relevé">
                    <AccountsEvolutionChart series={monthlyEff} />
                  </Panel>
                </div>
              )}

              {tab === "positions" && (
                <Panel title={`Positions boursières (${positions.length} lignes)`}>
                  <PositionsImport onImport={handleImportPositions} />
                  <PositionsTable
                    positions={positions}
                    onUpdate={(id, patch) => setPositions((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)))}
                  />
                </Panel>
              )}

              {tab === "budget" && (
                <BudgetTab
                  catsVersion={catsVersion}
                  customCats={customCats}
                  onAddCategory={handleAddCategory}
                  onDeleteCategory={handleDeleteCategory}
                  transactions={budgetTx}
                  rules={budgetRules}
                  limits={budgetLimits}
                  onSetLimit={handleSetBudgetLimit}
                  onImport={handleBudgetImport}
                  onSetCategory={handleBudgetCategory}
                  onSetNote={handleSetNote}
                  onDeleteRule={handleDeleteBudgetRule}
                  onDeleteMonth={handleDeleteBudgetMonth}
                />
              )}

              {tab === "previsionnel" && (
                <ForecastTab months={budgetMonths} limits={budgetLimits} forecast={forecast} onChange={setForecast} releve={lastMonthly} onSetLimit={handleSetBudgetLimit} metrics={monthlyMetrics} suivi={suiviPlan} />
              )}

              {tab === "operations" && (
                <OperationsTab
                  catsVersion={catsVersion}
                  transactions={budgetTx}
                  onImport={handleBudgetImport}
                  onSetCategory={handleBudgetCategory}
                  onBulkCategory={handleBulkCategory}
                  onSetNote={handleSetNote}
                />
              )}

              {tab === "virements" && (
                <Panel title={`Virements (${transfers.length})`}>
                  <TransfersTab
                    transfers={transfers}
                    onAdd={handleAddTransfer}
                    onValidate={handleValidateTransfer}
                    onUnlink={handleUnlinkTransfer}
                    recurring={recurringTransfers}
                    onAddRecurring={handleAddRecurring}
                    onToggleRecurring={handleToggleRecurring}
                    onDeleteRecurring={handleDeleteRecurring}
                  />
                </Panel>
              )}

              {tab === "historique" && (
                <div className="space-y-3 md:space-y-6">
                  <WarningsPanel items={monthlyWarnings} />
                  <Panel title="Relevés mensuels" subtitle="Correction manuelle des valeurs et des mouvements">
                    <HistoryTab monthly={monthly} setMonthly={setMonthly} allFlows={allFlows} />
                  </Panel>
                </div>
              )}
            </div>
          </div>

          {isMobile && (
            <>
              <button onClick={openMonthlyModal} title="Nouveau point mensuel"
                className="fixed right-4 z-40 w-14 h-14 rounded-2xl flex items-center justify-center"
                style={{ bottom: "calc(76px + env(safe-area-inset-bottom))", background: t.accent, color: t.onAccent, boxShadow: `0 8px 24px ${t.accent}66` }}>
                <Plus size={24} />
              </button>
              <nav className="fixed bottom-0 inset-x-0 z-40 grid grid-cols-7"
                style={{ background: `${t.panel}f2`, backdropFilter: "blur(12px)", WebkitBackdropFilter: "blur(12px)", borderTop: `1px solid ${t.border}`, paddingBottom: "env(safe-area-inset-bottom)" }}>
                {NAV_ITEMS.map((n) => {
                  const Icon = n.icon;
                  const active = tab === n.id;
                  return (
                    <button key={n.id} onClick={() => goTab(n.id)} className="flex flex-col items-center gap-1 pt-2.5 pb-2 text-[10px] min-w-0"
                      style={{ color: active ? t.accent : t.textMuted, fontWeight: active ? 600 : 400 }}>
                      <span className="relative flex items-center justify-center w-12 h-7 rounded-full" style={{ background: active ? `${t.accent}1f` : "transparent" }}>
                        <Icon size={19} />
                        {n.id === "historique" && monthlyWarnings.length > 0 && (
                          <span className="absolute -top-0.5 right-1.5 w-2 h-2 rounded-full" style={{ background: t.warning }} />
                        )}
                      </span>
                      <span className="truncate max-w-full px-0.5">{n.short}</span>
                    </button>
                  );
                })}
              </nav>
            </>
          )}

          {catPrompt && (
            <CategoryPrompt prompt={catPrompt} onOnlyThis={() => setCatPrompt(null)}
              onRemember={() => applyCatPrompt(false)} onApplyAll={() => applyCatPrompt(true)} />
          )}

          <ClaudeChat open={chatOpen} onClose={() => setChatOpen(false)} seed={chatSeed} context={chatContext} uid={auth.currentUser?.uid} />

          <MonthlySnapshotModal
            key={monthlyModalKey}
            open={monthlyModalOpen}
            onClose={() => setMonthlyModalOpen(false)}
            onSave={handleSaveMonthly}
            lastByAccount={lastMonthly?.byAccount}
            onImportPositions={handleImportPositions}
            pendingTransfers={pendingMonthlyTransfers}
          />
        </ThemeCtx.Provider>
      );
    }

    // =========================================================================
    // ENVELOPPE D'AUTHENTIFICATION (RootApp)
    // =========================================================================
    function RootApp() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (loading) {
        return (
          <div className="min-h-screen w-full flex items-center justify-center bg-[#0e0f11]">
            <p className="text-sm text-[#a3a29b]">Vérification de l'accès...</p>
          </div>
        );
      }

      return user ? <PatrimoineApp /> : <LoginScreen />;
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<RootApp />);
  </script>
</body>
</html>
