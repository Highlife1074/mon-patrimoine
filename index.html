    // Fonctions de calcul
    function weeklyGainBourse(valueT, valuePrev, flows) {
      const netFlows = flows.reduce((s, f) => s + f.amount, 0);
      return valueT - valuePrev - netFlows;
    }

    function modifiedDietz(beginningValue, endingValue, flows, totalDays) {
      if (totalDays <= 0) return 0;
      const netFlows = flows.reduce((s, f) => s + f.amount, 0);
      const weightedFlows = flows.reduce((s, f) => {
        const weight = (totalDays - f.dayOfPeriod) / totalDays;
        return s + f.amount * weight;
      }, 0);
      const gain = endingValue - beginningValue - netFlows;
      const avgCapital = beginningValue + weightedFlows;
      return avgCapital !== 0 ? gain / avgCapital : 0;
    }

    function buildWeeklySeries(weeklySnapshots) {
      let cumGain = 0;
      let cumCapital = 0;
      return weeklySnapshots.map((snap, i) => {
        const prev = i === 0 ? null : weeklySnapshots[i - 1];
        const gain = prev ? weeklyGainBourse(snap.bourseValue, prev.bourseValue, snap.flows) : 0;
        const flowSum = snap.flows.reduce((s, f) => s + f.amount, 0);
        cumGain += gain;
        cumCapital += flowSum;
        return { ...snap, gain, cumGain, cumCapital, flowSum };
      });
    }
const CASH_ACCOUNTS = ["lcl", "revolut"];

function buildWealthDecomposition(monthlySnapshots, allCashFlows) {
  if (monthlySnapshots.length === 0) return [];
  const initial = monthlySnapshots[0].totalWealth;
  let cumFlows = 0;
  return monthlySnapshots.map((snap, i) => {
    if (i > 0) {
      const prevDate = monthlySnapshots[i - 1].date;
      const flowsInPeriod = allCashFlows
        // On exclut les mouvements de trésorerie pour ne sommer que l'argent investi/désinvesti
        .filter((f) => f.date > prevDate && f.date <= snap.date && !CASH_ACCOUNTS.includes(f.accountId))
        .reduce((s, f) => s + f.amount, 0);
      cumFlows += flowsInPeriod;
    }
    const capitalBase = initial + cumFlows;
    const gains = snap.totalWealth - capitalBase;
    return { date: snap.date, capital: Math.round(capitalBase), gains: Math.round(gains), total: snap.totalWealth };
  });
}

    function resampleToMonthly(snapshots) {
      const byPeriod = new Map();
      [...snapshots]
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .forEach((s) => {
          const key = s.periode || s.date.slice(0, 7);
          byPeriod.set(key, s);
        });
      return Array.from(byPeriod.entries())
        .sort((a, b) => a[0].localeCompare(b[0]))
        .map(([, s]) => s);
    }

    function cashBuffer(byAccount) {
      return (byAccount.lcl || 0) + (byAccount.revolut || 0);
    }

    function buildMonthlyMetrics(monthlySnapshots, allFlows) {
      const resampled = resampleToMonthly(monthlySnapshots);
      const decomposition = buildWealthDecomposition(resampled, allFlows);
      return decomposition.map((d, i) => {
        const prev = i === 0 ? null : decomposition[i - 1];
        const cash = prev ? cashBuffer(resampled[i].byAccount) - cashBuffer(resampled[i - 1].byAccount) : 0;
        const savings = prev ? d.capital - prev.capital : 0;
        const gainRaw = prev ? d.gains - prev.gains : 0;
        return {
          date: d.date,
          wealth: d.total,
          savings,
          cash,
          gain: gainRaw - cash,
          epargne: savings + cash,
          monthChange: savings + cash + (gainRaw - cash),
        };
      });
    }

    function buildYearlyMetrics(monthlyMetrics) {
  const byYear = new Map();
  monthlyMetrics.forEach((m) => {
    const y = new Date(m.date).getFullYear();
    if (!byYear.has(y)) byYear.set(y, { year: y, savings: 0, cash: 0, gain: 0, epargne: 0, endWealth: 0 });
    const acc = byYear.get(y);
    acc.savings += m.savings;
    acc.cash += m.cash;
    acc.gain += m.gain;
    acc.epargne += m.epargne;
    // La boucle écrasant la valeur, on conserve toujours le dernier mois de l'année
    acc.endWealth = m.wealth; 
  });
  
  const result = Array.from(byYear.values()).sort((a, b) => a.year - b.year);
  
  return result.map((y, i) => {
    const wealthChange = y.savings + y.cash + y.gain;
    // Valorisation N-1 (ou reconstituée pour la première année)
    const startWealth = i === 0 ? y.endWealth - wealthChange : result[i - 1].endWealth;
    const yieldPct = startWealth > 0 ? y.gain / startWealth : 0;
    return { ...y, wealthChange, startWealth, yieldPct };
  });
}

    function aggregateSectors(positions) {
      const totalValue = positions.reduce((s, p) => s + p.quantity * p.lastPrice, 0);

      positions.forEach((p) => {

        groups[g].count += 1;
        groups[g].subs[sub] = (groups[g].subs[sub] || 0) + v;

      return Object.values(groups)
        .map((g) => ({
          ...g,
          weight: totalValue ? g.value / totalValue : 0,
          subs: Object.entries(g.subs)
            .map(([key, value]) => ({ key, value, weight: totalValue ? value / totalValue : 0 }))
            .sort((a, b) => b.value - a.value),

    function num(raw) {
      if (raw === null || raw === undefined || raw === "") return NaN;
      if (typeof raw === "number") return isFinite(raw) ? raw : NaN;
      let s = String(raw).trim().replace(/[\u00A0\u202F]/g, " ");
      const negative = /^\(.*\)$/.test(s) || s.startsWith("-");
      s = s.replace(/[()€$£%\s]/g, "").replace(/^-/, "");
      const dernierPoint = s.lastIndexOf(".");
      const derniereVirgule = s.lastIndexOf(",");
      if (dernierPoint >= 0 && derniereVirgule >= 0) {
        const dec = dernierPoint > derniereVirgule ? "." : ",";
        const mil = dec === "." ? "," : ".";
        s = s.split(mil).join("").replace(dec, ".");
      } else if (dernierPoint >= 0 || derniereVirgule >= 0) {
        const sep = dernierPoint >= 0 ? "." : ",";
        const parts = s.split(sep);
        const milliers =
          parts.length > 2 ||
          (parts.length === 2 && parts[1].length === 3 && parts[0].length <= 3 && parts[0] !== "0" && /^\d+$/.test(parts[1]));
        s = milliers ? parts.join("") : parts.join(".");
      }
      const n = parseFloat(s);
      if (!isFinite(n)) return NaN;
      return negative ? -n : n;
    }

    function splitCSVLine(line, sep) {
      const cells = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"') {
            if (line[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; }
          } else {
            cur += ch;
          }
        } else if (ch === '"') {
          inQuotes = true;
        } else if (ch === sep) {
          cells.push(cur.trim());
          cur = "";
        } else {
          cur += ch;
        }
      }
      cells.push(cur.trim());
      return cells;
    }

    function parseCSV(text) {
      const lines = text.split(/\r\n|\n|\r/).filter((l) => l.trim() !== "");
      if (lines.length === 0) return { headers: [], rows: [] };
      const candidates = ["\t", ";", ",", "|"];
      let bestSep = ";", bestScore = -1;
      candidates.forEach((sep) => {
        const counts = lines.slice(0, 20).map((l) => splitCSVLine(l, sep).length);
        const avg = counts.reduce((a, b) => a + b, 0) / counts.length;
        const variance = counts.reduce((a, b) => a + (b - avg) ** 2, 0) / counts.length;
        const score = avg > 1 ? avg - variance : -1;
        if (score > bestScore) { bestScore = score; bestSep = sep; }
      });
      const grid = lines.map((l) => splitCSVLine(l, bestSep));
      const [headers, ...rows] = grid;
      return { headers, rows, separator: bestSep };
    }

    async function readFileAsRows(file) {
      const name = file.name.toLowerCase();
      if (name.endsWith(".csv") || name.endsWith(".txt") || name.endsWith(".tsv")) {
        return parseCSV(await file.text());
      }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const grid = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
      const headers = (grid[0] || []).map((h) => (h === null || h === undefined ? "" : String(h)));
      const rows = grid.slice(1).map((r) => headers.map((_, i) => (r[i] === null || r[i] === undefined ? "" : r[i])));
      return { headers, rows };
    }

    async function fetchIBKRLive() {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 500,
          messages: [
            {
              role: "user",
              content:
                "Utilise l'outil IBKR disponible pour récupérer le résumé de compte (net liquidation, " +
                "cash total, valeur des positions, devise). Réponds UNIQUEMENT avec un objet JSON strict, " +
                "sans texte autour et sans balises markdown, au format exact : " +
                '{"netLiquidation":0,"totalCashValue":0,"grossPositionValue":0,"currency":"EUR"}',
            },
          ],
          mcp_servers: [{ type: "url", url: "https://api.ibkr.com/v1/api/mcp", name: "ibkr-mcp" }],
        }),
      });
      if (!response.ok) throw new Error(`Requête API refusée (HTTP ${response.status})`);
      const data = await response.json();
      const textBlocks = (data.content || [])
        .filter((b) => b.type === "text")
        .map((b) => b.text)
        .join("\n");
      const cleaned = textBlocks.replace(/```json|```/g, "").trim();
      const jsonMatch = cleaned.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error("Réponse inattendue du connecteur IBKR.");
      const parsed = JSON.parse(jsonMatch[0]);
      return { ...parsed, asOf: new Date().toISOString().slice(0, 10) };
    }

      const [sortKey, setSortKey] = useState("value");
      const [sortDir, setSortDir] = useState("desc");
      const [filterCat, setFilterCat] = useState("all");
      const [filterAccount, setFilterAccount] = useState("all");
      const [selected, setSelected] = useState(() => new Set());
      const [bulkCategory, setBulkCategory] = useState("Fond de portefeuille");
      const [bulkSector, setBulkSector] = useState("");

      const toggleSelected = (id) =>
        setSelected((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });

      const enriched = useMemo(() => {
        const totalValue = positions.reduce((s, p) => s + p.quantity * p.lastPrice, 0);
        return positions.map((p) => {
          const value = p.quantity * p.lastPrice;
          const costTotal = p.quantity * p.costBasis;
          const pnl = value - costTotal;
          const pnlPct = costTotal ? pnl / costTotal : 0;
          return { ...p, value, pnl, pnlPct, weight: totalValue ? value / totalValue : 0 };
        });
      }, [positions]);

      const filtered = enriched
        .filter((p) => filterCat === "all" || p.category === filterCat)
        .filter((p) => filterAccount === "all" || p.accountId === filterAccount);

      const sorted = useMemo(() => {
        const arr = [...filtered];
        arr.sort((a, b) => {
          const dir = sortDir === "asc" ? 1 : -1;
          const av = a[sortKey], bv = b[sortKey];
          return typeof av === "string" ? av.localeCompare(bv) * dir : (av - bv) * dir;
        });
        return arr;
      }, [filtered, sortKey, sortDir]);

      const groups = useMemo(() => {
        if (groupBy === "none") return { "Toutes les lignes": sorted };
        const g = {};
        sorted.forEach((p) => {
          const k = groupBy === "sector" ? sectorGroup(p.sector) : p[groupBy] || "Non classé";
          (g[k] = g[k] || []).push(p);
        });
        return g;
      }, [sorted, groupBy]);

      const toggleSort = (key) => {
        if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
        else { setSortKey(key); setSortDir("desc"); }
      };

      const totalPortfolio = enriched.reduce((s, p) => s + p.value, 0);
      const categories = ["Fond de portefeuille", "Swing", "Spéculatif", "Non classé"];

      const Th = ({ label, k, className }) => (
        <th
          className={`text-left font-normal cursor-pointer select-none py-2 px-3 ${className || ""}`}
          style={{ color: t.textMuted }}
          onClick={() => toggleSort(k)}
        >
          {label}{sortKey === k ? (sortDir === "asc" ? " ↑" : " ↓") : ""}
        </th>
      );

      return (

          <div className="flex flex-wrap items-center gap-3 mb-4">
            <span className="text-xs" style={{ color: t.textMuted }}>Grouper par</span>
            {["category", "sector", "none"].map((g) => (

                onClick={() => setGroupBy(g)}
                className="text-xs px-3 py-1 rounded"
                style={{
                  background: groupBy === g ? t.accent : "transparent",
                  color: groupBy === g ? t.bg : t.textMuted,
                  border: `1px solid ${groupBy === g ? t.accent : t.border}`,

              >
                {g === "category" ? "Catégorie" : g === "sector" ? "Secteur" : "Aucun"}

            ))}

            <select
              value={filterCat}
              onChange={(e) => setFilterCat(e.target.value)}

              style={{ background: t.panelAlt, color: t.text, border: `1px solid ${t.border}` }}
            >
              <option value="all">Toutes catégories</option>
              {categories.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
            <select
              value={filterAccount}
              onChange={(e) => setFilterAccount(e.target.value)}
              className="text-xs px-2 py-1 rounded"
              style={{ background: t.panelAlt, color: t.text, border: `1px solid ${t.border}` }}

              <option value="all">Tous les comptes</option>

          </div>

          {selected.size > 0 && (

              <select

                onChange={(e) => setBulkCategory(e.target.value)}
                className="text-xs px-2 py-1 rounded"
                style={{ background: t.panel, color: t.text, border: `1px solid ${t.border}` }}

                {categories.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
              <button
                onClick={() => selected.forEach((id) => onUpdate?.(id, { category: bulkCategory }))}
                className="text-xs px-3 py-1 rounded"
                style={{ background: t.accent, color: t.bg }}

                Appliquer la catégorie

              <input
                type="text"

                style={{ background: t.panel, color: t.text, border: `1px solid ${t.border}` }}
              />
              <button
                onClick={() => { if (bulkSector.trim()) selected.forEach((id) => onUpdate?.(id, { sector: bulkSector.trim() })); }}
                className="text-xs px-3 py-1 rounded"
                style={{ background: t.accent, color: t.bg }}
              >
                Appliquer le secteur
              </button>
              <button
                onClick={() => setSelected(new Set())}
                className="text-xs px-2 py-1 rounded ml-auto"
                style={{ color: t.textMuted, border: `1px solid ${t.border}` }}
              >
                Désélectionner tout
              </button>
            </div>
          )}

          <div className="overflow-x-auto">
            <table className="w-full text-sm" style={{ fontFamily: "ui-monospace, monospace" }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${t.border}` }}>
                  <th className="py-2 px-3">
                    <input
                      type="checkbox"
                      checked={sorted.length > 0 && sorted.every((p) => selected.has(p.id))}
                      onChange={(e) =>
                        setSelected(e.target.checked ? new Set(sorted.map((p) => p.id)) : new Set())
                      }
                    />
                  </th>
                  <Th label="Titre" k="name" />
                  <Th label="Compte" k="accountId" />
                  <Th label="Qté" k="quantity" />
                  <Th label="PRU" k="costBasis" />
                  <Th label="Cours" k="lastPrice" />
                  <Th label="Valeur" k="value" />
                  <Th label="+/- value" k="pnl" />
                  <th className="text-left font-normal py-2 px-3" style={{ color: t.textMuted }}>Catégorie</th>
                  <th className="text-left font-normal py-2 px-3" style={{ color: t.textMuted }}>Secteur</th>
                  <Th label="% portef." k="weight" />
                </tr>
              </thead>
              <tbody>
                {Object.entries(groups).map(([groupName, rows]) => {
                  const groupValue = rows.reduce((s, p) => s + p.value, 0);
                  const groupWeight = totalPortfolio ? groupValue / totalPortfolio : 0;
                  const isOpen = expanded[groupName] !== false;
                  return (
                    <React.Fragment key={groupName}>
                      {groupBy !== "none" && (
                        <tr
                          className="cursor-pointer"
                          style={{ background: t.panelAlt }}
                          onClick={() => setExpanded((e) => ({ ...e, [groupName]: !isOpen }))}
                        >
                          <td className="py-2 px-3" />
                          <td className="py-2 px-3 flex items-center gap-1" style={{ color: t.text }} colSpan={1}>
                            {isOpen ? <ChevronDown size={14} /> : <ChevronRight size={14} />}
                            {groupBy === "category" ? <CategoryBadge category={groupName} /> : groupName}
                          </td>
                          <td className="py-2 px-3" style={{ color: t.textMuted }}>{rows.length} lignes</td>
                          <td className="py-2 px-3" />
                          <td className="py-2 px-3" />
                          <td className="py-2 px-3" />
                          <td className="py-2 px-3" style={{ color: t.text }}>{fmtEUR(groupValue)}</td>
                          <td className="py-2 px-3" />
                          <td className="py-2 px-3" />
                          <td className="py-2 px-3" />
                          <td className="py-2 px-3" style={{ color: t.accent }}>{(groupWeight * 100).toFixed(1)} %</td>
                        </tr>
                      )}
                      {isOpen && rows.map((p) => (
                        <tr key={p.id} style={{ borderBottom: `1px solid ${t.border}` }}>
                          <td className="py-2 px-3" onClick={(e) => e.stopPropagation()}>
                            <input type="checkbox" checked={selected.has(p.id)} onChange={() => toggleSelected(p.id)} />
                          </td>
                          <td className="py-2 px-3" style={{ color: t.text }}>
                            <div className="font-semibold">{p.ticker}</div>
                            <div className="text-xs" style={{ color: t.textMuted, fontFamily: "ui-sans-serif" }}>{p.name}</div>
                          </td>
                          <td className="py-2 px-3 text-xs" style={{ color: t.textMuted, fontFamily: "ui-sans-serif" }}>
                            {accounts.find((a) => a.id === p.accountId)?.name || p.accountId}
                          </td>
                          <td className="py-2 px-3" style={{ color: t.text }}>{p.quantity}</td>
                          <td className="py-2 px-3" style={{ color: t.textMuted }}>{fmtEURcents(p.costBasis)}</td>
                          <td className="py-2 px-3" style={{ color: t.text }}>{fmtEURcents(p.lastPrice)}</td>
                          <td className="py-2 px-3" style={{ color: t.text }}>{fmtEUR(p.value)}</td>
                          <td className="py-2 px-3" style={{ color: p.pnl >= 0 ? t.gain : t.loss }}>
                            <div className="flex items-center gap-1">
                              {p.pnl >= 0 ? <ArrowUpRight size={12} /> : <ArrowDownRight size={12} />}
                              {fmtEUR(p.pnl)} ({fmtPct(p.pnlPct)})
                            </div>
                          </td>
                          <td className="py-2 px-3">
                            <select
                              value={p.category}
                              onChange={(e) => onUpdate?.(p.id, { category: e.target.value })}
                              className="text-xs rounded px-1 py-1"
                              style={{ background: t.panelAlt, color: t.text, border: `1px solid ${t.border}`, fontFamily: "ui-sans-serif" }}
                            >
                              {["Fond de portefeuille", "Swing", "Spéculatif", "Non classé"].map((c) => <option key={c} value={c}>{c}</option>)}
                            </select>
                          </td>
                          <td className="py-2 px-3">
                            <input
                              type="text"
                              value={p.sector}
                              onChange={(e) => onUpdate?.(p.id, { sector: e.target.value })}
                              className="text-xs rounded px-1 py-1 w-28"
                              style={{ background: t.panelAlt, color: t.text, border: `1px solid ${t.border}`, fontFamily: "ui-sans-serif" }}
                            />
                          </td>
                          <td className="py-2 px-3" style={{ color: t.text }}>{(p.weight * 100).toFixed(1)} %</td>
                        </tr>
                      ))}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function dueOccurrences(rt, today) {
      const dates = [];
      let d = new Date(rt.startDate);
      let guard = 0;
      while (d <= today && guard < 1000) {
        dates.push(new Date(d));
        if (rt.frequency === "hebdomadaire") d.setDate(d.getDate() + 7);
        else d.setMonth(d.getMonth() + 1);
        guard++;
      }
      return dates;
    }

    function WeeklySnapshotModal({ open, onClose, onSave, lastByAccount, pendingTransfers, onImportPositions, editing }) {

      const [byAccount, setByAccount] = useState(() => {
        const init = {};
        BOURSE_ACCOUNTS.forEach((a) => { init[a.id] = editing ? (editing.byAccount?.[a.id] ?? 0) : (lastByAccount?.[a.id] ?? 0); });
        return init;
      });
      const [includedTransferIds, setIncludedTransferIds] = useState(() => pendingTransfers.map((tr) => tr.id));

      if (!open) return null;

      const bourseValue = Object.values(byAccount).reduce((s, v) => s + (Number(v) || 0), 0);
      const lastBourseValue = Object.values(lastByAccount || {}).reduce((s, v) => s + (Number(v) || 0), 0);
      const includedTransfers = pendingTransfers.filter((tr) => includedTransferIds.includes(tr.id));
      const newFlows = includedTransfers.flatMap(transferToFlows);
      const flows = editing ? [...(editing.flows || []), ...newFlows] : newFlows;
      const netFlows = flows.filter((f) => BOURSE_ACCOUNTS.some((a) => a.id === f.accountId)).reduce((s, f) => s + f.amount, 0);
      const impliedGain = bourseValue - lastBourseValue - netFlows;

      const toggleTransfer = (id) =>

      const handleSave = () => {

        setFileError("");
        setInfo("");
        setDetectedPositions([]);
        try {
          const parsed = await readFileAsRows(file);
          if (!parsed.headers || parsed.headers.length === 0) throw new Error("fichier vide ou illisible");
          const guess = parsed.headers.findIndex((h) => /valo|valeur|montant/i.test(h));
          const col = guess >= 0 ? guess : 0;
          setCsvValueCol(col);
          setCsvData(parsed);
          setDetectedPositions(parsePositionsFromRows(parsed.headers, parsed.rows, account.id));
          const total = parsed.rows.reduce((s, row) => { const v = num(row[col]); return s + (isNaN(v) ? 0 : v); }, 0);

          setInfo(`${parsed.rows.length} ligne${parsed.rows.length > 1 ? "s" : ""} · ${fmtEUR(total)}`);

    function WeeklyHistoryTab({ weekly, setWeekly, monthly, onEdit, setTransfers }) {
      const t = useTheme();
      const scrollRef = useRef(null);
      const sorted = useMemo(() => [...weekly].sort((a, b) => new Date(a.date) - new Date(b.date)), [weekly]);
      const displayed = useMemo(
        () => sorted.map((r, i) => ({ row: r, prev: i > 0 ? sorted[i - 1] : null })).reverse(),
        [sorted]
      );

      const monthlyById = useMemo(() => new Map(monthly.map((m) => [m.id, m])), [monthly]);
      const flowSumFor = (r) => {
        if (r.flows && r.flows.length > 0) {
          return r.flows
            .filter((f) => BOURSE_ACCOUNTS.some((a) => a.id === f.accountId))
            .reduce((s, f) => s + f.amount, 0);
        }
        const m = monthlyById.get(r.id.replace(/^w-/, ""));
        if (!m) return 0;
        return BOURSE_ACCOUNTS.reduce((s, a) => s + (m.flows?.[a.id] || 0), 0);
      };

      const cumGainById = useMemo(() => {
        const map = new Map();
        let cum = 0;
        sorted.forEach((r, i) => {
          if (i > 0) {
            const prev = sorted[i - 1];
            const variation = r.bourseValue - prev.bourseValue;
            cum += variation - flowSumFor(r);
          }
          map.set(r.id, cum);
        });
        return map;
      }, [sorted, monthlyById]);

      const updateValue = (id, accountId, value) => {
        setWeekly((rows) => rows.map((r) => {
          if (r.id !== id) return r;
          const byAccount = { ...r.byAccount, [accountId]: Number(value) || 0 };
          const bourseValue = Object.values(byAccount).reduce((s, v) => s + (Number(v) || 0), 0);
          return { ...r, byAccount, bourseValue: Math.round(bourseValue) };
        }));
      };

      const updateDate = (id, newDate) => {
        if (!newDate) return;
        setWeekly((rows) => rows.map((r) => (r.id === id ? { ...r, date: new Date(newDate).toISOString() } : r)));
      };

      const updateFlow = (id, value) => {
        const row = weekly.find((r) => r.id === id);
        const oldTransferIds = new Set(
          (row?.flows || [])
            .map((f) => String(f.id).replace(/-(src|dst)$/, ""))
            .filter((tid) => tid !== `${id}-manuel`)
        );
        setWeekly((rows) => rows.map((r) => {
          if (r.id !== id) return r;
          const amount = Number(value) || 0;
          return { ...r, flows: amount ? [{ id: `${id}-manuel`, accountId: null, date: r.date, amount }] : [] };
        }));
        if (oldTransferIds.size > 0) {
          setTransfers((trs) => trs.map((tr) => (oldTransferIds.has(tr.id) ? { ...tr, consumedWeekly: false } : tr)));
        }
      };

      const deleteRow = (id) => setWeekly((rows) => rows.filter((r) => r.id !== id));
      const cellStyle = { background: t.panelAlt, color: t.text, border: `1px solid ${t.border}`, fontFamily: "ui-monospace, monospace" };

      return (
        <div>
          <HScrollBar targetRef={scrollRef} />
          <div className="overflow-x-auto" ref={scrollRef}>
            <table className="text-xs" style={{ borderCollapse: "collapse" }}>
              <thead>
                <tr>
                  <th className="text-left py-2 px-2 sticky left-0 z-10" style={{ color: t.textMuted, background: t.panel }}>Date</th>
                  {BOURSE_ACCOUNTS.map((a) => (

    function HistoryTab({ monthly, setMonthly }) {
      const t = useTheme();
      const scrollRef = useRef(null);
      const sorted = useMemo(
        () => [...monthly].sort((a, b) => (a.periode || a.date.slice(0, 7)).localeCompare(b.periode || b.date.slice(0, 7)) || new Date(a.date) - new Date(b.date)),
        [monthly]
      );
      const displayed = useMemo(
        () => sorted.map((r, i) => ({ row: r, prev: i > 0 ? sorted[i - 1] : null })).reverse(),
        [sorted]
      );

      const periodeCounts = useMemo(() => {
        const counts = {};
        sorted.forEach((r) => { const p = r.periode || r.date.slice(0, 7); counts[p] = (counts[p] || 0) + 1; });
        return counts;
      }, [sorted]);

      const cumGainTotalById = useMemo(() => {
        const map = new Map();
        if (sorted.length === 0) return map;
        const first = sorted[0].totalWealth;
        sorted.forEach((r) => map.set(r.id, r.totalWealth - first));
        return map;
      }, [sorted]);

      const cumGainPlacementById = useMemo(() => {
        const map = new Map();
        let cum = 0;
        sorted.forEach((r, i) => {
          if (i > 0) {
            const prev = sorted[i - 1];
            const variation = r.totalWealth - prev.totalWealth;
            const totalMouvement = Object.values(r.flows || {}).reduce((s, v) => s + (Number(v) || 0), 0);
            cum += variation - totalMouvement;
          }
          map.set(r.id, cum);
        });
        return map;
      }, [sorted]);

      const cumGainEpargneById = useMemo(() => {
        const map = new Map();
        sorted.forEach((r) => map.set(r.id, (cumGainTotalById.get(r.id) || 0) - (cumGainPlacementById.get(r.id) || 0)));
        return map;
      }, [sorted, cumGainTotalById, cumGainPlacementById]);

      const updateValue = (id, accountId, value) => {
        setMonthly((rows) => rows.map((r) => {
          if (r.id !== id) return r;
          const byAccount = { ...r.byAccount, [accountId]: Number(value) || 0 };
          const totalWealth = Object.values(byAccount).reduce((s, v) => s + (Number(v) || 0), 0);
          return { ...r, byAccount, totalWealth };
        }));
      };

      const updateFlow = (id, accountId, value) => {
        setMonthly((rows) => rows.map((r) => (r.id === id ? { ...r, flows: { ...(r.flows || {}), [accountId]: Number(value) || 0 } } : r)));
      };

      const updateDate = (id, newDate) => {
        if (!newDate) return;
        setMonthly((rows) => rows.map((r) => (r.id === id ? { ...r, date: new Date(newDate).toISOString() } : r)));
      };

      const updatePeriode = (id, newPeriode) => {
        if (!newPeriode) return;
        setMonthly((rows) => rows.map((r) => (r.id === id ? { ...r, periode: newPeriode } : r)));
      };

      const deleteRow = (id) => setMonthly((rows) => rows.filter((r) => r.id !== id));
      const cellStyle = { background: t.panelAlt, color: t.text, border: `1px solid ${t.border}`, fontFamily: "ui-monospace, monospace" };
      const flowStyle = { ...cellStyle, background: t.panel, color: t.textMuted };

      return (
        <div>
          <HScrollBar targetRef={scrollRef} />
          <div className="overflow-x-auto" ref={scrollRef}>
            <table className="text-xs" style={{ borderCollapse: "collapse" }}>
              <thead>
                <tr>
                  <th className="text-left py-2 px-2 sticky left-0 z-10" style={{ color: t.textMuted, background: t.panel }}>Mois / Date</th>
                  {accounts.map((a) => (
                    <th key={a.id} className="text-right py-2 px-2" style={{ color: t.textMuted, whiteSpace: "nowrap" }}>{a.name}</th>
                  ))}
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }}>Total</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }}>Gain total</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }}>Gain placement</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }}>Gain épargne</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }}>Gain cumulé</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }}>Gain placement cumulé</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }}>Gain épargne cumulé</th>
                  <th className="py-2 px-2" />
                </tr>
              </thead>
              <tbody>
                {displayed.map(({ row: r, prev }) => {
                  const periode = r.periode || r.date.slice(0, 7);
                  const doublon = periodeCounts[periode] > 1;
                  const variation = prev ? r.totalWealth - prev.totalWealth : null;
                  const totalMouvement = Object.values(r.flows || {}).reduce((s, v) => s + (Number(v) || 0), 0);
                  const gainPlacement = prev ? variation - totalMouvement : null;
                  const gainEpargne = variation !== null && gainPlacement !== null ? variation - gainPlacement : null;
                  return (
                  <tr key={r.id} style={{ borderBottom: `1px solid ${t.border}` }}>
                    <td className="py-1 px-2 sticky left-0 z-10 align-top" style={{ background: t.panel }}>
                      <input
                        type="month"
                        value={periode}
                        onChange={(e) => updatePeriode(r.id, e.target.value)}
                        title="Mois comptable"
                        className="rounded px-1 py-1"
                        style={{ ...cellStyle, width: 118, borderColor: doublon ? t.accent : t.border, color: doublon ? t.accent : t.text }}
                      />
                      <input
                        type="date"
                        value={r.date.slice(0, 10)}
                        onChange={(e) => updateDate(r.id, e.target.value)}
                        title="Date exacte du relevé"
                        className="rounded px-1 py-1 mt-0.5"
                        style={{ ...cellStyle, width: 118, background: "transparent", color: t.textMuted }}
                      />
                    </td>
                    {accounts.map((a) => {
                      const val = r.byAccount[a.id] ?? 0;
                      const mvt = r.flows?.[a.id] ?? 0;
                      const prevVal = prev ? (prev.byAccount[a.id] ?? 0) : val;
                      const gain = prev ? val - prevVal - mvt : null;
                      return (
                        <td key={a.id} className="py-1 px-1 align-top">
                          <input
                            type="number"
                            value={val}
                            onChange={(e) => updateValue(r.id, a.id, e.target.value)}
                            className="w-24 rounded px-1 py-1 text-right"
                            style={cellStyle}
                          />
                          <input
                            type="number"
                            value={mvt}
                            placeholder="mvt"
                            title="Mouvement du mois (apport +, retrait -)"
                            onChange={(e) => updateFlow(r.id, a.id, e.target.value)}
                            className="w-24 rounded px-1 py-1 text-right mt-0.5"
                            style={flowStyle}
                          />
                          {gain !== null && (
                            <div className="text-right pr-1 mt-0.5" style={{ fontSize: 10, color: gain >= 0 ? t.gain : t.loss }}>
                              {gain >= 0 ? "+" : ""}{Math.round(gain)}
                            </div>
                          )}
                        </td>
                      );
                    })}
                    <td className="py-1 px-2 text-right align-top" style={{ color: t.text, fontFamily: "ui-monospace, monospace" }}>{fmtEUR(r.totalWealth)}</td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: variation === null ? t.textMuted : variation >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {variation === null ? "—" : `${variation >= 0 ? "+" : ""}${fmtEUR(variation)}`}
                    </td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: gainPlacement === null ? t.textMuted : gainPlacement >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {gainPlacement === null ? "—" : `${gainPlacement >= 0 ? "+" : ""}${fmtEUR(gainPlacement)}`}
                    </td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: gainEpargne === null ? t.textMuted : gainEpargne >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {gainEpargne === null ? "—" : `${gainEpargne >= 0 ? "+" : ""}${fmtEUR(gainEpargne)}`}
                    </td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: (cumGainTotalById.get(r.id) || 0) >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {(() => { const c = cumGainTotalById.get(r.id) || 0; return `${c >= 0 ? "+" : ""}${fmtEUR(c)}`; })()}
                    </td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: (cumGainPlacementById.get(r.id) || 0) >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {(() => { const c = cumGainPlacementById.get(r.id) || 0; return `${c >= 0 ? "+" : ""}${fmtEUR(c)}`; })()}
                    </td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: (cumGainEpargneById.get(r.id) || 0) >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {(() => { const c = cumGainEpargneById.get(r.id) || 0; return `${c >= 0 ? "+" : ""}${fmtEUR(c)}`; })()}
                    </td>
                    <td className="py-1 px-2 align-top">
                      <DeleteButton title="Supprimer ce point (double clic)" onConfirm={() => deleteRow(r.id)} />
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    const STORAGE_KEY = "patrimoine-state";
    const SEED_VERSION = 8;

    // =========================================================================
    // APPLICATION PRINCIPALE
    // =========================================================================
    function PatrimoineApp() {
      const [themeName, setThemeName] = useState("dark");
      const t = THEMES[themeName];
      const [positions, setPositions] = useState(stockPositions);
      const [monthly, setMonthly] = useState(initialMonthlySnapshots);
      const [weekly, setWeekly] = useState(() => {
        const m = initialMonthlySnapshots[initialMonthlySnapshots.length - 1];
        return [{
          id: `w-${m.id}`,
          date: m.date,
          byAccount: { cto: m.byAccount.cto, ibkr: m.byAccount.ibkr, pea_phil: m.byAccount.pea_phil, pea_ghiz: m.byAccount.pea_ghiz },
          bourseValue: m.byAccount.cto + m.byAccount.ibkr + m.byAccount.pea_phil + m.byAccount.pea_ghiz,
          flows: [],
        }];
      });
      const [transfers, setTransfers] = useState(initialTransfers);
      const [recurringTransfers, setRecurringTransfers] = useState([]);
      const [weeklyModalOpen, setWeeklyModalOpen] = useState(false);
      const [editingWeekly, setEditingWeekly] = useState(null);
      const [weeklyModalKey, setWeeklyModalKey] = useState(0);
      const [monthlyModalOpen, setMonthlyModalOpen] = useState(false);
      const [monthlyModalKey, setMonthlyModalKey] = useState(0);
      const [tab, setTab] = useState("dashboard");

      // Persistance Firebase
      const [loaded, setLoaded] = useState(false);
      const [saveStatus, setSaveStatus] = useState("idle"); 
      const [lastSaved, setLastSaved] = useState(null);
      const docRef = doc(db, "patrimoine", "mon_portefeuille");

      useEffect(() => {
        let annule = false;
        (async () => {
          try {
            const docSnap = await getDoc(docRef);
            if (!annule && docSnap.exists()) {
              const saved = docSnap.data();
              const seedAJour = saved.seedVersion === SEED_VERSION;
              
              if (saved.positions) {
                const hasIbkr = saved.positions.some((p) => p.accountId === "ibkr");
                setPositions(hasIbkr ? saved.positions : [...saved.positions, ...stockPositions.filter((p) => p.accountId === "ibkr")]);
              }
              if (saved.monthly) {
                if (seedAJour) setMonthly(saved.monthly);
                else {
                  const seedIds = new Set(initialMonthlySnapshots.map((m) => m.id));
                  setMonthly([...initialMonthlySnapshots, ...saved.monthly.filter((m) => !seedIds.has(m.id))]);
                }
              }
              if (saved.weekly) {
                const seedWeeklyId = `w-${initialMonthlySnapshots[initialMonthlySnapshots.length - 1].id}`;
                const userWeekly = saved.weekly.filter((w) => !/^w-m\d+$/.test(w.id) || w.id === seedWeeklyId);
                const hasSeed = userWeekly.some((w) => w.id === seedWeeklyId);
                setWeekly((init) => (hasSeed ? userWeekly : [...init, ...userWeekly]));
              }
              if (saved.transfers) setTransfers(saved.transfers);
              if (saved.recurringTransfers) setRecurringTransfers(saved.recurringTransfers);
            }
          } catch (e) {
            console.error("Erreur de chargement Firebase:", e);
          }
          if (!annule) setLoaded(true);
        })();
        return () => { annule = true; };
      }, []);

      useEffect(() => {
        if (!loaded) return; 
        setSaveStatus("saving");
        const delai = setTimeout(async () => {
          try {
            await setDoc(docRef, {
              positions,
              monthly,
              weekly,
              transfers,
              recurringTransfers,
              seedVersion: SEED_VERSION,
              derniereMiseAJour: new Date().toISOString()
            });
            setSaveStatus("saved"); 
            setLastSaved(new Date());
          } catch (e) {
            console.error("Erreur de sauvegarde Firebase:", e);
            setSaveStatus("erreur");
          }
        }, 800); 
        return () => clearTimeout(delai);
      }, [positions, monthly, weekly, transfers, recurringTransfers, loaded]);

      useEffect(() => {
        if (!loaded) return;
        const referenced = new Set(
          weekly.flatMap((w) => (w.flows || []).map((f) => String(f.id).replace(/-(src|dst)$/, "")))
        );
        const orphans = transfers.filter((tr) => tr.consumedWeekly && !referenced.has(tr.id));
        if (orphans.length) {
          const ids = new Set(orphans.map((tr) => tr.id));
          setTransfers((trs) => trs.map((tr) => (ids.has(tr.id) ? { ...tr, consumedWeekly: false } : tr)));
        }
      }, [loaded, weekly, transfers]);

      const handleReset = () => {
        setPositions(stockPositions);
        setMonthly(initialMonthlySnapshots);
        setWeekly(
          initialMonthlySnapshots.map((m) => ({
            id: `w-${m.id}`,
            date: m.date,
            byAccount: { cto: m.byAccount.cto, ibkr: m.byAccount.ibkr, pea_phil: m.byAccount.pea_phil, pea_ghiz: m.byAccount.pea_ghiz },
            bourseValue: m.byAccount.cto + m.byAccount.ibkr + m.byAccount.pea_phil + m.byAccount.pea_ghiz,
            flows: [],
          }))
        );
        setTransfers(initialTransfers);
        setRecurringTransfers([]);
      };

      const handleExport = () => {
        const payload = { positions, monthly, weekly, transfers, recurringTransfers, seedVersion: SEED_VERSION, exportedAt: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `patrimoine-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleImportFile = async (file) => {
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (data.positions) setPositions(data.positions);
          if (data.monthly) setMonthly(data.monthly);
          if (data.weekly) setWeekly(data.weekly);
          if (data.transfers) setTransfers(data.transfers);
          if (data.recurringTransfers) setRecurringTransfers(data.recurringTransfers);
        } catch (e) {
          alert("Fichier de sauvegarde illisible");
        }
      };

      const pendingValidatedTransfers = useMemo(
        () =>
          transfers.filter(
            (tr) =>
              tr.status === "valide" &&
              !tr.consumedWeekly &&
              BOURSE_ACCOUNTS.some((a) => a.id === tr.sourceAccountId || a.id === tr.destinationAccountId)
          ),
        [transfers]
      );

      useEffect(() => {
        const today = new Date();
        setTransfers((trs) => {
          const toAdd = [];
          recurringTransfers.filter((rt) => rt.active).forEach((rt) => {
            dueOccurrences(rt, today).forEach((date) => {
              const dateKey = date.toISOString().slice(0, 10);
              const already = trs.some((tr) => tr.recurringId === rt.id && tr.departureDate.slice(0, 10) === dateKey)
                || toAdd.some((tr) => tr.recurringId === rt.id && tr.departureDate.slice(0, 10) === dateKey);
              if (!already) {
                toAdd.push({
                  id: `rt-${rt.id}-${dateKey}`,
                  sourceAccountId: rt.sourceAccountId,
                  destinationAccountId: rt.destinationAccountId,
                  label: rt.label,
                  amount: rt.amount,
                  departureDate: date.toISOString(),
                  status: "attente",
                  arrivalDate: null,
                  consumedWeekly: false,
                  recurringId: rt.id,
                });
              }
            });
          });
          return toAdd.length ? [...trs, ...toAdd] : trs;
        });
      }, [recurringTransfers]);

      const handleSaveWeekly = (snapshot, consumedTransferIds, isEdit) => {
        setWeekly((w) => (isEdit ? w.map((x) => (x.id === snapshot.id ? snapshot : x)) : [...w, snapshot]));
        if (consumedTransferIds?.length) {
          setTransfers((trs) => trs.map((tr) => (consumedTransferIds.includes(tr.id) ? { ...tr, consumedWeekly: true } : tr)));
        }
      };
      
      const handleEditWeekly = (point) => { setEditingWeekly(point); setWeeklyModalKey((k) => k + 1); setWeeklyModalOpen(true); };
      const handleAddTransfer = (tr) => setTransfers((trs) => [...trs, tr]);
      const handleValidateTransfer = (id, arrivalDate) =>
        setTransfers((trs) => trs.map((tr) => (tr.id === id ? { ...tr, status: "valide", arrivalDate } : tr)));
      const handleUnlinkTransfer = (id) =>
        setTransfers((trs) => trs.map((tr) => (tr.id === id ? { ...tr, consumedWeekly: false } : tr)));
      const handleAddRecurring = (rt) => setRecurringTransfers((rts) => [...rts, rt]);
      const handleToggleRecurring = (id) => setRecurringTransfers((rts) => rts.map((rt) => (rt.id === id ? { ...rt, active: !rt.active } : rt)));
      const handleDeleteRecurring = (id) => setRecurringTransfers((rts) => rts.filter((rt) => rt.id !== id));
      const handleImportPositions = (accountId, newPositions) =>
        setPositions((prev) => [...prev.filter((p) => p.accountId !== accountId), ...newPositions]);

      const allFlows = useMemo(() => {
        const monthlyFlows = monthly.flatMap((m) =>
          Object.entries(m.flows || {}).map(([accountId, amount]) => ({ id: `${m.id}-${accountId}`, accountId, date: m.date, amount }))
        );
        const weeklyFlows = weekly.flatMap((s) => s.flows);
        const transferFlows = transfers.filter((tr) => tr.status === "valide").flatMap(transferToFlows);
        const consumedIds = new Set(weeklyFlows.map((f) => f.id));
        return [
          ...monthlyFlows,
          ...weeklyFlows,
          ...transferFlows.filter((f) => !consumedIds.has(f.id)),
        ];
      }, [monthly, weekly, transfers]);

      const monthlyMetrics = useMemo(() => buildMonthlyMetrics(monthly, allFlows), [monthly, allFlows]);
      const yearlyMetrics = useMemo(() => buildYearlyMetrics(monthlyMetrics), [monthlyMetrics]);
      const categoryAlloc = useMemo(() => aggregatePositions(positions, "category"), [positions]);
      const sectorAlloc = useMemo(() => aggregateSectors(positions), [positions]);

      const lastMonthly = monthly[monthly.length - 1];
      const lastWeek = weekly[weekly.length - 1];
      const lastMetric = monthlyMetrics[monthlyMetrics.length - 1];
      const cumSavings = monthlyMetrics.reduce((s, m) => s + m.epargne, 0);
      const cumGain = monthlyMetrics.reduce((s, m) => s + m.gain, 0);
      const totalWealthChange = lastMetric ? lastMetric.savings + lastMetric.gain : 0;
      const lastMonthWealthPrev = lastMetric ? lastMetric.wealth - totalWealthChange : lastMetric?.wealth || 1;
      const lastMonthVariationPct = lastMonthWealthPrev ? totalWealthChange / lastMonthWealthPrev : 0;
      const cumGainPct = cumSavings ? cumGain / (monthlyMetrics[0]?.wealth || 1) : 0;
      const avgAnnualGainPlacement = yearlyMetrics.length ? yearlyMetrics.reduce((s, y) => s + y.gain, 0) / yearlyMetrics.length : 0;
      const avgAnnualGainEpargne = yearlyMetrics.length ? yearlyMetrics.reduce((s, y) => s + y.epargne, 0) / yearlyMetrics.length : 0;
      const yearlyYields = yearlyMetrics.filter(y => y.startWealth > 0);
      const avgYield = yearlyYields.length > 0 
      ? yearlyYields.reduce((s, y) => s + y.yieldPct, 0) / yearlyYields.length 
      : 0;
      const NAV_ITEMS = [
        { id: "dashboard", label: "Tableau de bord" },
        { id: "positions", label: "Positions" },
        { id: "virements", label: "Virements" },
        { id: "historique", label: "Historique" },
      ];

      const handleLogout = () => {
        signOut(auth).catch((error) => console.error("Erreur déconnexion:", error));
      };

      if (!loaded) {
        return (
          <div className="min-h-screen w-full flex items-center justify-center" style={{ background: t.bg }}>
            <p className="text-sm" style={{ color: t.textMuted }}>Chargement du patrimoine…</p>
          </div>
        );
      }

      return (
        <ThemeCtx.Provider value={t}>
          <div className="min-h-screen w-full" style={{ background: t.bg }}>
            <div className="sticky top-0 z-40" style={{ background: t.bg, borderBottom: `1px solid ${t.border}` }}>
              <div className="max-w-6xl mx-auto px-6 pt-6">
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <h1 className="text-lg" style={{ color: t.text }}>Poste de pilotage patrimoine</h1>
                    <p className="text-xs" style={{ color: t.textMuted }}>
                      Dernier relevé mensuel au {fmtDate(lastMonthly.date)} · Bourse au {fmtDate(lastWeek.date)}
                      {" · "}
                      {saveStatus === "saving" && "Enregistrement…"}
                      {saveStatus === "saved" && lastSaved && `Sauvegardé à ${lastSaved.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`}
                      {saveStatus === "erreur" && <span style={{ color: t.loss }}>Échec de la sauvegarde</span>}
                    </p>
                  </div>
                  <div className="flex items-center gap-3">
                    <ResetButton onConfirm={handleReset} />
                    <button
                      onClick={handleExport}
                      title="Télécharger une sauvegarde JSON"
                      className="flex items-center gap-1 p-2 rounded text-xs"
                      style={{ border: `1px solid ${t.border}`, color: t.textMuted }}
                    >
                      <Download size={14} />
                    </button>
                    <label
                      title="Restaurer une sauvegarde JSON"
                      className="flex items-center gap-1 p-2 rounded text-xs cursor-pointer"
                      style={{ border: `1px solid ${t.border}`, color: t.textMuted }}
                    >
                      <Upload size={14} />
                      <input
                        type="file"
                        accept="application/json"
                        className="hidden"
                        onChange={(e) => e.target.files[0] && handleImportFile(e.target.files[0])}
                      />
                    </label>
                    <button
                      onClick={() => setThemeName((n) => (n === "dark" ? "light" : "dark"))}
                      className="p-2 rounded"
                      style={{ border: `1px solid ${t.border}`, color: t.textMuted }}
                    >
                      {themeName === "dark" ? <Sun size={16} /> : <Moon size={16} />}
                    </button>
                    <button
                      onClick={handleLogout}
                      title="Se déconnecter"
                      className="p-2 rounded"
                      style={{ border: `1px solid ${t.border}`, color: t.loss }}
                    >
                      <LogOut size={16} />
                    </button>
                    <button
                      onClick={() => { setMonthlyModalKey((k) => k + 1); setMonthlyModalOpen(true); }}
                      className="flex items-center gap-1 px-3 py-2 rounded text-sm"
                      style={{ border: `1px solid ${t.border}`, color: t.text }}
                    >
                      <Plus size={14} /> Point mensuel
                    </button>
                    <button
                      onClick={() => { setEditingWeekly(null); setWeeklyModalKey((k) => k + 1); setWeeklyModalOpen(true); }}
                      className="flex items-center gap-1 px-3 py-2 rounded text-sm"
                      style={{ background: t.accent, color: t.bg }}
                    >
                      <Plus size={14} /> Point hebdo
                    </button>
                  </div>
                </div>

                <div className="flex gap-1">
                  {NAV_ITEMS.map((n) => (
                    <button
                      key={n.id}
                      onClick={() => setTab(n.id)}
                      className="px-4 py-2 text-sm"
                      style={{
                        color: tab === n.id ? t.text : t.textMuted,
                        borderBottom: tab === n.id ? `2px solid ${t.accent}` : "2px solid transparent",
                      }}
                    >
                      {n.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="max-w-6xl mx-auto p-6">
              {tab === "dashboard" && (
                <div className="space-y-6">
                  <div className="flex flex-wrap gap-4">
                    <KPICard icon={Wallet} label="Patrimoine total" value={fmtEUR(lastMonthly.totalWealth)}
                      sub={`${totalWealthChange >= 0 ? "+" : ""}${fmtEUR(totalWealthChange)} vs mois dernier`}
                      highlight tone={totalWealthChange >= 0 ? "up" : "down"} />
                    <KPICard icon={TrendingUp} label="Gain lié aux placements" value={fmtEUR(cumGain)}
                      sub={fmtPct(cumGainPct)} tone={cumGain >= 0 ? "up" : "down"} />
                    <KPICard icon={PiggyBank} label="Épargne cumulée" value={fmtEUR(cumSavings)}
                      sub="Versements sur placements + variation trésorerie" tone={cumSavings >= 0 ? "up" : "down"} />
                    <KPICard icon={Percent} label="Variation du dernier mois" value={fmtPct(lastMonthVariationPct)}
                      sub="Épargne + gain du mois" tone={lastMonthVariationPct >= 0 ? "up" : "down"} />
                    <KPICard icon={TrendingUp} label="Gain placement moyen / an" value={fmtEUR(avgAnnualGainPlacement)}
                      sub={`Moyenne sur ${yearlyMetrics.length} an${yearlyMetrics.length > 1 ? "s" : ""}`} tone={avgAnnualGainPlacement >= 0 ? "up" : "down"} />
                    <KPICard icon={PiggyBank} label="Épargne moyenne / an" value={fmtEUR(avgAnnualGainEpargne)}
                      sub={`Moyenne sur ${yearlyMetrics.length} an${yearlyMetrics.length > 1 ? "s" : ""}`} tone={avgAnnualGainEpargne >= 0 ? "up" : "down"} />
                  </div>

                  <Panel title="Évolution mensuelle — épargne, placement et patrimoine total">
                    <MonthlyEvolutionChart data={monthlyMetrics} />
                  </Panel>

                  <Panel title="Bilan annuel — épargne, gain de placement et variation du patrimoine">
                    <YearlyBarChart data={yearlyMetrics} />
                  </Panel>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <Panel title="Répartition par catégorie">
                      <AllocationDonut data={categoryAlloc} colorFor={(k) => CATEGORY_COLOR(t)[k] || t.textMuted} />
                      <div className="mt-2 space-y-1">
                        {categoryAlloc.map((c) => (
                          <div key={c.key} className="flex items-center justify-between text-xs">
                            <span className="flex items-center gap-2" style={{ color: t.textMuted }}>
                              <span className="w-2 h-2 rounded-full" style={{ background: CATEGORY_COLOR(t)[c.key] }} />
                              {c.key}
                            </span>
                            <span style={{ color: t.text }}>{(c.weight * 100).toFixed(0)} %</span>
                          </div>
                        ))}
                      </div>
                    </Panel>
                    <Panel title="Répartition sectorielle">
                      <AllocationDonut data={sectorAlloc} colorFor={(k, i) => SECTOR_PALETTE(t)[i % SECTOR_PALETTE(t).length]} />
                      <div className="mt-2 space-y-2">
                        {sectorAlloc.map((g, i) => (
                          <div key={g.key}>
                            <div className="flex items-center justify-between text-xs">
                              <span className="flex items-center gap-2" style={{ color: t.text, fontWeight: 600 }}>
                                <span className="w-2 h-2 rounded-full" style={{ background: SECTOR_PALETTE(t)[i % SECTOR_PALETTE(t).length] }} />
                                {g.key}
                              </span>
                              <span style={{ color: t.text, fontWeight: 600 }}>{fmtEUR(g.value)} · {(g.weight * 100).toFixed(0)} %</span>
                            </div>
                            {g.subs.length > 1 && g.subs.map((sub) => (
                              <div key={sub.key} className="flex items-center justify-between text-[11px] pl-5">
                                <span style={{ color: t.textMuted }}>{sub.key}</span>
                                <span style={{ color: t.textMuted }}>{fmtEUR(sub.value)} · {(sub.weight * 100).toFixed(1)} %</span>
                              </div>
                            ))}
                          </div>
                        ))}
                      </div>
                    </Panel>
                  </div>

                  <Panel title="Évolution des comptes bourse — CTO Degiro, IBKR, PEA Phil, PEA Ghiz">
                    <AccountsEvolutionChart series={weekly} />
                  </Panel>
                </div>
              )}

              {tab === "positions" && (
                <Panel title={`Positions boursières (${positions.length} lignes)`}>
                  <PositionsImport onImport={handleImportPositions} />
                  <PositionsTable
                    positions={positions}
                    onUpdate={(id, patch) => setPositions((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)))}
                  />
                </Panel>
              )}

              {tab === "virements" && (
                <Panel title={`Virements (${transfers.length})`}>
                  <TransfersTab
                    transfers={transfers}
                    onAdd={handleAddTransfer}
                    onValidate={handleValidateTransfer}
                    onUnlink={handleUnlinkTransfer}
                    recurring={recurringTransfers}
                    onAddRecurring={handleAddRecurring}
                    onToggleRecurring={handleToggleRecurring}
                    onDeleteRecurring={handleDeleteRecurring}
                  />
                </Panel>
              )}

              {tab === "historique" && (
                <div className="space-y-6">
                  <Panel title="Points mensuels — correction manuelle" collapsible defaultCollapsed>
                    <HistoryTab monthly={monthly} setMonthly={setMonthly} />
                  </Panel>
                  <Panel title="Points hebdo — correction manuelle">
                    <WeeklyHistoryTab weekly={weekly} setWeekly={setWeekly} monthly={monthly} onEdit={handleEditWeekly} setTransfers={setTransfers} />
                  </Panel>
                </div>
              )}
            </div>
          </div>

          <WeeklySnapshotModal
            key={weeklyModalKey}
            open={weeklyModalOpen}
            onClose={() => { setWeeklyModalOpen(false); setEditingWeekly(null); }}
            onSave={handleSaveWeekly}
            lastByAccount={lastWeek?.byAccount}
            pendingTransfers={pendingValidatedTransfers}
            onImportPositions={handleImportPositions}
            editing={editingWeekly}
          />
          <MonthlySnapshotModal
            key={monthlyModalKey}
            open={monthlyModalOpen}
            onClose={() => setMonthlyModalOpen(false)}
            onSave={(snap) => setMonthly((m) => [...m, snap])}
            lastByAccount={lastMonthly?.byAccount}
            onImportPositions={handleImportPositions}
          />
        </ThemeCtx.Provider>
      );
    }

    // =========================================================================
    // ENVELOPPE D'AUTHENTIFICATION (RootApp)
    // =========================================================================
    function RootApp() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (loading) {
        return (
          <div className="min-h-screen w-full flex items-center justify-center bg-[#14171C]">
            <p className="text-sm text-[#B6BECE]">Vérification de l'accès...</p>
          </div>
        );
      }

      return user ? <PatrimoineApp /> : <LoginScreen />;
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<RootApp />);
  </script>
</body>
</html>
