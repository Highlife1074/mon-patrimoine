                      {months.map((m) => <th key={m} className="text-right font-medium py-1.5 px-2 whitespace-nowrap">{shortMonth(m)}</th>)}
                      <th className="text-right font-semibold py-1.5 pl-3" style={{ color: t.text }}>Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    {groups.map((g) => (
                      <React.Fragment key={g.kind}>
                        <tr><td colSpan={months.length + 2} className="pt-3 pb-1 font-semibold sticky left-0" style={{ color: t.text, background: t.panel }}>{KIND_LABEL[g.kind]}</td></tr>
                        {g.rows.map((r) => (
                          <tr key={r.cat} onClick={() => { setFilterCat(r.cat); setLimit(150); }} className="cursor-pointer" style={{ borderTop: `1px solid ${t.border}` }}>
                            <td className="py-1.5 pr-3 whitespace-nowrap sticky left-0" style={{ color: t.text, background: t.panel }}>{r.cat}</td>
                            {months.map((m) => {
                              const v = g.sign * (r.byMonth[m] || 0);
                              return <td key={m} className="text-right py-1.5 px-2" style={{ color: v ? t.text : t.border }}>{v ? Math.round(v).toLocaleString("fr-FR") : "–"}</td>;
                            })}
                            <td className="text-right py-1.5 pl-3 font-semibold" style={{ color: t.text }}>{Math.round(r.value).toLocaleString("fr-FR")}</td>
                          </tr>
                        ))}
                        <tr style={{ borderTop: `1px solid ${t.border}` }}>
                          <td className="py-1.5 pr-3 font-semibold sticky left-0" style={{ color: t.textMuted, background: t.panel }}>Total</td>
                          {months.map((m) => {
                            const v = g.rows.reduce((s, r) => s + g.sign * (r.byMonth[m] || 0), 0);
                            return <td key={m} className="text-right py-1.5 px-2 font-semibold" style={{ color: t.textMuted }}>{Math.round(v).toLocaleString("fr-FR")}</td>;
                          })}
                          <td className="text-right py-1.5 pl-3 font-semibold" style={{ color: t.text }}>{Math.round(g.total).toLocaleString("fr-FR")}</td>
                        </tr>
                      </React.Fragment>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Panel>

          <Panel title={`Mouvements (${visible.length})${visibleTotals.out ? ` · sorties ${fmtEUR(visibleTotals.out)}` : ""}${visibleTotals.in ? ` · entrées ${fmtEUR(visibleTotals.in)}` : ""}`}
            subtitle="Changer une catégorie ne modifie que la ligne choisie, puis l'app vous demande s'il faut l'étendre aux opérations au même libellé ; la sélection multiple ne change que les lignes cochées">
              <div className="flex flex-wrap gap-2 mb-3">
                <select value={filterKind} onChange={(e) => { setFilterKind(e.target.value); setFilterCat("all"); }} className="rounded-lg px-2 py-1.5 text-xs" style={select}>
                  <option value="all">Tous types</option>
                  {Object.entries(KIND_LABEL).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
                </select>
                <select value={filterCat} onChange={(e) => setFilterCat(e.target.value)} className="rounded-lg px-2 py-1.5 text-xs" style={select}>
                  <option value="all">Toutes catégories</option>
                  {BUDGET_CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.id}</option>)}
                </select>
              </div>
            {selected.size > 0 && (
              <div className="fixed z-50 left-3 right-3 md:left-1/2 md:right-auto md:-translate-x-1/2 flex flex-wrap items-center gap-2 rounded-xl px-3 py-2.5 text-xs"
                style={{ bottom: isMobile ? "calc(84px + env(safe-area-inset-bottom))" : 24, background: t.panel, border: `1px solid ${t.accent}`, boxShadow: t.shadow, color: t.text }}>
                <span className="font-semibold">{selected.size} sélectionnée{selected.size > 1 ? "s" : ""}</span>
                <span style={{ color: t.textMuted }}>→</span>
                <select value={bulkCat} onChange={(e) => setBulkCat(e.target.value)} className="rounded-lg px-2 py-1 text-xs" style={select}>
                  {BUDGET_CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.id}</option>)}
                </select>
                <button onClick={() => { onBulkCategory([...selected], bulkCat); setSelected(new Set()); }} className="px-3 py-1 rounded-lg font-medium" style={{ background: t.accent, color: t.onAccent }}>
                  Réaffecter
                </button>
                <button onClick={() => setSelected(new Set())} className="px-2 py-1 rounded-lg" style={{ color: t.textMuted }}>Annuler</button>
              </div>
            )}
            {shown.length > 0 && (
              <label className="flex items-center gap-2 text-xs mb-2 cursor-pointer" style={{ color: t.textMuted }}>
                <input type="checkbox" checked={allShownSelected}
                  onChange={() => setSelected((s) => { const n = new Set(s); shown.forEach((tx) => (allShownSelected ? n.delete(tx.id) : n.add(tx.id))); return n; })} />
                Tout cocher ({shown.length} lignes affichées)
              </label>
            )}
            {rowsByMonth.map(({ p, items }) => {
              const dep = items.filter((tx) => budgetKind(tx.cat) === "depense").reduce((s, tx) => s - tx.amt, 0);
              return (
                <div key={p} className="mb-3">
                  <div className="flex justify-between text-xs font-semibold py-1.5 capitalize" style={{ color: t.textMuted, borderBottom: `1px solid ${t.border}` }}>
                    <span className={p === "tri" ? "normal-case" : ""}>{p === "tri" ? `Triées par montant ${sortBy === "desc" ? "décroissant" : "croissant"}` : monthLong(p)}</span>
                    {dep !== 0 && <span className="normal-case" style={NUM}>dépenses affichées : {fmtEUR(dep)}</span>}
                  </div>
                  {items.map((tx) => {
                    const kind = budgetKind(tx.cat);
                    return (
                      <div key={tx.id} style={{ borderBottom: `1px solid ${t.border}` }}>
                      <div className="py-2 flex flex-col md:flex-row md:items-center gap-1 md:gap-3" style={{ opacity: kind === "neutre" ? 0.65 : 1 }}>
                        <div className="flex items-center gap-2 md:gap-3 flex-1 min-w-0">
                          <input type="checkbox" checked={selected.has(tx.id)} onChange={() => toggle(tx.id)} className="shrink-0" />
                          <span className="text-xs w-12 shrink-0" style={{ color: t.textMuted, ...NUM }}>{fmtDate(tx.d)}{sortBy !== "date" && <span className="block text-[10px]">{tx.d.slice(0, 4)}</span>}</span>
                          <span className="text-sm truncate flex-1" style={{ color: t.text }} title={tx.detail ? `${tx.desc} — ${tx.detail}` : tx.desc}>
                            {tx.desc}
                            {tx.detail && <span className="text-xs ml-1.5" style={{ color: t.textMuted }}>{tx.detail}</span>}
                            {sources.length > 1 && <span className="text-[10px] ml-1.5 px-1.5 py-0.5 rounded" style={{ background: t.panelAlt, color: t.textMuted }}>{sourceLabel(tx.src)}</span>}
                            {tx.manual && <span className="text-[10px] ml-1.5" style={{ color: t.textMuted }} title="Catégorie choisie à la main">✎</span>}
                          </span>
                          <span className="text-sm shrink-0 font-medium" style={{ color: tx.amt > 0 ? t.gain : t.text, ...NUM }}>
                            {tx.amt > 0 ? "+" : ""}{fmtEURcents(tx.amt)}
                          </span>
                        </div>
                        <div className="flex items-center gap-1">
                          <select value={tx.cat} onChange={(e) => onSetCategory(tx, e.target.value)} className="flex-1 rounded-lg px-2 py-1 text-xs md:w-48" style={select}>
                            {BUDGET_CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.id}</option>)}
                          </select>
                          <NoteButton tx={tx} editing={noteEdit === tx.id} onToggle={() => setNoteEdit(noteEdit === tx.id ? null : tx.id)} />
                        </div>
                      </div>
                      <NoteBlock tx={tx} editing={noteEdit === tx.id} onSave={(v) => { onSetNote(tx.id, v); setNoteEdit(null); }} onCancel={() => setNoteEdit(null)} />
                      </div>
                    );
                  })}
                </div>
              );
            })}
            {visible.length > limit && (
              <button onClick={() => setLimit((l) => l + 300)} className="w-full mt-2 py-2 rounded-lg text-sm" style={{ background: t.panelAlt, color: t.text, border: `1px solid ${t.border}` }}>
                Afficher plus ({visible.length - limit} restantes)
              </button>
            )}
            {!visible.length && <p className="text-sm" style={{ color: t.textMuted }}>Aucun mouvement pour ces filtres.</p>}
          </Panel>
        </div>
      );
    }

    // ================== ONGLET PRÉVISIONNEL (plan de trésorerie) ==================
    const newId = () => Math.random().toString(36).slice(2, 9);
    const MOIS_LONGS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
    const FREQS = [
      { id: "mois", label: "Chaque mois" },
      { id: "trimestre", label: "Chaque trimestre" },
      { id: "an", label: "Une fois par an" },
      { id: "once", label: "Une seule fois" },
    ];
    const periodeIndex = (p) => Number(p.slice(0, 4)) * 12 + Number(p.slice(5, 7)) - 1;
    const addMois = (p, n) => { const i = periodeIndex(p) + n; return `${Math.floor(i / 12)}-${String((i % 12) + 1).padStart(2, "0")}`; };
    const ymd = (d) => (!d ? "" : d.length === 7 ? `${d}-01` : d); // ancien format "AAAA-MM" → date
    const dateFr = (d) => new Date(`${ymd(d)}T00:00:00`).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });

    // Ligne du plan : { id, label, montant, freq, mois (1-12, « une fois par an »), debut, fin (dates "AAAA-MM-JJ" ou "") }
    // Les anciennes lignes { periode: "mois" | "an" } deviennent « chaque mois » / « une fois par an en décembre ».
    const normLigne = (l) => ({
      id: l.id || newId(), label: l.label || "", montant: l.montant ?? "",
      freq: l.freq || (l.periode === "an" ? "an" : "mois"),
      mois: l.mois || 12, debut: ymd(l.debut), fin: ymd(l.fin),
    });

    // Montant d'une ligne pour un mois donné (0 si hors période ou hors échéance). Seul le mois des dates compte.
    function montantLigne(l, p) {
      const v = Number(l.montant) || 0;
      if (!v) return 0;
      const du = l.debut ? l.debut.slice(0, 7) : "", au = l.fin ? l.fin.slice(0, 7) : "";
      if (l.freq === "once") return du === p ? v : 0;
      if (du && p < du) return 0;
      if (au && p > au) return 0;
      if (l.freq === "an") return Number(p.slice(5, 7)) === Number(l.mois) ? v : 0;
      if (l.freq === "trimestre") return (periodeIndex(p) - periodeIndex(du || `${p.slice(0, 4)}-01`)) % 3 === 0 ? v : 0;
      return v;
    }

    function resumeLigne(l) {
      const v = fmtEUR(Number(l.montant) || 0);
      const du = l.debut ? dateFr(l.debut) : null, au = l.fin ? dateFr(l.fin) : null;
      const bornes = du && au ? ` du ${du} au ${au}` : du ? ` à partir du ${du}` : au ? ` jusqu'au ${au}` : "";
      if (l.freq === "once") return du ? `${v} le ${du}` : "Choisissez la date";
      if (l.freq === "an") return `${v} chaque ${MOIS_LONGS[(l.mois || 12) - 1]}${bornes}`;
      if (l.freq === "trimestre") return `${v} par trimestre${bornes}`;
      return `${v} / mois${bornes}`;
    }

    // ================== PRÉVISIONNEL : CALCULS PARTAGÉS (onglet, tableau de bord) ==================
    const normForecast = (raw) => {
      const r = raw || {};
      return { rendement: "", horizon: 12, finVue: "", courantes: {}, inclureMoyennes: true, ...r,
        revenus: (r.revenus || []).map(normLigne), depenses: (r.depenses || []).map(normLigne) };
    };
    // Dépenses courantes par catégorie : montant de chaque mois (val), moyenne sur les périodes données…
    function planDepenses(fc, months, limits, periodes) {
      const cur = moisCourant();
      const last12 = months.filter((m) => m.periode < cur).slice(-12);
      const avg = (fn) => (last12.length ? last12.reduce((s, m) => s + fn(m), 0) / last12.length : 0);
      // Mois où la catégorie pèse le plus dans les relevés (proposé pour une dépense annuelle)
      const moisPic = (cat) => {
        const tot = Array(12).fill(0);
        months.forEach((m) => { tot[Number(m.periode.slice(5, 7)) - 1] += depenseCat(m, cat); });
        const max = Math.max(...tot);
        return max > 0 ? tot.indexOf(max) + 1 : Number(cur.slice(5, 7));
      };
      return BUDGET_CATEGORIES.filter((c) => c.kind === "depense").map((c) => {
        const L = getLimit(limits, c.id);
        const moy = avg((m) => depenseCat(m, c.id));
        const o = fc.courantes[c.id] || {};
        const freq = o.freq || (L && L.annual ? "an" : "mois");
        const mois = o.mois || moisPic(c.id);
        // Source du montant : budget, moyenne des 12 derniers mois terminés (suit chaque import de relevé) ou saisie manuelle
        const perso = o.montant !== undefined && o.montant !== "";
        const src = perso ? "manuel" : o.source === "moyenne" || !L ? "moyenne" : "budget";
        const annuel = src === "budget" ? (L.annual ? L.amount : L.amount * 12) : moy * 12;
        const sugg = freq === "an" ? annuel : annuel / 12;
        const source = [L ? `budget ${fmtEUR(L.amount)}/${L.annual ? "an" : "mois"}` : "pas de budget", `moyenne 12 mois ${fmtEUR(moy)}/mois`].join(" · ");
        const inclus = o.inclus ?? (!!L || (fc.inclureMoyennes && moy >= 1));
        // Dépense annuelle en plusieurs versements (vacances l'été et à Noël…) : [{ id, mois, montant }]
        const multi = freq === "an" && (o.echeances || []).length >= 2;
        const montant = multi ? o.echeances.reduce((s, e) => s + (Number(e.montant) || 0), 0) : perso ? Number(o.montant) || 0 : sugg;
        const echs = freq !== "an" ? [] : multi ? o.echeances : [{ id: "u", mois, montant }];
        // Montant d'un mois : celui saisi dans le plan de trésorerie (case remplie), sinon le montant du récapitulatif
        const parMois = o.parMois || {};
        const base = (p) => (freq === "an" ? echs.reduce((s, e) => s + (Number(p.slice(5, 7)) === Number(e.mois) ? Number(e.montant) || 0 : 0), 0) : montant);
        const val = (p) => (!inclus ? 0 : parMois[p] !== undefined && parMois[p] !== "" ? Number(parMois[p]) || 0 : base(p));
        const saisis = periodes.filter((p) => parMois[p] !== undefined && parMois[p] !== "").length;
        // Moyenne mensuelle sur la période affichée (cases saisies comprises) ; en €/an : ramenée à l'année
        const moyMois = periodes.reduce((s, p) => s + val(p), 0) / periodes.length;
        const effectif = saisis ? (freq === "an" ? moyMois * 12 : moyMois) : montant;
        return { cat: c.id, sugg, source, src: saisis ? "calendrier" : src, aBudget: !!L, moy, inclus, perso, freq, mois, multi, echs, montant: effectif, parMois, saisis, val, moyMois };
      });
    }
    // Rendement historique : gain sur placements de chaque année / patrimoine en début d'année, ramené à 12 mois
    // pour les années incomplètes (≥ 3 mois), puis moyenne des années
    function rendementHisto(metrics) {
      const parAn = new Map();
      metrics.forEach((m, i) => {
        if (i === 0) return;
        const y = m.periode.slice(0, 4);
        if (!parAn.has(y)) parAn.set(y, { annee: y, debut: metrics[i - 1].wealth, gain: 0, n: 0 });
        const a = parAn.get(y); a.gain += m.gain; a.n++;
      });
      const ans = [...parAn.values()].filter((a) => a.n >= 3 && a.debut > 0)
        .map((a) => ({ ...a, pct: (Math.pow(1 + a.gain / a.debut, 12 / a.n) - 1) * 100 }));
      return { ans, moyenne: ans.length ? ans.reduce((s, a) => s + a.pct, 0) / ans.length : 0 };
    }
    // Mode : épargne seule, épargne + rendement historique moyen, ou épargne + rendement personnalisé
    function tauxPlan(fc, histo) {
      const mode = fc.modeRendement || (Number(fc.rendement) ? "perso" : "aucun");
      const tauxAn = mode === "historique" ? histo.moyenne : mode === "perso" ? Number(fc.rendement) || 0 : 0;
      return { mode, tauxAn, tauxMois: Math.pow(1 + tauxAn / 100, 1 / 12) - 1 };
    }
    // Épargne prévue d'un mois : revenus prévus − dépenses courantes − dépenses planifiées
    function fluxPlan(fc, depRows, p) {
      const rev = fc.revenus.reduce((s, l) => s + montantLigne(l, p), 0);
      const dep = depRows.reduce((s, r) => s + r.val(p), 0) + fc.depenses.reduce((s, l) => s + montantLigne(l, p), 0);
      return { rev, dep, flux: rev - dep };
    }

    // Plan vs réel : à partir d'un relevé de départ, le plan actuel est appliqué mois après mois (patrimoine théorique)
    // et comparé à chaque relevé mensuel suivant. Écart du mois = réel − (réel du mois précédent + épargne et gains prévus).
    function buildSuiviPlan(raw, months, limits, metrics) {
      if (!metrics || metrics.length < 2) return null;
      const fc = normForecast(raw);
      const { tauxMois, tauxAn } = tauxPlan(fc, rendementHisto(metrics));
      const choix = metrics.slice(0, -1).map((m) => m.periode);
      const dernier = metrics[metrics.length - 1].periode;
      // Départ par défaut : dernier relevé de l'année précédente (suivi depuis le 1er janvier), sinon 12 mois avant
      const parDefaut = [...choix].reverse().find((p) => p < `${dernier.slice(0, 4)}-01`) || choix[Math.max(0, choix.length - 12)];
      const debut = choix.includes(fc.debutSuivi) ? fc.debutSuivi : parDefaut;
      const i0 = metrics.findIndex((m) => m.periode === debut);
      const deps = planDepenses(fc, months, limits, [moisCourant()]);
      let theo = metrics[i0].wealth;
      const rows = [];
      for (let i = i0 + 1; i < metrics.length; i++) {
        const prev = metrics[i - 1], m = metrics[i];
        // Mois sans relevé entre deux relevés : leur épargne prévue est comptée aussi
        let epargnePrevue = 0, gainsPrevus = 0, attendu = prev.wealth;
        for (let p = addMois(prev.periode, 1); p <= m.periode; p = addMois(p, 1)) {
          const f = fluxPlan(fc, deps, p).flux;
          const g = attendu * tauxMois;
          gainsPrevus += g; epargnePrevue += f; attendu += g + f;
          theo += theo * tauxMois + f;
        }
        rows.push({ periode: m.periode, reel: m.wealth, theo, ecartCumul: m.wealth - theo, attendu, ecartMois: m.wealth - attendu,
          epargnePrevue, epargneReelle: m.gainRevenus, gainsPrevus, gainsReels: m.gain });
      }
      return { debut, depart: metrics[i0].wealth, choix, tauxAn, tauxMois, rows, dernier: rows[rows.length - 1] || null, fc, deps };
    }

    // Date à taper ou à choisir dans le calendrier du navigateur ; pas de date antérieure au mois en cours
    function DateField({ value, onChange, style }) {
      return (
        <input type="date" value={value || ""} min={`${moisCourant()}-01`} onChange={(e) => onChange(e.target.value)}
          className="rounded-lg px-1.5 py-1 text-xs" style={{ ...style, colorScheme: "light dark" }} />
      );
    }

    // Champ montant validé à la sortie du champ ou avec Entrée (pas à chaque chiffre tapé)
    function CommitNumber({ value, onCommit, ...rest }) {
      const [draft, setDraft] = useState(null);
      const commit = () => { if (draft !== null && draft !== "" && Number(draft) !== value) onCommit(Number(draft)); setDraft(null); };
      return (
        <input type="number" inputMode="decimal" min="0" {...rest} value={draft ?? value} onChange={(e) => setDraft(e.target.value)}
          onBlur={commit} onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); if (e.key === "Escape") { setDraft(null); e.currentTarget.blur(); } }} />
      );
    }

    function PlanLine({ l, depense, onUpd, onDel }) {
      const t = useTheme();
      const input = { background: t.panel, color: t.text, border: `1px solid ${t.border}` };
      const lab = "text-[11px] flex items-center gap-1";
      return (
        <div className="rounded-xl p-2.5 space-y-2" style={{ background: t.panelAlt, border: `1px solid ${t.border}` }}>
          <div className="flex items-center gap-2">
            <input value={l.label} onChange={(e) => onUpd({ label: e.target.value })} placeholder={depense ? "Ex. : taxe foncière" : "Ex. : salaire Philippe"}
              className="flex-1 min-w-0 rounded-lg px-3 py-1.5 text-sm" style={input} />
            <input type="number" inputMode="decimal" min="0" value={l.montant} onChange={(e) => onUpd({ montant: e.target.value === "" ? "" : Number(e.target.value) })}
              placeholder="€" className="w-24 md:w-28 rounded-lg px-2 py-1.5 text-sm text-right" style={{ ...input, ...NUM }} />
            <button onClick={onDel} title="Supprimer" className="p-1 rounded shrink-0" style={{ color: t.textMuted }}><X size={14} /></button>
          </div>
          <div className="flex flex-wrap items-center gap-x-3 gap-y-1.5" style={{ color: t.textMuted }}>
            <select value={l.freq} onChange={(e) => onUpd({ freq: e.target.value })} className="rounded-lg px-1.5 py-1.5 text-xs" style={input}>
              {FREQS.map((f) => <option key={f.id} value={f.id}>{f.label}</option>)}
            </select>
            {l.freq === "an" && (
              <label className={lab}>en
                <select value={l.mois} onChange={(e) => onUpd({ mois: Number(e.target.value) })} className="rounded-lg px-1.5 py-1.5 text-xs" style={input}>
                  {MOIS_LONGS.map((m, i) => <option key={m} value={i + 1}>{m}</option>)}
                </select>
              </label>
            )}
            {l.freq === "once" ? (
              <label className={lab}>le <DateField value={l.debut} onChange={(v) => onUpd({ debut: v })} style={input} /></label>
            ) : (
              <>
                <label className={lab}>du <DateField value={l.debut} onChange={(v) => onUpd({ debut: v })} style={input} /></label>
                <label className={lab}>au <DateField value={l.fin} onChange={(v) => onUpd({ fin: v })} style={input} /></label>
              </>
            )}
          </div>
          <div className="text-[11px]" style={{ color: t.textMuted }}>{resumeLigne(l)}{l.freq !== "once" && !l.debut && !l.fin ? " (dates vides : sans limite)" : ""}</div>
        </div>
      );
    }

    const HORIZONS = [12, 24, 36, 60];

    function ForecastTab({ months, limits, forecast, onChange, releve, onSetLimit, metrics = [], suivi = null }) {
      const t = useTheme();
      const isMobile = useIsMobile();
      const fc = normForecast(forecast);
      const set = (patch) => onChange({ ...fc, ...patch });
      const cur = moisCourant();
      const input = { background: t.panel, color: t.text, border: `1px solid ${t.border}` };
      const btn = { border: `1px solid ${t.border}`, color: t.text, background: t.panelAlt };

      // Période : du mois en cours jusqu'à N mois plus tard, ou jusqu'à une date choisie
      const finChoisie = fc.finVue && fc.finVue.slice(0, 7) >= cur ? fc.finVue.slice(0, 7) : null;
      const nbMois = Math.min(240, finChoisie ? periodeIndex(finChoisie) - periodeIndex(cur) + 1 : Number(fc.horizon) || 12);
      const periodes = Array.from({ length: nbMois }, (_, i) => addMois(cur, i));
      const finP = periodes[periodes.length - 1];
      const [parAn, setParAn] = useState(false);

      // Moyennes sur les 12 derniers mois terminés (suggestions)
      const last12 = months.filter((m) => m.periode < cur).slice(-12);
      const avg = (fn) => (last12.length ? last12.reduce((s, m) => s + fn(m), 0) / last12.length : 0);

      // --- Dépenses courantes : chaque catégorie cochée ou non, mensuelle ou annuelle (à un mois donné),
      //     montant suggéré (budget ou moyenne) modifiable ---
      const depRows = planDepenses(fc, months, limits, periodes);
      // Plan de trésorerie : TOUS les postes de dépense ; récapitulatif : ceux qui ont un montant
      const depAll = [...depRows].sort((a, b) => (b.freq === "an" ? b.sugg / 12 : b.sugg) - (a.freq === "an" ? a.sugg / 12 : a.sugg) || a.cat.localeCompare(b.cat));
      const depRecap = depAll.filter((r) => r.sugg >= 1 || r.perso || r.inclus || r.saisis);
      const courMoyMois = depAll.reduce((s, r) => s + r.moyMois, 0);
      // Case du plan : vide = montant du récapitulatif ; saisir une valeur coche la catégorie
      const setCase = (r, p, v) => {
        const parMois = { ...r.parMois };
        if (v === "") delete parMois[p]; else parMois[p] = Number(v);
        setCour(r.cat, { parMois, ...(v !== "" && !r.inclus ? { inclus: true } : {}) });
      };
      function setCour(cat, patch) { set({ courantes: { ...fc.courantes, [cat]: { ...(fc.courantes[cat] || {}), ...patch } } }); }
      // Versements d'une dépense annuelle : le premier découpage partage le total en deux (mois choisi et 6 mois plus tard),
      // les suivants ajoutent un versement vide à compléter
      const ajouterVersement = (r) => {
        if (!r.multi) {
          const a = Math.round(r.montant / 2);
          return setCour(r.cat, { echeances: [{ id: newId(), mois: r.mois, montant: a }, { id: newId(), mois: ((r.mois + 5) % 12) + 1, montant: Math.round(r.montant) - a }] });
        }
        const last = r.echs[r.echs.length - 1];
        setCour(r.cat, { echeances: [...r.echs, { id: newId(), mois: (Number(last.mois) % 12) + 1, montant: "" }] });
      };
      const majVersement = (r, id, patch) => setCour(r.cat, { echeances: r.echs.map((e) => (e.id === id ? { ...e, ...patch } : e)) });
      const supprVersement = (r, id) => {
        const reste = r.echs.filter((e) => e.id !== id);
        if (reste.length >= 2) return setCour(r.cat, { echeances: reste });
        setCour(r.cat, { echeances: [], mois: Number(reste[0].mois), montant: reste[0].montant === "" ? "" : Number(reste[0].montant) });
      };
      // Les montants du prévisionnel deviennent les budgets (catégories cochées seulement ; les autres budgets restent tels quels)
      const versBudgets = () => {
        const aAppliquer = depRecap.filter((r) => r.inclus && r.montant > 0);
        if (!aAppliquer.length) return;
        const detail = aAppliquer.map((r) => `• ${r.cat} : ${fmtEUR(r.montant)} ${r.freq === "an" ? "/ an" : "/ mois"}`).join("\n");
        if (!window.confirm(`Remplacer les budgets de ${aAppliquer.length} catégorie(s) par les montants du prévisionnel ?\n\n${detail}\n\nLes catégories décochées gardent leur budget actuel.`)) return;
        aAppliquer.forEach((r) => onSetLimit(r.cat, r.montant, r.freq === "an" ? "an" : "mois"));
      };
      const toutCocher = (v) => set({ courantes: Object.fromEntries(depRecap.map((r) => [r.cat, { ...(fc.courantes[r.cat] || {}), inclus: v }])) });

      // --- Plan mois par mois ---
      const mensuel = periodes.map((p) => {
        const rev = fc.revenus.map((l) => montantLigne(l, p));
        const dep = fc.depenses.map((l) => montantLigne(l, p));
        const cat = depAll.map((r) => r.val(p));
        const prevRev = rev.reduce((s, v) => s + v, 0);
        const prevDep = cat.reduce((s, v) => s + v, 0) + dep.reduce((s, v) => s + v, 0);
        return { p, label: monthLabel(p), rev, dep, cat, prevRev, prevDep, flux: prevRev - prevDep };
      });
      // Point de départ : TOUT le patrimoine du dernier relevé. Chaque mois il reçoit l'épargne du mois
      // (revenus − dépenses) et, si un rendement est indiqué, le rendement mensuel équivalent sur le patrimoine du début de mois.
      const depart = releve ? Number(releve.totalWealth) || 0 : 0;
      // Rendement historique : gain sur placements de chaque année / patrimoine en début d'année, ramené à 12 mois
      // pour les années incomplètes (≥ 3 mois), puis moyenne des années
      const histo = rendementHisto(metrics);
      // Mode : épargne seule, épargne + rendement historique moyen, ou épargne + rendement personnalisé
      const { mode, tauxAn } = tauxPlan(fc, histo);
      const tauxMois = Math.pow(1 + tauxAn / 100, 1 / 12) - 1;
      let treso = depart, seule = depart;
      mensuel.forEach((c) => {
        c.rend = treso * tauxMois; treso += c.rend + c.flux; c.treso = treso; c.gain = treso - depart;
        seule += c.flux; c.seule = seule;
      });
      // Tableau par année si demandé : colonnes regroupées (années incomplètes comprises)
      const cols = !parAn ? mensuel : Object.values(mensuel.reduce((acc, c) => {
        const y = c.p.slice(0, 4);
        const g = acc[y] || (acc[y] = { p: y, label: y, n: 0, rev: c.rev.map(() => 0), dep: c.dep.map(() => 0), cat: c.cat.map(() => 0), prevRev: 0, prevDep: 0, flux: 0, rend: 0 });
        g.n++; c.rev.forEach((v, i) => (g.rev[i] += v)); c.dep.forEach((v, i) => (g.dep[i] += v)); c.cat.forEach((v, i) => (g.cat[i] += v));
        g.prevRev += c.prevRev; g.prevDep += c.prevDep; g.flux += c.flux; g.rend += c.rend; g.treso = c.treso; g.gain = c.gain;
        if (g.n < 12) g.label = `${y} (${g.n} m.)`; else g.label = y;
        return acc;
      }, {}));
      const sum = (fn) => mensuel.reduce((s, c) => s + fn(c), 0);
      const totRev = sum((c) => c.prevRev), totDep = sum((c) => c.prevDep);
      const totRend = sum((c) => c.rend), gainTotal = treso - depart;
      const moisReleve = releve ? (releve.periode || releve.date.slice(0, 7)) : null;
      const releveAncien = moisReleve && periodeIndex(cur) - periodeIndex(moisReleve) > 1;
      const libVue = `${monthLabel(cur)} → ${monthLabel(finP)}`;

      // --- Édition des lignes ---
      const updL = (kind, id, patch) => set({ [kind]: fc[kind].map((l) => (l.id === id ? { ...l, ...patch } : l)) });
      const delL = (kind, id) => set({ [kind]: fc[kind].filter((l) => l.id !== id) });
      const addL = (kind, preset = {}) => set({ [kind]: [...fc[kind], normLigne({ freq: "mois", ...preset })] });
      const prefill = () => {
        const sal = avg((m) => m.salaire);
        if (sal >= 1) addL("revenus", { label: "Salaires (moyenne des 12 derniers mois)", montant: Math.round(sal) });
      };

      // --- Tableau du plan de trésorerie ---
      // Lignes de même libellé (casse et espaces ignorés) regroupées en une seule ligne du tableau
      const groupes = (lignes, sansNom) => {
        const m = new Map();
        lignes.forEach((l, i) => {
          const key = (l.label || "").trim().toLowerCase() || `__${l.id}`;
          if (!m.has(key)) m.set(key, { key, label: (l.label || "").trim() || sansNom, idx: [] });
          m.get(key).idx.push(i);
        });
        return [...m.values()].map((g) => (g.idx.length > 1 ? { ...g, label: `${g.label} (${g.idx.length} lignes)` } : g));
      };
      const cell = "py-1.5 px-2 text-right whitespace-nowrap";
      const sticky = { position: "sticky", left: 0, background: t.panel, zIndex: 1 };
      const v0 = (v) => (Math.abs(v) < 0.5 ? <span style={{ color: t.textMuted, opacity: 0.5 }}>·</span> : fmtEUR(v));
      const signColor = (v) => (v >= 0 ? t.gain : t.loss);
      const Row = ({ label, vals, total, bold, color, top }) => (
        <tr style={{ borderTop: top ? `1px solid ${t.border}` : undefined }}>
          <td className="py-1.5 pr-3 text-left max-w-[180px] truncate" style={{ ...sticky, color: t.text, fontWeight: bold ? 600 : 400 }} title={label}>{label}</td>
          {vals.map((v, i) => <td key={i} className={cell} style={{ color: color ? color(v) : t.text, fontWeight: bold ? 600 : 400 }}>{v0(v)}</td>)}
          <td className={cell} style={{ color: t.text, fontWeight: 600 }}>{total === null ? "" : fmtEUR(total)}</td>
        </tr>
      );
      // Poste de dépense : une case par mois, à remplir directement (vide = montant du récapitulatif en dessous)
      const ligneCategorie = (r, i) => (
        <tr key={r.cat} style={{ opacity: r.inclus || r.saisis ? 1 : 0.55 }}>
          <td className="py-1 pr-3 text-left max-w-[180px] truncate" style={{ ...sticky, color: t.text }} title={`${r.cat}${r.inclus ? "" : " (non comptée)"}`}>
            {r.cat}{r.freq === "an" ? <span className="text-[10px] ml-1" style={{ color: t.textMuted }}>an</span> : null}
            {r.saisis > 0 && (
              <button onClick={() => setCour(r.cat, { parMois: {} })} title="Effacer les montants saisis mois par mois" className="ml-1 align-middle" style={{ color: t.textMuted }}>
                <RefreshCw size={10} />
              </button>
            )}
          </td>
          {cols.map((c) => {
            if (parAn) return <td key={c.p} className={cell} style={{ color: t.text }}>{v0(c.cat[i])}</td>;
            const v = r.parMois[c.p];
            const manuel = v !== undefined && v !== "";
            return (
              <td key={c.p} className="py-0.5 px-0.5 text-right">
                <input type="number" inputMode="decimal" min="0" value={manuel ? v : ""} placeholder={String(Math.round(r.inclus ? r.val(c.p) : 0))}
                  onChange={(e) => setCase(r, c.p, e.target.value)} title={`${r.cat} · ${monthLong(c.p)}${manuel ? " (saisi)" : ""}`}
                  className="w-[4.5rem] rounded px-1.5 py-1 text-xs text-right"
                  style={{ ...NUM, background: manuel ? `${t.accent}14` : "transparent", color: t.text, border: `1px solid ${manuel ? t.accent : t.border}` }} />
              </td>
            );
          })}
          <td className={cell} style={{ color: t.text, fontWeight: 600 }}>{fmtEUR(sum((c) => c.cat[i]))}</td>
        </tr>
      );
      const Section = ({ label }) => (
        <tr><td colSpan={cols.length + 2} className="pt-3 pb-1 text-[11px] uppercase tracking-wide font-semibold text-left" style={{ ...sticky, color: t.textMuted }}>{label}</td></tr>
      );

      const chartData = [
        { periode: moisReleve && moisReleve < cur ? moisReleve : addMois(cur, -1), treso: Math.round(depart), seule: Math.round(depart), gain: 0 },
        ...mensuel.map((c) => ({ periode: c.p, epargne: Math.round(c.flux), treso: Math.round(c.treso), seule: Math.round(c.seule), gain: Math.round(c.gain) })),
      ];
      // Courbe du patrimoine : relevés réels et trajectoire théorique du plan depuis le départ du suivi, puis projection.
      // La trajectoire théorique continue dans le futur : on voit si l'on est en avance ou en retard sur le plan.
      const chartPatri = (() => {
        if (!suivi || !suivi.rows.length) return chartData;
        const passe = [{ periode: suivi.debut, reel: Math.round(suivi.depart), theo: Math.round(suivi.depart) },
          ...suivi.rows.map((r) => ({ periode: r.periode, reel: Math.round(r.reel), theo: Math.round(r.theo) }))];
        const last = passe[passe.length - 1];
        last.treso = Math.round(depart); last.seule = Math.round(depart);
        let theo = suivi.dernier.theo, prevP = last.periode;
        const futur = chartData.slice(1).filter((c) => c.periode > prevP).map((c) => {
          for (let p = addMois(prevP, 1); p <= c.periode; p = addMois(p, 1)) theo += theo * tauxMois + fluxPlan(fc, depRows, p).flux;
          prevP = c.periode;
          return { ...c, theo: Math.round(theo) };
        });
        return [...passe, ...futur];
      })();
      const suiviLabel = (k) => ({ reel: "Patrimoine réel", theo: "Théorique (plan)", seule: "Épargne seule", treso: totRend ? "Projection épargne + gains" : "Projection" }[k] || k);
      const chip = (on) => ({ border: `1px solid ${on ? t.accent : t.border}`, color: on ? t.accent : t.text, background: on ? `${t.accent}1f` : t.panelAlt });

      return (
        <div className="space-y-3 md:space-y-5">
          <div className="rounded-2xl p-3 md:p-4 flex flex-wrap items-center gap-x-5 gap-y-2" style={{ background: t.panel, border: `1px solid ${t.border}` }}>
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-sm mr-1" style={{ color: t.textMuted }}>Vue sur</span>
              {HORIZONS.map((h) => (
                <button key={h} onClick={() => set({ horizon: h, finVue: "" })} className="text-xs px-2.5 py-1 rounded-lg" style={chip(!finChoisie && Number(fc.horizon) === h)}>
                  {h < 24 ? `${h} mois` : `${h / 12} ans`}
                </button>
              ))}
              <label className="flex items-center gap-1.5 text-xs ml-1" style={{ color: t.textMuted }}>
                ou jusqu'au <DateField value={fc.finVue} onChange={(v) => set({ finVue: v })} style={{ ...input, ...(finChoisie ? { borderColor: t.accent } : {}) }} />
              </label>
            </div>
          </div>

          <div className="rounded-2xl p-3 md:p-4 space-y-2" style={{ background: t.panel, border: `1px solid ${t.border}` }}>
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="text-sm mr-1" style={{ color: t.textMuted }}>Estimation</span>
              <button onClick={() => set({ modeRendement: "aucun" })} className="text-xs px-2.5 py-1 rounded-lg" style={chip(mode === "aucun")}>Épargne seule</button>
              <button onClick={() => set({ modeRendement: "historique" })} disabled={!histo.ans.length} className="text-xs px-2.5 py-1 rounded-lg" style={{ ...chip(mode === "historique"), opacity: histo.ans.length ? 1 : 0.5 }}>
                + gains au rendement moyen passé{histo.ans.length ? ` (${histo.moyenne.toFixed(1).replace(".", ",")} %)` : ""}
              </button>
              <button onClick={() => set({ modeRendement: "perso" })} className="text-xs px-2.5 py-1 rounded-lg" style={chip(mode === "perso")}>+ gains à un rendement choisi</button>
              {mode === "perso" && (
                <label className="flex items-center gap-1.5 text-xs" style={{ color: t.textMuted }}>
                  <input type="number" inputMode="decimal" step="0.5" value={fc.rendement} onChange={(e) => set({ rendement: e.target.value === "" ? "" : Number(e.target.value) })}
                    placeholder="0" className="w-16 rounded-lg px-2 py-1 text-sm text-right" style={{ ...input, ...NUM }} /> % / an
                </label>
              )}
            </div>
            <p className="text-[11px]" style={{ color: t.textMuted, ...NUM }}>
              {mode === "aucun" ? "Le patrimoine n'évolue qu'avec l'épargne (revenus − dépenses), sans aucun gain de placement."
                : `Rendement de ${tauxAn.toFixed(1).replace(".", ",")} %/an appliqué chaque mois à tout le patrimoine, en plus de l'épargne.`}
              {histo.ans.length > 0 && ` Rendements passés (gain sur placements / patrimoine en début d'année) : ${histo.ans.map((a) => `${a.annee} ${a.pct.toFixed(1).replace(".", ",")} %${a.n < 12 ? ` (${a.n} mois, annualisé)` : ""}`).join(" · ")}.`}
            </p>
          </div>

          <div className="rounded-2xl p-3 md:p-4 text-sm flex flex-wrap items-baseline gap-x-2 gap-y-1" style={{ background: t.panel, border: `1px solid ${releveAncien ? t.warning : t.border}`, color: t.textMuted }}>
            {releve ? (
              <>
                <span>Point de départ : patrimoine total du dernier relevé ({new Date(releve.date).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })})</span>
                <span className="font-semibold" style={{ color: t.text, ...NUM }}>{fmtEUR(depart)}</span>
                {releveAncien && <span style={{ color: t.warning }}>· relevé ancien : l'épargne des mois depuis n'est pas comptée, saisissez un relevé récent.</span>}
              </>
            ) : <span>Aucun relevé de patrimoine : le plan part de 0 €. Ajoutez un relevé de patrimoine (bouton +).</span>}
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
            <KPICard icon={Briefcase} label={`Revenus prévus · ${nbMois} mois`} value={fmtEUR(totRev)} sub={`${fmtEUR(totRev / nbMois)} / mois en moyenne`} />
            <KPICard icon={ArrowDownRight} label={`Dépenses prévues · ${nbMois} mois`} value={fmtEUR(totDep)} sub={`${fmtEUR(totDep / nbMois)} / mois en moyenne`} />
            <KPICard icon={PiggyBank} label="Épargne prévue" value={signed(totRev - totDep)} tone={totRev - totDep >= 0 ? "up" : "down"}
              sub={totRev > 0 ? `${Math.round(((totRev - totDep) / totRev) * 100)} % des revenus` : "Saisissez vos revenus"} />
            <KPICard icon={TrendingUp} label={`Patrimoine fin ${monthLabel(finP)}`} value={fmtEUR(treso)} tone={gainTotal >= 0 ? "up" : "down"}
              sub={`Gain ${signed(gainTotal)}${depart ? ` (${gainTotal >= 0 ? "+" : ""}${Math.round((gainTotal / depart) * 1000) / 10} %)` : ""}${totRend ? ` · dont placements ${signed(totRend)} · épargne seule : ${fmtEUR(seule)}` : ""}`} />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 md:gap-5">
            <Panel title="Patrimoine projeté" subtitle={suivi?.rows.length ? `Réel et théorique depuis ${monthLong(suivi.debut)}, puis projection jusqu'à ${monthLabel(finP)}` : `${libVue} · patrimoine total en fin de mois`}>
              <ChartLegend items={[
                ...(suivi?.rows.length ? [{ label: "Réel", color: t.s4 }, { label: "Théorique (plan)", color: t.s2 }] : []),
                { label: totRend ? `Projection épargne + gains (${tauxAn.toFixed(1).replace(".", ",")} %)` : "Projection", color: t.s1 },
                ...(totRend !== 0 ? [{ label: "Épargne seule", color: t.textMuted }] : []),
              ]} />
              <ResponsiveContainer width="100%" height={isMobile ? 200 : 260}>
                <ComposedChart data={chartPatri} margin={{ top: 8, right: 8, left: 0, bottom: 0 }}>
                  <CartesianGrid stroke={t.border} vertical={false} />
                  <XAxis dataKey="periode" tickFormatter={monthLabel} tick={{ fill: t.textMuted, fontSize: 11 }} axisLine={false} tickLine={false} minTickGap={16} />
                  <YAxis domain={["auto", "auto"]} tickFormatter={(v) => `${Math.round(v / 1000)}k`} tick={{ fill: t.textMuted, fontSize: 11 }} axisLine={false} tickLine={false} width={48} />
                  <Tooltip contentStyle={tooltipStyle(t)} labelFormatter={(p) => monthLong(p)} formatter={(v, k) => [fmtEUR(v), suiviLabel(k)]} />
                  <Area dataKey="treso" stroke={t.s1} strokeWidth={2} fill={t.s1} fillOpacity={0.12} isAnimationActive={false} connectNulls={false} />
                  {totRend !== 0 && <Area dataKey="seule" stroke={t.textMuted} strokeWidth={1.5} strokeDasharray="5 4" fill="none" isAnimationActive={false} />}
                  {suivi?.rows.length > 0 && <Line dataKey="theo" stroke={t.s2} strokeWidth={1.5} strokeDasharray="4 3" dot={false} isAnimationActive={false} />}
