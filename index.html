    function HistoryTab({ monthly, setMonthly, allFlows }) {
      const t = useTheme();
      const isMobile = useIsMobile();
      const scrollRef = useRef(null);
      const sorted = useMemo(
        () => [...monthly].sort((a, b) => (a.periode || periodeFromDate(a.date)).localeCompare(b.periode || periodeFromDate(b.date)) || new Date(a.date) - new Date(b.date)),
        [monthly]
      );
      const displayed = useMemo(
        () => sorted.map((r, i) => {
          const prev = i > 0 ? sorted[i - 1] : null;
          return { row: r, prev, split: prev ? splitVariation(prev, r, allFlows) : null };
        }).reverse(),
        [sorted, allFlows]
      );

      const periodeCounts = useMemo(() => {
        const counts = {};
        sorted.forEach((r) => { const p = r.periode || periodeFromDate(r.date); counts[p] = (counts[p] || 0) + 1; });
        return counts;
      }, [sorted]);

      const cumGainTotalById = useMemo(() => {
        const map = new Map();
        if (sorted.length === 0) return map;
        const first = sorted[0].totalWealth;
        sorted.forEach((r) => map.set(r.id, r.totalWealth - first));
        return map;
      }, [sorted]);

      const cumGainPlacementById = useMemo(() => {
        const map = new Map();
        let cum = 0;
        sorted.forEach((r, i) => {
          if (i > 0) cum += splitVariation(sorted[i - 1], r, allFlows).gainPlacement;
          map.set(r.id, cum);
        });
        return map;
      }, [sorted, allFlows]);

      const cumGainRevenusById = useMemo(() => {
        const map = new Map();
        sorted.forEach((r) => map.set(r.id, (cumGainTotalById.get(r.id) || 0) - (cumGainPlacementById.get(r.id) || 0)));
        return map;
      }, [sorted, cumGainTotalById, cumGainPlacementById]);

      const updateValue = (id, accountId, value) => {
        setMonthly((rows) => rows.map((r) => {
          if (r.id !== id) return r;
          const byAccount = { ...r.byAccount, [accountId]: Number(value) || 0 };
          const totalWealth = Object.values(byAccount).reduce((s, v) => s + (Number(v) || 0), 0);
          return { ...r, byAccount, totalWealth };
        }));
      };

      const updateFlow = (id, accountId, value) => {
        setMonthly((rows) => rows.map((r) => (r.id === id ? { ...r, flows: { ...(r.flows || {}), [accountId]: Number(value) || 0 } } : r)));
      };

      const updateDate = (id, newDate) => {
        if (!newDate) return;
        setMonthly((rows) => rows.map((r) => (r.id === id ? { ...r, date: new Date(newDate).toISOString() } : r)));
      };

      const updatePeriode = (id, newPeriode) => {
        if (!newPeriode) return;
        setMonthly((rows) => rows.map((r) => (r.id === id ? { ...r, periode: newPeriode } : r)));
      };

      const deleteRow = (id) => setMonthly((rows) => rows.filter((r) => r.id !== id));
      const cellStyle = { background: t.panelAlt, color: t.text, border: `1px solid ${t.border}`, fontFamily: "ui-monospace, monospace" };
      const flowStyle = { ...cellStyle, background: t.panel, color: t.textMuted };

      if (isMobile) {
        return (
          <div className="space-y-2">
            {displayed.map(({ row: r, prev, split }) => {
              const periode = r.periode || periodeFromDate(r.date);
              return (
                <MobileHistoryCard key={r.id} row={r} prev={prev} split={split} periode={periode} doublon={periodeCounts[periode] > 1}
                  onValue={(acc, v) => updateValue(r.id, acc, v)} onFlow={(acc, v) => updateFlow(r.id, acc, v)}
                  onDate={(d) => updateDate(r.id, d)} onPeriode={(pp) => updatePeriode(r.id, pp)} onDelete={() => deleteRow(r.id)} />
              );
            })}
          </div>
        );
      }

      return (
        <div>
          <HScrollBar targetRef={scrollRef} />
          <div className="overflow-x-auto" ref={scrollRef}>
            <table className="text-xs" style={{ borderCollapse: "collapse" }}>
              <thead>
                <tr>
                  <th className="text-left py-2 px-2 sticky left-0 z-10" style={{ color: t.textMuted, background: t.panel }}>Mois / Date</th>
                  {accounts.map((a) => (
                    <th key={a.id} className="text-right py-2 px-2" style={{ color: t.textMuted, whiteSpace: "nowrap" }}>{a.name}</th>
                  ))}
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }}>Total</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }} title="Variation du patrimoine depuis le relevé précédent">Gain total</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }} title="Variation − versements nets vers les placements − variation de trésorerie">Gain placement</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }} title="Évolution du patrimoine − gain sur placements (revenus − dépenses)">Gain revenus</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }}>Gain cumulé</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }}>Gain placement cumulé</th>
                  <th className="text-right py-2 px-2" style={{ color: t.textMuted }} title="Cumul du gain lié aux revenus">Gain revenus cumulé</th>
                  <th className="py-2 px-2" />
                </tr>
              </thead>
              <tbody>
                {displayed.map(({ row: r, prev, split }) => {
                  const periode = r.periode || periodeFromDate(r.date);
                  const doublon = periodeCounts[periode] > 1;
                  const variation = split ? split.variation : null;
                  const gainPlacement = split ? split.gainPlacement : null;
                  const gainRevenus = split ? split.gainRevenus : null;
                  return (
                  <tr key={r.id} style={{ borderBottom: `1px solid ${t.border}` }}>
                    <td className="py-1 px-2 sticky left-0 z-10 align-top" style={{ background: t.panel }}>
                      <input
                        type="month"
                        value={periode}
                        onChange={(e) => updatePeriode(r.id, e.target.value)}
                        title="Mois comptable"
                        className="rounded px-1 py-1"
                        style={{ ...cellStyle, width: 118, borderColor: doublon ? t.accent : t.border, color: doublon ? t.accent : t.text }}
                      />
                      <input
                        type="date"
                        value={r.date.slice(0, 10)}
                        onChange={(e) => updateDate(r.id, e.target.value)}
                        title="Date exacte du relevé"
                        className="rounded px-1 py-1 mt-0.5"
                        style={{ ...cellStyle, width: 118, background: "transparent", color: t.textMuted }}
                      />
                      {r.warning && (
                        <div className="mt-1 rounded-md px-1.5 py-1" title={r.warning} style={{ fontSize: 10, lineHeight: 1.3, color: t.text, background: `${t.warning}1f`, border: `1px solid ${t.warning}66`, maxWidth: 118 }}><span style={{ color: t.warning }}>⚠</span> {r.warning}</div>
                      )}
                    </td>
                    {accounts.map((a) => {
                      const val = r.byAccount[a.id] ?? 0;
                      const mvt = r.flows?.[a.id] ?? 0;
                      const prevVal = prev ? (prev.byAccount[a.id] ?? 0) : val;
                      const gain = prev ? val - prevVal - mvt : null;
                      return (
                        <td key={a.id} className="py-1 px-1 align-top">
                          <input
                            type="number"
                            value={val}
                            onChange={(e) => updateValue(r.id, a.id, e.target.value)}
                            className="w-24 rounded px-1 py-1 text-right"
                            style={cellStyle}
                          />
                          <input
                            type="number"
                            value={mvt}
                            placeholder="mvt"
                            title="Mouvement du mois (apport +, retrait -)"
                            onChange={(e) => updateFlow(r.id, a.id, e.target.value)}
                            className="w-24 rounded px-1 py-1 text-right mt-0.5"
                            style={flowStyle}
                          />
                          {gain !== null && (
                            <div className="text-right pr-1 mt-0.5" style={{ fontSize: 10, color: gain >= 0 ? t.gain : t.loss }}>
                              {gain >= 0 ? "+" : ""}{Math.round(gain)}
                            </div>
                          )}
                        </td>
                      );
                    })}
                    <td className="py-1 px-2 text-right align-top" style={{ color: t.text, fontFamily: "ui-monospace, monospace" }}>{fmtEUR(r.totalWealth)}</td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: variation === null ? t.textMuted : variation >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {variation === null ? "—" : `${variation >= 0 ? "+" : ""}${fmtEUR(variation)}`}
                    </td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: gainPlacement === null ? t.textMuted : gainPlacement >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {gainPlacement === null ? "—" : `${gainPlacement >= 0 ? "+" : ""}${fmtEUR(gainPlacement)}`}
                    </td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: gainRevenus === null ? t.textMuted : gainRevenus >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {gainRevenus === null ? "—" : `${gainRevenus >= 0 ? "+" : ""}${fmtEUR(gainRevenus)}`}
                    </td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: (cumGainTotalById.get(r.id) || 0) >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {(() => { const c = cumGainTotalById.get(r.id) || 0; return `${c >= 0 ? "+" : ""}${fmtEUR(c)}`; })()}
                    </td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: (cumGainPlacementById.get(r.id) || 0) >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {(() => { const c = cumGainPlacementById.get(r.id) || 0; return `${c >= 0 ? "+" : ""}${fmtEUR(c)}`; })()}
                    </td>
                    <td className="py-1 px-2 text-right align-top" style={{ color: (cumGainRevenusById.get(r.id) || 0) >= 0 ? t.gain : t.loss, fontFamily: "ui-monospace, monospace" }}>
                      {(() => { const c = cumGainRevenusById.get(r.id) || 0; return `${c >= 0 ? "+" : ""}${fmtEUR(c)}`; })()}
                    </td>
                    <td className="py-1 px-2 align-top">
                      <DeleteButton title="Supprimer ce point (double clic)" onConfirm={() => deleteRow(r.id)} />
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    const STORAGE_KEY = "patrimoine-state";
    const SEED_VERSION = 12;

    // =========================================================================
    // APPLICATION PRINCIPALE
    // =========================================================================
    // ================== CHAT CLAUDE ==================
    // La clé API est rattachée au compte connecté : un document Firebase par utilisateur.
    const claudeKeyRef = (uid) => doc(db, "patrimoine", `claude_${uid}`);

    const CHAT_INSTRUCTIONS = `Tu es l'assistant de l'application « Mon patrimoine », un tableau de bord personnel de suivi de patrimoine.
L'utilisateur te pose des questions sur ses chiffres : réponds en français, de façon concise, en t'appuyant uniquement sur les données fournies ci-dessous.
Quand tu expliques un chiffre, montre le calcul avec les valeurs réelles (mois, comptes, montants) pour qu'il puisse le vérifier.
Si une donnée manque pour répondre, dis-le plutôt que de l'inventer. Tu n'es pas conseiller financier : tu peux analyser, pas recommander d'acheter ou vendre.
Réponds en texte simple : paragraphes courts et listes avec « - » ; utilise **gras** avec parcimonie, pas de tableaux.

Méthode de calcul de l'application :
- Les relevés mensuels donnent la valeur de chaque compte (byAccount) et les versements nets du mois par compte (flows : + = argent apporté, - = argent retiré). Un relevé pris jusqu'au 10 du mois compte pour la fin du mois précédent ; un seul relevé par mois (le dernier) est retenu.
- LCL et Revolut sont la trésorerie (comptes courants) ; leurs flux ne comptent pas comme versements.
- Capital (par mois) = patrimoine du premier relevé + cumul des versements nets vers les comptes hors trésorerie.
- Capital investi = capital - trésorerie du premier relevé.
- Pour chaque mois : savings = variation du capital (versements nets) ; cash = variation de trésorerie (LCL + Revolut) ; épargne versée = savings ; gainRevenus (gain lié aux revenus = revenus - dépenses) = savings + cash = variation de patrimoine - gain de placement ; gain de placement = (variation de patrimoine - savings) - cash ; monthChange = gainRevenus + gain = variation totale du patrimoine.
- Gain lié aux placements = somme des gains mensuels ; Gain lié aux revenus cumulé = somme des gainRevenus mensuels ; Épargne versée cumulée = somme des versements mensuels.
- Moyennes annuelles = cumul / nombre de mois suivis × 12.
- Bilan annuel : rendement de l'année = gain de l'année / patrimoine en début d'année.
- Les virements validés non rattachés à un relevé sont ajoutés aux flux.`;

    function buildChatContext({ monthlyEff, monthlyMetrics, yearlyMetrics, positions, transfers, budgetMonths = [], kpis }) {
      const r = (v) => (typeof v === "number" ? Math.round(v) : v);
      const lines = [];
      lines.push(`Date du jour : ${new Date().toISOString().slice(0, 10)}`);
      lines.push("\n## Chiffres clés affichés");
      for (const [k, v] of Object.entries(kpis)) lines.push(`- ${k} : ${v}`);
      lines.push("\n## Métriques mensuelles (periode;patrimoine;capitalInvesti;versements;variationTresorerie;gainRevenus;gainPlacement;variationTotale)");
      monthlyMetrics.forEach((m) => lines.push([m.periode, m.wealth, m.invested, m.savings, m.cash, m.gainRevenus, m.gain, m.monthChange].map(r).join(";")));
      lines.push("\n## Bilan annuel (annee;patrimoineDebut;patrimoineFin;versements;variationTresorerie;gainRevenus;gainPlacement;rendementPct)");
      yearlyMetrics.forEach((y) => lines.push([y.year, y.startWealth, y.endWealth, y.savings, y.cash, y.gainRevenus, y.gain, (y.yieldPct * 100).toFixed(2)].map(r).join(";")));
      lines.push("\n## Relevés mensuels bruts (valeurs par compte et flux du mois, en €)");
      monthlyEff.forEach((m) => {
        const vals = Object.entries(m.byAccount || {}).filter(([, v]) => v).map(([a, v]) => `${a}=${r(v)}`).join(" ");
        const flows = Object.entries(m.flows || {}).filter(([, v]) => v).map(([a, v]) => `${a}=${r(v)}`).join(" ");
        lines.push(`${m.periode || periodeFromDate(m.date)} (relevé du ${m.date.slice(0, 10)}) total=${r(m.totalWealth)} | ${vals}${flows ? ` | flux: ${flows}` : ""}${m.warning ? ` | alerte: ${m.warning}` : ""}`);
      });
      lines.push("\n## Positions boursières (compte;ticker;nom;quantité;PRU;dernier cours;devise;catégorie;secteur)");
      positions.forEach((p) => lines.push([p.accountId, p.ticker, p.name, p.quantity, p.costBasis, p.lastPrice, p.currency, p.category, p.sector].join(";")));
      if (transfers.length) {
        lines.push("\n## Virements (date départ;de;vers;montant;statut;libellé)");
        transfers.forEach((tr) => lines.push([tr.departureDate?.slice(0, 10), tr.sourceAccountId, tr.destinationAccountId, tr.amount, tr.status, tr.label || ""].join(";")));
      }
      if (budgetMonths.length) {
        lines.push("\n## Budget mensuel issu des relevés Revolut (mois calendaire ; montants en € ; dépenses nettes des remboursements, hors virements internes et versements vers les placements)");
        lines.push("periode;salaires;autresRevenus;depenses;reste;versementsPlacements;detailDepensesParCategorie");
        budgetMonths.forEach((m) => {
          const det = Object.entries(m.byCat).filter(([c]) => budgetKind(c) === "depense").map(([c, v]) => `${c}=${r(-v)}`).join(", ");
          lines.push([m.periode, m.salaire, m.autresRevenus, m.depenses, m.solde, m.epargne].map(r).join(";") + `;${det}`);
        });
      }
      return lines.join("\n");
    }

    // Rendu minimal : paragraphes et **gras**
    function ChatText({ text }) {
      return text.split(/(\*\*[^*]+\*\*)/g).map((part, i) =>
        part.startsWith("**") && part.endsWith("**") ? <strong key={i}>{part.slice(2, -2)}</strong> : <React.Fragment key={i}>{part}</React.Fragment>
      );
    }

    const CHAT_SUGGESTIONS = [
      "Comment est calculé le gain lié aux placements ?",
      "Pourquoi mon patrimoine a-t-il varié le mois dernier ?",
      "Quel compte a le plus progressé cette année ?",
      "Quelles sont mes positions en perte ?",
    ];

    function ClaudeChat({ open, onClose, seed, context, uid }) {
      const t = useTheme();
      const isMobile = useIsMobile();
      const [apiKey, setApiKey] = useState("");
      const [keyLoaded, setKeyLoaded] = useState(false);
      const [keyDraft, setKeyDraft] = useState("");
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState("");
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState(null);
      const scrollRef = useRef(null);
      const streamRef = useRef(null);

      useEffect(() => {
        let annule = false;
        setKeyLoaded(false);
        getDoc(claudeKeyRef(uid))
          .then((snap) => { if (!annule) setApiKey(snap.exists() ? snap.data().apiKey || "" : ""); })
          .catch((e) => { console.error("Lecture clé Claude:", e); if (!annule) setError("Impossible de lire la clé API du compte."); })
          .finally(() => { if (!annule) setKeyLoaded(true); });
        return () => { annule = true; };
      }, [uid]);
      useEffect(() => { if (seed?.text) setInput(seed.text); }, [seed]);
      useEffect(() => { scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight }); }, [messages, open]);
      useEffect(() => () => streamRef.current?.abort(), []);

      const saveKey = async () => {
        const k = keyDraft.trim();
        if (!k) return;
        try {
          await setDoc(claudeKeyRef(uid), { apiKey: k });
          setApiKey(k); setKeyDraft(""); setError(null);
        } catch (e) {
          console.error("Enregistrement clé Claude:", e);
          setError("Impossible d'enregistrer la clé sur le compte.");
        }
      };
      const forgetKey = () => {
        setApiKey("");
        setDoc(claudeKeyRef(uid), { apiKey: "" }).catch((e) => console.error("Suppression clé Claude:", e));
      };

      const send = async (text) => {
        const question = (text ?? input).trim();
        if (!question || busy || !apiKey) return;
        const history = [...messages, { role: "user", content: question }];
        setMessages([...history, { role: "assistant", content: "" }]);
        setInput(""); setBusy(true); setError(null);
        const setReply = (fn) => setMessages((ms) => [...ms.slice(0, -1), { role: "assistant", content: fn(ms[ms.length - 1].content) }]);
        try {
          const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
          const stream = client.beta.messages.stream({
            model: "claude-sonnet-5-5",
            max_tokens: 16000,
            output_config: { effort: "medium" },
            betas: ["server-side-fallback-2026-07-01"],
            fallbacks: "default",
            system: [
              { type: "text", text: CHAT_INSTRUCTIONS },
              { type: "text", text: `# Données du patrimoine\n${context}`, cache_control: { type: "ephemeral" } },
            ],
            messages: history,
          });
          streamRef.current = stream;
          stream.on("text", (delta) => setReply((c) => c + delta));
          const final = await stream.finalMessage();
          if (final.stop_reason === "refusal") setReply(() => "Claude n'a pas pu répondre à cette question.");
          else if (final.stop_reason === "max_tokens") setReply((c) => c + "\n\n(réponse tronquée)");
        } catch (e) {
          let msg = "Impossible de joindre Claude. Vérifiez votre connexion.";
          if (e instanceof Anthropic.AuthenticationError) msg = "Clé API refusée : vérifiez-la ou saisissez-en une autre.";
          else if (e instanceof Anthropic.RateLimitError) msg = "Trop de requêtes, réessayez dans un instant.";
          else if (e instanceof Anthropic.APIUserAbortError) msg = null;
          else if (e instanceof Anthropic.APIError && e.status) msg = `Erreur de l'API Claude (HTTP ${e.status}).`;
          setError(msg);
          setMessages((ms) => (ms[ms.length - 1]?.content ? ms : ms.slice(0, -1)));
          if (e instanceof Anthropic.AuthenticationError) forgetKey();
        } finally {
          streamRef.current = null;
          setBusy(false);
        }
      };

      if (!open) return null;

      const panelStyle = isMobile
        ? { inset: 0, paddingTop: "env(safe-area-inset-top)", paddingBottom: "env(safe-area-inset-bottom)" }
        : { right: 24, bottom: 24, width: 420, height: "min(640px, calc(100vh - 48px))", borderRadius: 20, border: `1px solid ${t.border}` };

      return (
        <div className="fixed z-50 flex flex-col overflow-hidden" style={{ background: t.panel, boxShadow: t.shadow, fontFamily: FONT, ...panelStyle }}>
          <div className="flex items-center gap-3 px-4 py-3" style={{ borderBottom: `1px solid ${t.border}` }}>
            <span className="w-8 h-8 shrink-0 rounded-xl flex items-center justify-center" style={{ background: `${t.accent}1f` }}>
              <MessageCircle size={16} color={t.accent} />
            </span>
            <div className="flex-1 min-w-0">
              <div className="text-sm font-semibold" style={{ color: t.text }}>Demander à Claude</div>
              <div className="text-[11px]" style={{ color: t.textMuted }}>Questions sur vos chiffres</div>
            </div>
            {messages.length > 0 && !busy && (
              <button onClick={() => { setMessages([]); setError(null); }} title="Nouvelle conversation" className="p-2 rounded-lg" style={{ color: t.textMuted }}>
                <RefreshCw size={15} />
              </button>
            )}
            {apiKey && (
              <button onClick={forgetKey} title="Retirer la clé API du compte" className="p-2 rounded-lg" style={{ color: t.textMuted }}>
                <KeyRound size={15} />
              </button>
            )}
            <button onClick={() => { streamRef.current?.abort(); onClose(); }} title="Fermer" className="p-2 rounded-lg" style={{ color: t.textMuted }}>
              <X size={18} />
            </button>
          </div>

          <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-4 space-y-3">
            {!keyLoaded ? (
              <p className="text-sm" style={{ color: t.textMuted }}>Chargement…</p>
            ) : !apiKey ? (
              <div className="space-y-3 text-sm" style={{ color: t.text }}>
                <p>Pour discuter avec Claude, saisissez votre clé API Anthropic (console.anthropic.com).</p>
                <p className="text-xs" style={{ color: t.textMuted }}>
                  Elle est enregistrée sur votre compte et sera disponible sur tous vos appareils. Les données du patrimoine sont envoyées à l'API Claude à chaque question.
                </p>
                <input type="password" value={keyDraft} onChange={(e) => setKeyDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveKey()}
                  placeholder="sk-ant-…" autoComplete="off" className="w-full px-3 py-2 rounded-xl text-sm outline-none"
                  style={{ background: t.panelAlt, border: `1px solid ${t.border}`, color: t.text }} />
                <button onClick={saveKey} disabled={!keyDraft.trim()} className="px-4 py-2 rounded-xl text-sm font-medium"
                  style={{ background: t.accent, color: t.onAccent, opacity: keyDraft.trim() ? 1 : 0.5 }}>
                  Enregistrer la clé
                </button>
              </div>
            ) : messages.length === 0 ? (
              <div className="space-y-2">
                <p className="text-sm" style={{ color: t.textMuted }}>Posez une question sur un chiffre du tableau de bord, un mois, un compte ou une position.</p>
                {CHAT_SUGGESTIONS.map((q) => (
                  <button key={q} onClick={() => send(q)} className="block w-full text-left px-3 py-2 rounded-xl text-sm"
                    style={{ background: t.panelAlt, border: `1px solid ${t.border}`, color: t.text }}>
                    {q}
                  </button>
                ))}
              </div>
            ) : (
              messages.map((m, i) => (
                <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                  <div className="max-w-[88%] px-3 py-2 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap"
                    style={m.role === "user"
                      ? { background: t.accent, color: t.onAccent }
                      : { background: t.panelAlt, color: t.text, border: `1px solid ${t.border}` }}>
                    {m.content ? <ChatText text={m.content} /> : <span style={{ color: t.textMuted }}>Réflexion…</span>}
                  </div>
                </div>
              ))
            )}
            {error && <p className="text-xs" style={{ color: t.loss }}>{error}</p>}
          </div>

          {apiKey && (
            <div className="flex items-end gap-2 px-3 py-3" style={{ borderTop: `1px solid ${t.border}` }}>
              <textarea value={input} onChange={(e) => setInput(e.target.value)} rows={1}
                onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
                placeholder="Votre question…" className="flex-1 resize-none px-3 py-2 rounded-xl text-sm outline-none"
                style={{ background: t.panelAlt, border: `1px solid ${t.border}`, color: t.text, maxHeight: 120 }} />
              <button onClick={() => send()} disabled={busy || !input.trim()} title="Envoyer" className="p-2.5 rounded-xl shrink-0"
                style={{ background: t.accent, color: t.onAccent, opacity: busy || !input.trim() ? 0.5 : 1 }}>
                <Send size={16} />
              </button>
            </div>
          )}
        </div>
      );
    }

    // ================== ONGLET BUDGET ==================
    const monthLong = (p) => periodeDate(p).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

    function BudgetImport({ onImport, onDone }) {
      const t = useTheme();
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [info, setInfo] = useState("");
      const [alerte, setAlerte] = useState("");
      const handleFiles = async (files) => {
        setLoading(true); setError(""); setInfo(""); setAlerte("");
        try {
          const res = await onImport(files);
          const { info, warnings } = res;
          setInfo(info);
          setAlerte(res.alerte || "");
          onDone?.(res);
          if (warnings.length) setError(warnings.join(" · "));
        } catch (e) {
          setError(e.message || "lecture impossible");
        }
        setLoading(false);
      };
      return (
        <div className="rounded-xl p-4" style={{ background: t.panelAlt, border: `1px solid ${t.border}` }}>
          <label className="flex flex-wrap items-center gap-3 cursor-pointer">
            <span className="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium" style={{ background: t.accent, color: t.onAccent }}>
              <Upload size={15} /> Importer des relevés
            </span>
            <span className="text-xs" style={{ color: t.textMuted }}>Revolut (PDF, Excel ou CSV) ou LCL (PDF) · plusieurs fichiers possibles · les opérations déjà importées sont ignorées</span>
            <input type="file" multiple accept=".csv,.txt,.tsv,.xlsx,.xls,.pdf" className="hidden" disabled={loading}
              onChange={(e) => { const fs = [...e.target.files]; e.target.value = ""; fs.length && handleFiles(fs); }} />
          </label>
          <p className="text-xs mt-2" style={{ color: t.textMuted }}>
            Revolut : Compte → ⋯ → Relevé (PDF ou Excel), un par compte — joint compris. LCL : relevé de compte mensuel en PDF (espace client → Mes documents).
            Les catégories sont devinées depuis le libellé ; quand vous en corrigez une, l'app vous demande s'il faut l'étendre aux opérations semblables.
          </p>
          {loading && <p className="text-xs mt-1" style={{ color: t.textMuted }}>Lecture…</p>}
          {info && <p className="text-xs mt-1" style={{ color: t.gain }}>{info}</p>}
          {alerte && (
            <p className="text-sm mt-2 px-3 py-2 rounded-lg font-medium" style={{ color: alerte.startsWith("⚠") ? t.loss : t.gain, background: `${alerte.startsWith("⚠") ? t.loss : t.gain}17` }}>{alerte}</p>
          )}
          {error && <p className="text-xs mt-1" style={{ color: t.loss }}>{error}</p>}
        </div>
      );
    }

    function BudgetMonthlyChart({ data }) {
      const t = useTheme();
      const isMobile = useIsMobile();
      return (
        <div>
          <ChartLegend items={[{ label: "Salaires", color: t.s3 }, { label: "Autres revenus", color: t.s1 }, { label: "Dépenses", color: t.s2 }]} />
          <ResponsiveContainer width="100%" height={isMobile ? 220 : 280}>
            <BarChart data={data} margin={{ top: 8, right: 8, left: 0, bottom: 0 }} barCategoryGap="25%" barGap={2}>
              <CartesianGrid stroke={t.border} vertical={false} />
              <XAxis dataKey="periode" tickFormatter={monthLabel} tick={{ fill: t.textMuted, fontSize: 11 }} axisLine={false} tickLine={false} minTickGap={12} />
              <YAxis tickFormatter={(v) => `${(v / 1000).toFixed(v && Math.abs(v) < 10000 ? 1 : 0)}k`} tick={{ fill: t.textMuted, fontSize: 11 }} axisLine={false} tickLine={false} width={44} />

                      </span>

                      {row("Salaires", p.salaire, t.s3)}
                      {row("Autres revenus", p.autresRevenus, t.s1)}

              <Bar dataKey="autresRevenus" stackId="rev" fill={t.s1} stroke={t.panel} strokeWidth={1} radius={[4, 4, 0, 0]} maxBarSize={20} />

    // Commentaire libre sur une opération : bouton 💬 et zone d'édition sous la ligne
    function NoteButton({ tx, editing, onToggle }) {
      const t = useTheme();
      return (
        <button type="button" onClick={onToggle} title={tx.note ? "Modifier le commentaire" : "Ajouter un commentaire"}
          className="shrink-0 p-1.5 rounded-lg" style={{ color: tx.note || editing ? t.accent : t.textMuted, background: editing ? t.panelAlt : "transparent" }}>
          <MessageCircle size={15} />
        </button>
      );
    }
    function NoteBlock({ tx, editing, onSave, onCancel }) {
      const t = useTheme();
      const [draft, setDraft] = useState(tx.note || "");
      useEffect(() => { if (editing) setDraft(tx.note || ""); }, [editing]);
      if (editing) {
        return (
          <div className="flex items-center gap-2 pb-2 md:pl-14">
            <input autoFocus value={draft} onChange={(e) => setDraft(e.target.value)} maxLength={300} placeholder="Commentaire (ex. : billets Athènes–Paris pour les vacances)"
              onKeyDown={(e) => { if (e.key === "Enter") onSave(draft); if (e.key === "Escape") onCancel(); }}
              className="flex-1 min-w-0 rounded-lg px-3 py-1.5 text-sm" style={{ background: t.panel, color: t.text, border: `1px solid ${t.accent}` }} />
            <button onClick={() => onSave(draft)} className="px-3 py-1.5 rounded-lg text-xs font-medium shrink-0" style={{ background: t.accent, color: t.onAccent }}>OK</button>
            {tx.note && <button onClick={() => onSave("")} className="px-2 py-1.5 rounded-lg text-xs shrink-0" style={{ color: t.loss, border: `1px solid ${t.border}` }}>Effacer</button>}
          </div>

      }
      if (!tx.note) return null;
      return <p className="text-xs italic pb-2 md:pl-14 break-words" style={{ color: t.textMuted }}>💬 {tx.note}</p>;
    }

    function CategoryPrompt({ prompt, onOnlyThis, onRemember, onApplyAll }) {
      const t = useTheme();
      const { tx, cat, others } = prompt;
      const btn = (primary) => ({ background: primary ? t.accent : t.panelAlt, color: primary ? t.onAccent : t.text, border: `1px solid ${primary ? t.accent : t.border}` });
      return (

    function BudgetAnalysis({ analysis: a, onEditLimits }) {
      const t = useTheme();
      if (!a) return null;
      const m = a.month;
      const alert = a.over.length > 0;
      const tone = alert ? t.loss : a.rows.length ? t.gain : t.border;
      const line = (children, color) => <li className="text-xs leading-relaxed" style={{ color: color || t.textMuted }}>{children}</li>;
      return (
        <div className="rounded-2xl p-4 md:p-5" style={{ background: alert ? `${t.loss}12` : t.panel, border: `1px solid ${alert ? `${t.loss}88` : t.border}`, boxShadow: t.shadow }}>
          <div className="flex items-start justify-between gap-3 mb-2">
            <h3 className="text-sm font-semibold flex items-center gap-2" style={{ color: t.text }}>
              <span style={{ color: tone }}>{alert ? "⚠" : a.rows.length ? "✓" : "•"}</span>
              Analyse de {monthLong(a.periode)}{a.enCours ? " (mois en cours)" : ""}
            </h3>
            <button onClick={onEditLimits} className="text-xs px-2.5 py-1 rounded-lg shrink-0" style={{ border: `1px solid ${t.border}`, color: t.text, background: t.panelAlt }}>
              {a.rows.length ? "Modifier les budgets" : "Définir des budgets"}
            </button>
          </div>
          <ul className="space-y-1">
            {a.over.map((r) => line(
              <>
                <span className="font-semibold" style={{ color: t.loss }}>{r.cat} : budget {r.annual ? "annuel " : ""}dépassé de {fmtEUR(r.spent - r.limit)}</span>
                {" "}— {fmtEUR(r.spent)} dépensés{r.annual ? " depuis janvier" : ""} pour {fmtEUR(r.limit)} prévus{r.annual ? " sur l'année" : ""} ({Math.round(r.ratio * 100)} %)
              </>, t.text))}
            {a.near.map((r) => line(
              <><span className="font-semibold" style={{ color: t.warning }}>{r.cat} : {Math.round(r.ratio * 100)} % du budget {r.annual ? "annuel" : ""}</span> — {fmtEUR(r.spent)} sur {fmtEUR(r.limit)}</>, t.text))}
            {a.rows.length > 0 && !a.over.length && !a.near.length && line(<>Tous les budgets sont respectés.</>, t.text)}
            {a.totalBudget > 0 && line(<>Budgets mensuels : {fmtEUR(a.totalBudgeted)} dépensés pour {fmtEUR(a.totalBudget)} prévus ce mois-ci.</>)}
            {a.rows.filter((r) => r.annual && r.spent <= r.limit && r.ratio < 0.9).map((r) => line(<>{r.cat} (budget annuel) : {fmtEUR(r.spent)} depuis janvier sur {fmtEUR(r.limit)} ({Math.round(r.ratio * 100)} %).</>))}
            {!a.rows.length && line(<>Aucun budget défini : fixez un montant par catégorie pour être alerté quand il est dépassé.</>)}
            {a.hausses.map((r) => line(<>{r.cat} : {fmtEUR(r.spent)}, soit {fmtEUR(r.diff)} de plus que votre moyenne ({fmtEUR(r.avg)}/mois).</>))}
            {a.avgDepenses !== null && line(
              <>Dépenses du mois : {fmtEUR(m.depenses)} ({m.depenses > a.avgDepenses ? "+" : "−"}{fmtEUR(Math.abs(m.depenses - a.avgDepenses))} par rapport à la moyenne des {a.nPrev} mois précédents) ·
                écart revenus − dépenses : <span style={{ color: m.solde >= 0 ? t.gain : t.loss }}>{signed(m.solde)}</span>.</>)}
          </ul>
        </div>
      );
    }

    function BudgetLimitsEditor({ limits, onSetLimit, months, onClose }) {
      const t = useTheme();
      const last12 = months.filter((m) => m.periode < moisCourant()).slice(-12);
      const avgOf = (cat) => (last12.length ? last12.reduce((s, m) => s + depenseCat(m, cat), 0) / last12.length : 0);
      // Dépense « irrégulière » : présente au plus un mois sur deux (école, impôts, voyages…) → budget annuel conseillé
      const irreguliere = (cat) => last12.filter((m) => depenseCat(m, cat) >= 1).length <= last12.length / 2;
      const cats = BUDGET_CATEGORIES.filter((c) => c.kind === "depense");
      const totMois = cats.reduce((s, c) => { const L = getLimit(limits, c.id); return s + (L && !L.annual ? L.amount : 0); }, 0);
      const totAn = cats.reduce((s, c) => { const L = getLimit(limits, c.id); return s + (L && L.annual ? L.amount : 0); }, 0);
      const arrondi = (v) => (v < 100 ? Math.ceil(v / 10) * 10 : Math.ceil(v / 50) * 50);
      const input = { background: t.panel, color: t.text, border: `1px solid ${t.border}` };
      return (
        <Panel title="Budgets par catégorie"
          subtitle={`Par mois : ${fmtEUR(totMois)} · par an : ${fmtEUR(totAn)} · moyennes calculées sur les ${last12.length} derniers mois terminés. Choisissez « / an » pour les dépenses qui ne reviennent pas chaque mois (école, impôts, voyages…).`}
          action={<button onClick={onClose} className="p-1 rounded-lg" style={{ color: t.textMuted }} title="Fermer"><X size={16} /></button>}>
          <div className="flex flex-wrap gap-2 mb-3">
            <button onClick={() => cats.forEach((c) => {
                const a = avgOf(c.id);
                if (getLimit(limits, c.id) || a < 1) return;
                if (irreguliere(c.id)) onSetLimit(c.id, arrondi(a * 12), "an"); else onSetLimit(c.id, arrondi(a), "mois");
              })}
              className="text-xs px-3 py-1.5 rounded-lg" style={{ background: t.accent, color: t.onAccent }}>
              Remplir les cases vides avec mes moyennes
            </button>
          </div>
          <div className="space-y-1.5">
            {cats.map((c) => {
              const a = avgOf(c.id);
              const L = getLimit(limits, c.id);
              const annuel = L ? L.annual : irreguliere(c.id) && a >= 1;
              return (
                <div key={c.id} className="flex items-center gap-2 text-sm">
                  <span className="flex-1 min-w-0 truncate" style={{ color: t.text }}>{c.id}</span>
                  <span className="text-xs shrink-0 hidden sm:inline text-right" style={{ color: t.textMuted, ...NUM }}>
                    moy. {fmtEUR(a)}/mois · {fmtEUR(a * 12)}/an
                  </span>
                  <input type="number" inputMode="decimal" min="0" step="10"
                    placeholder={a >= 1 ? String(arrondi(annuel ? a * 12 : a)) : "—"}
                    value={L ? L.amount : ""}
                    onChange={(e) => onSetLimit(c.id, e.target.value === "" ? null : Math.max(0, Number(e.target.value)), annuel ? "an" : "mois")}
                    className="w-24 rounded-lg px-2 py-1 text-right text-sm" style={{ ...input, ...NUM }} />
                  <select value={annuel ? "an" : "mois"}
                    onChange={(e) => {
                      const per = e.target.value;
                      // On convertit le montant saisi : × 12 vers l'annuel, ÷ 12 vers le mensuel
                      if (L) onSetLimit(c.id, per === "an" ? L.amount * 12 : Math.round(L.amount / 12), per);
                      else onSetLimit(c.id, null, per);
                    }}
                    className="rounded-lg px-1.5 py-1 text-xs" style={input}>
                    <option value="mois">€ / mois</option>
                    <option value="an">€ / an</option>
                  </select>
                </div>
              );
            })}
          </div>
        </Panel>
      );
    }

    function CategoriesEditor({ customCats, onAdd, onDelete, transactions, onClose }) {

      const [name, setName] = useState("");

      const add = () => {
        if (onAdd(name, kind)) { setMsg(`« ${name.trim()} » ajoutée.`); setName(""); }

      return (
        <Panel title="Catégories" subtitle="Créez vos propres catégories. Le type décide où elles comptent : dépenses, revenus, placements, ou ni l'un ni l'autre (virement entre vos comptes)."
          action={<button onClick={onClose} className="p-1 rounded-lg" style={{ color: t.textMuted }} title="Fermer"><X size={16} /></button>}>
          <div className="flex flex-wrap items-center gap-2 mb-2">
            <input value={name} onChange={(e) => { setName(e.target.value); setMsg(""); }} onKeyDown={(e) => e.key === "Enter" && add()} maxLength={40}
              placeholder="Nom de la nouvelle catégorie" className="flex-1 min-w-[180px] rounded-lg px-3 py-1.5 text-sm" style={input} />
            <select value={kind} onChange={(e) => setKind(e.target.value)} className="rounded-lg px-2 py-1.5 text-sm" style={input}>

          </div>
          {msg && <p className="text-xs mb-2" style={{ color: t.textMuted }}>{msg}</p>}
          <div className="space-y-1">
            {customCats.length === 0 && <p className="text-xs" style={{ color: t.textMuted }}>Aucune catégorie personnelle pour l'instant.</p>}
            {customCats.map((c) => {
              const n = transactions.filter((x) => x.cat === c.id).length;
              return (
                <div key={c.id} className="flex items-center justify-between gap-3 text-sm py-1" style={{ borderBottom: `1px solid ${t.border}` }}>
                  <span style={{ color: t.text }}>{c.id} <span className="text-xs" style={{ color: t.textMuted }}>· {kindLabel[c.kind]} · {n} opération{n > 1 ? "s" : ""}</span></span>
                  <DeleteButton title={`Supprimer « ${c.id} » (ses opérations reprennent une catégorie automatique)`} onConfirm={() => onDelete(c.id)} />
                </div>

          </div>
          <p className="text-[11px] mt-3" style={{ color: t.textMuted }}>
            Catégories de base, non supprimables : {BASE_CATEGORIES.map((c) => c.id).join(", ")}.
          </p>
        </Panel>
      );
    }

    function BudgetTab({ transactions, rules, limits = {}, onSetLimit, onImport, onSetCategory, onSetNote, onDeleteRule, onDeleteMonth, customCats = [], onAddCategory, onDeleteCategory, catsVersion = "" }) {
      const t = useTheme();
      const isMobile = useIsMobile();
      const months = useMemo(() => buildBudgetMonths(transactions), [transactions, catsVersion]);
      const [mode, setMode] = useState("mois");
      const [showLimits, setShowLimits] = useState(false);
      const [showCats, setShowCats] = useState(false);
      const [periode, setPeriode] = useState(null);
      const [annee, setAnnee] = useState(null);
      const [filterCat, setFilterCat] = useState("all");
      const [txLimit, setTxLimit] = useState(200);
      const [noteEdit, setNoteEdit] = useState(null);
      const [txSens, setTxSens] = useState("all");
      const [txMin, setTxMin] = useState("");
      const [txMax, setTxMax] = useState("");
      const [txSort, setTxSort] = useState("date");
      const [txSearch, setTxSearch] = useState("");
      const years = useMemo(() => [...new Set(months.map((m) => m.periode.slice(0, 4)))], [months]);
      const monthCurrent = months.find((m) => m.periode === periode) || months[months.length - 1];
      const year = years.includes(annee) ? annee : years[years.length - 1];
      const yearMonths = useMemo(() => months.filter((m) => m.periode.startsWith(year || "")), [months, year]);
      // Vue annuelle : on additionne les mois de l'année choisie
      const yearAgg = useMemo(() => {
        if (!yearMonths.length) return null;
        const agg = { periode: year, salaire: 0, autresRevenus: 0, revenus: 0, depenses: 0, epargne: 0, byCat: {} };
        yearMonths.forEach((m) => {
          ["salaire", "autresRevenus", "revenus", "depenses", "epargne"].forEach((k) => { agg[k] += m[k]; });
          Object.entries(m.byCat).forEach(([c, v]) => { agg.byCat[c] = (agg.byCat[c] || 0) + v; });
        });
        agg.solde = agg.revenus - agg.depenses;
        agg.tauxEpargne = agg.revenus > 0 ? agg.solde / agg.revenus : null;
        return agg;
      }, [yearMonths, year]);
      const annual = mode === "annee";
      const current = annual ? yearAgg : monthCurrent;
      const nMonths = annual ? yearMonths.length : 1;
      const periodLabel = annual ? `Année ${year}` : current ? monthLong(current.periode) : "";
      const navList = annual ? years : months.map((m) => m.periode);
      const navValue = annual ? year : current?.periode;
      const idx = navList.indexOf(navValue);
      const goTo = (v) => { if (annual) setAnnee(v); else setPeriode(v); setTxLimit(200); };
      const last12 = months.slice(-12);
      const prev12 = !annual && current ? months.filter((m) => m.periode < current.periode).slice(-12) : [];

      const catRows = useMemo(() => {
        if (!current) return [];
        return BUDGET_CATEGORIES.filter((c) => c.kind === "depense")
          .map((c) => {
            const value = -(current.byCat[c.id] || 0);
            const avg = prev12.length ? prev12.reduce((s, m) => s - (m.byCat[c.id] || 0), 0) / prev12.length : null;
            // Budget : mensuel, ou multiplié par le nombre de mois en vue annuelle
            const L = getLimit(limits, c.id);
            // Vue mensuelle : trait = budget mensuel ; un budget annuel est rappelé en texte (cumul depuis janvier)
            // Vue annuelle : budget mensuel × nombre de mois, ou budget annuel tel quel
            const limit = !L ? null : L.annual ? (annual ? L.amount : null) : L.amount * nMonths;
            const annuelInfo = L && L.annual && !annual ? { amount: L.amount, ytd: depenseDepuisJanvier(months, current.periode, c.id) } : null;
            return { cat: c.id, value, avg, limit, annuelInfo };
          })
          .filter((r) => Math.abs(r.value) >= 0.5 || (r.avg && r.avg >= 1) || r.limit || r.annuelInfo)
          .sort((a, b) => b.value - a.value);
      }, [current, prev12, limits, nMonths, months, annual]);
      const maxCat = Math.max(1, ...catRows.map((r) => Math.max(r.value, r.avg || 0, r.limit || 0)));
      const incomeRows = current ? BUDGET_CATEGORIES.filter((c) => c.kind === "revenu" && current.byCat[c.id]).map((c) => ({ cat: c.id, value: current.byCat[c.id] })) : [];

      const analysis = useMemo(() => (!annual && current ? analyzeBudgetMonth(months, current.periode, limits) : null), [annual, current, months, limits]);

      const monthTx = useMemo(() => {
        if (!current) return [];
        const lo = txMin === "" ? null : Number(txMin), hi = txMax === "" ? null : Number(txMax);
        const q = normTxt(txSearch);
        return transactions
          .filter((tx) => tx.d.startsWith(current.periode) && (filterCat === "all" || tx.cat === filterCat) &&
            (!q || normTxt(`${tx.desc} ${tx.detail || ""} ${tx.note || ""}`).includes(q)) &&
            (txSens === "all" || (txSens === "out" ? tx.amt < 0 : tx.amt > 0)) &&
            (lo === null || Math.abs(tx.amt) >= lo) && (hi === null || Math.abs(tx.amt) <= hi))
          .sort(txSort === "date" ? (a, b) => b.d.localeCompare(a.d) || a.amt - b.amt
            : txSort === "desc" ? (a, b) => Math.abs(b.amt) - Math.abs(a.amt) || b.d.localeCompare(a.d)
            : (a, b) => Math.abs(a.amt) - Math.abs(b.amt) || b.d.localeCompare(a.d));
      }, [transactions, current, filterCat, txSens, txMin, txMax, txSort, txSearch]);
      const txTotals = monthTx.reduce((acc, tx) => { if (tx.amt < 0) acc.out -= tx.amt; else acc.in += tx.amt; return acc; }, { out: 0, in: 0 });

      const ruleEntries = Object.entries(rules).sort((a, b) => a[0].localeCompare(b[0]));
      const select = { background: t.panel, color: t.text, border: `1px solid ${t.border}` };

      if (!current) {
        return (
          <div className="space-y-4">
            <BudgetImport onImport={onImport} />
            <p className="text-sm" style={{ color: t.textMuted }}>Aucune opération pour l'instant : importez vos premiers relevés (Revolut ou LCL).</p>
          </div>
        );
      }

      const avg = (key) => (last12.length ? last12.reduce((s, m) => s + m[key], 0) / last12.length : 0);

      return (
        <div className="space-y-3 md:space-y-5">
          <BudgetImport onImport={onImport} onDone={(r) => { if (r.focus) { setMode("mois"); setPeriode(r.focus); setFilterCat("all"); } }} />

          <div className="flex justify-center gap-2">
            <div className="flex p-0.5 rounded-lg text-sm" style={{ background: t.panelAlt, border: `1px solid ${t.border}` }}>
              {[["mois", "Mensuel"], ["annee", "Annuel"]].map(([v, l]) => (
                <button key={v} onClick={() => { setMode(v); setFilterCat("all"); setTxLimit(200); }} className="px-4 py-1.5 rounded-md"
                  style={{ background: mode === v ? t.panel : "transparent", color: mode === v ? t.text : t.textMuted, fontWeight: mode === v ? 600 : 400 }}>{l}</button>
              ))}
            </div>
            <button onClick={() => setShowLimits((v) => !v)} className="px-3 py-1.5 rounded-lg text-sm"
              style={{ background: showLimits ? t.panel : t.panelAlt, border: `1px solid ${t.border}`, color: t.text, fontWeight: showLimits ? 600 : 400 }}>
              Budgets
            </button>
            <button onClick={() => setShowCats((v) => !v)} className="px-3 py-1.5 rounded-lg text-sm"
              style={{ background: showCats ? t.panel : t.panelAlt, border: `1px solid ${t.border}`, color: t.text, fontWeight: showCats ? 600 : 400 }}>
              Catégories
            </button>
          </div>

          {showLimits && <BudgetLimitsEditor limits={limits} onSetLimit={onSetLimit} months={months} onClose={() => setShowLimits(false)} />}
          {showCats && <CategoriesEditor customCats={customCats} onAdd={onAddCategory} onDelete={onDeleteCategory} transactions={transactions} onClose={() => setShowCats(false)} />}

          <div className="flex items-center justify-between gap-2">
            <button onClick={() => idx > 0 && goTo(navList[idx - 1])} disabled={idx <= 0} className="p-2 rounded-lg" style={{ color: idx > 0 ? t.text : t.border }}>
              <ChevronLeft size={18} />
            </button>
            <select value={navValue} onChange={(e) => goTo(e.target.value)} className="rounded-lg px-3 py-2 text-sm font-semibold capitalize" style={select}>
              {navList.map((v) => <option key={v} value={v}>{annual ? `Année ${v}` : monthLong(v)}</option>)}
            </select>
            <button onClick={() => idx < navList.length - 1 && goTo(navList[idx + 1])} disabled={idx >= navList.length - 1} className="p-2 rounded-lg" style={{ color: idx < navList.length - 1 ? t.text : t.border }}>
              <ChevronRight size={18} />
            </button>
          </div>

          {!annual && <BudgetAnalysis analysis={analysis} onEditLimits={() => setShowLimits(true)} />}

          <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 md:gap-4">
            <KPICard icon={Briefcase} label="Salaires" value={fmtEUR(current.salaire)}
              sub={annual ? `${fmtEUR(current.salaire / nMonths)} / mois sur ${nMonths} mois` : `Moyenne 12 mois : ${fmtEUR(avg("salaire"))}`} />
            <KPICard icon={TrendingUp} label="Autres revenus" value={fmtEUR(current.autresRevenus)}
              sub={isMobile ? "Notes de frais, CAF, remb." : "Notes de frais, CAF, indemnités, remboursements…"} />
            <KPICard icon={ArrowDownRight} label="Dépenses" value={fmtEUR(current.depenses)}
              sub={annual ? `${fmtEUR(current.depenses / nMonths)} / mois sur ${nMonths} mois` : `Moyenne 12 mois : ${fmtEUR(avg("depenses"))}`} />
            <KPICard icon={Wallet} label="Écart (revenus − dépenses)" value={signed(current.solde)}
              sub={current.tauxEpargne !== null ? `${Math.round(current.tauxEpargne * 100)} % des revenus mis de côté` : (annual ? "Pas de revenu cette année" : "Pas de revenu ce mois-ci")} tone={current.solde >= 0 ? "up" : "down"} />
            <div className="col-span-2 lg:col-span-1 grid">
              <KPICard icon={PiggyBank} label="Versé vers les placements" value={fmtEUR(current.epargne)}
                sub={isMobile ? "Net des retraits, pris sur l'écart" : "Courtiers, assurance vie, crypto… nets des retraits"} />
            </div>
          </div>

          <Panel title="Revenus et dépenses par mois" subtitle="Comptes Revolut et LCL, hors virements entre vos comptes et versements vers les placements">
            <BudgetMonthlyChart data={annual ? yearMonths : last12} />
          </Panel>

          {annual && (
            <Panel title={`Salaires et dépenses mois par mois — ${year}`} subtitle="Cliquez un mois pour l'ouvrir en vue mensuelle">
              <div className="overflow-x-auto -mx-1">
                <table className="w-full text-xs" style={{ ...NUM, borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ color: t.textMuted }}>
                      {["Mois", "Salaires", isMobile ? "Autres" : "Autres revenus", "Dépenses", "Écart", "Placements"].map((h, i) => (
                        <th key={h} className={`py-1.5 px-2 font-medium whitespace-nowrap ${i ? "text-right" : "text-left"} ${i === 5 ? "hidden md:table-cell" : ""}`}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {yearMonths.map((m) => (
                      <tr key={m.periode} onClick={() => { setMode("mois"); setPeriode(m.periode); }} className="cursor-pointer" style={{ borderTop: `1px solid ${t.border}` }}>
                        <td className="py-1.5 px-2 capitalize whitespace-nowrap" style={{ color: t.text }}>{periodeDate(m.periode).toLocaleDateString("fr-FR", { month: isMobile ? "short" : "long" })}</td>
                        <td className="py-1.5 px-2 text-right" style={{ color: t.text }}>{fmtEUR(m.salaire)}</td>
                        <td className="py-1.5 px-2 text-right" style={{ color: t.textMuted }}>{fmtEUR(m.autresRevenus)}</td>
                        <td className="py-1.5 px-2 text-right" style={{ color: t.text }}>{fmtEUR(m.depenses)}</td>
                        <td className="py-1.5 px-2 text-right font-medium" style={{ color: m.solde >= 0 ? t.gain : t.loss }}>{signed(m.solde)}</td>
                        <td className="py-1.5 px-2 text-right hidden md:table-cell" style={{ color: t.textMuted }}>{fmtEUR(m.epargne)}</td>
                      </tr>
                    ))}
                    <tr style={{ borderTop: `2px solid ${t.border}` }}>
                      <td className="py-2 px-2 font-semibold" style={{ color: t.text }}>Total</td>
                      <td className="py-2 px-2 text-right font-semibold" style={{ color: t.text }}>{fmtEUR(current.salaire)}</td>
                      <td className="py-2 px-2 text-right font-semibold" style={{ color: t.text }}>{fmtEUR(current.autresRevenus)}</td>
                      <td className="py-2 px-2 text-right font-semibold" style={{ color: t.text }}>{fmtEUR(current.depenses)}</td>
                      <td className="py-2 px-2 text-right font-semibold" style={{ color: current.solde >= 0 ? t.gain : t.loss }}>{signed(current.solde)}</td>
                      <td className="py-2 px-2 text-right font-semibold hidden md:table-cell" style={{ color: t.text }}>{fmtEUR(current.epargne)}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              {incomeRows.length > 0 && (
                <div className="mt-4 flex flex-wrap gap-x-6 gap-y-1 text-xs" style={{ color: t.textMuted }}>
                  {incomeRows.map((r) => (
                    <button key={r.cat} onClick={() => setFilterCat(filterCat === r.cat ? "all" : r.cat)} style={{ fontWeight: filterCat === r.cat ? 700 : 400 }}>
                      Voir les opérations « {r.cat} » →
                    </button>
                  ))}
                </div>
              )}
            </Panel>
          )}

          <Panel title={`Dépenses par catégorie — ${periodLabel}`}
            subtitle={annual ? `Total de l'année · part des dépenses · moyenne par mois (${nMonths} mois) · cliquez pour voir les opérations`
              : prev12.length ? `Barre pleine : ce mois-ci · trait blanc : moyenne des ${prev12.length} mois précédents · trait jaune : budget` : "Remboursements déduits de la catégorie concernée"}>
            <div className="space-y-2.5">
              {catRows.map((r) => {
                const over = r.avg !== null && r.avg > 0 && r.value > r.avg * 1.25 && r.value - r.avg > 30;
                const depasse = r.limit !== null && r.value > r.limit;
                return (
                  <button key={r.cat} type="button" onClick={() => setFilterCat(filterCat === r.cat ? "all" : r.cat)} className="w-full text-left">
                    <div className="flex items-center justify-between text-xs mb-1 gap-2">
                      <span style={{ color: t.text, fontWeight: filterCat === r.cat ? 700 : 500 }}>{r.cat}</span>
                      <span style={{ color: t.text, ...NUM }}>
                        {fmtEUR(r.value)}
                        {annual && current.depenses > 0 && <span style={{ color: t.textMuted }}> · {Math.round((r.value / current.depenses) * 100)} % · {fmtEUR(r.value / nMonths)} / mois</span>}
                        {r.limit !== null && <span style={{ color: depasse ? t.loss : t.textMuted, fontWeight: depasse ? 600 : 400 }}> · budget {fmtEUR(r.limit)}{depasse ? ` (+${fmtEUR(r.value - r.limit)})` : ""}</span>}
                        {r.annuelInfo && <span style={{ color: r.annuelInfo.ytd > r.annuelInfo.amount ? t.loss : t.textMuted, fontWeight: r.annuelInfo.ytd > r.annuelInfo.amount ? 600 : 400 }}> · {fmtEUR(r.annuelInfo.ytd)} / {fmtEUR(r.annuelInfo.amount)} sur l'année</span>}
                        {r.avg !== null && <span style={{ color: over ? t.warning : t.textMuted }}> · moy. {fmtEUR(r.avg)}{over ? " ▲" : ""}</span>}
                      </span>
                    </div>
                    <div className="relative h-2 rounded-full" style={{ background: t.panelAlt }}>
                      <div className="h-2 rounded-full" style={{ width: `${Math.max(0, (r.value / maxCat) * 100)}%`, background: depasse ? t.loss : t.s2 }} />
                      {r.limit !== null && (
                        <div className="absolute -top-1 w-1 h-4 rounded" title={`Budget ${fmtEUR(r.limit)}`} style={{ left: `calc(${(r.limit / maxCat) * 100}% - 2px)`, background: t.warning }} />
                      )}
                      {r.avg !== null && r.avg > 0 && (
                        <div className="absolute -top-0.5 w-0.5 h-3 rounded" style={{ left: `${(r.avg / maxCat) * 100}%`, background: t.text }} />
                      )}
                    </div>
                  </button>
                );
              })}
            </div>
          </Panel>

          <Panel title={`Opérations — ${periodLabel}${filterCat !== "all" ? ` · ${filterCat}` : ""} (${monthTx.length})`}
            subtitle="Changer une catégorie ne modifie que la ligne choisie ; l'app vous demande ensuite s'il faut l'appliquer aux opérations au même libellé">
            <div className="flex flex-wrap items-center gap-2 mb-2 text-sm">
              <input value={txSearch} onChange={(e) => { setTxSearch(e.target.value); setTxLimit(200); }} placeholder="Rechercher un libellé ou un commentaire…"
                className="w-full rounded-lg px-3 py-1.5 text-sm" style={select} />
              <select value={filterCat} onChange={(e) => { setFilterCat(e.target.value); setTxLimit(200); }} className="rounded-lg px-2 py-1.5 text-sm" style={select}>
                <option value="all">Toutes catégories</option>
                {BUDGET_CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.id}</option>)}
              </select>
              <select value={txSens} onChange={(e) => { setTxSens(e.target.value); setTxLimit(200); }} className="rounded-lg px-2 py-1.5 text-sm" style={select}>
                <option value="all">Entrées et sorties</option>
                <option value="out">Sorties (dépenses)</option>
                <option value="in">Entrées</option>
              </select>
              <span className="flex items-center gap-1.5" style={{ color: t.textMuted }}>
                Montant
                <input type="number" inputMode="decimal" min="0" value={txMin} onChange={(e) => { setTxMin(e.target.value); setTxLimit(200); }} placeholder="min"
                  className="w-20 rounded-lg px-2 py-1.5 text-sm text-right" style={{ ...select, ...NUM }} />
                à
                <input type="number" inputMode="decimal" min="0" value={txMax} onChange={(e) => { setTxMax(e.target.value); setTxLimit(200); }} placeholder="max"
                  className="w-20 rounded-lg px-2 py-1.5 text-sm text-right" style={{ ...select, ...NUM }} />
                €
              </span>
              <select value={txSort} onChange={(e) => setTxSort(e.target.value)} className="rounded-lg px-2 py-1.5 text-sm" style={select}>
                <option value="date">Tri : date</option>
                <option value="desc">Tri : montant décroissant</option>
                <option value="asc">Tri : montant croissant</option>
              </select>
              {(txSens !== "all" || txMin !== "" || txMax !== "" || txSort !== "date" || filterCat !== "all" || txSearch) && (
                <button onClick={() => { setTxSens("all"); setTxMin(""); setTxMax(""); setTxSort("date"); setFilterCat("all"); setTxSearch(""); }} className="text-xs px-2 py-1 rounded-lg" style={{ color: t.textMuted, border: `1px solid ${t.border}` }}>
                  Réinitialiser
                </button>
              )}
            </div>
            <p className="text-xs mb-1" style={{ color: t.textMuted, ...NUM }}>
              {txTotals.out > 0 && <>Sorties affichées : <span style={{ color: t.text }}>{fmtEUR(txTotals.out)}</span></>}
              {txTotals.out > 0 && txTotals.in > 0 && " · "}
              {txTotals.in > 0 && <>Entrées affichées : <span style={{ color: t.text }}>{fmtEUR(txTotals.in)}</span></>}
            </p>
            <div className="divide-y" style={{ borderColor: t.border }}>
              {monthTx.slice(0, txLimit).map((tx) => {
                const kind = budgetKind(tx.cat);
                const muted = kind === "neutre";
                return (
                  <div key={tx.id} style={{ borderColor: t.border }}>
                  <div className="py-2 flex flex-col md:flex-row md:items-center gap-1 md:gap-3" style={{ opacity: muted ? 0.6 : 1 }}>
                    <div className="flex items-center gap-3 flex-1 min-w-0">
                      <span className="text-xs w-12 shrink-0" style={{ color: t.textMuted, ...NUM }}>{fmtDate(tx.d)}{annual && txSort !== "date" && <span className="block text-[10px]">{tx.d.slice(0, 4)}</span>}</span>
                      <span className="text-sm truncate flex-1" style={{ color: t.text }} title={tx.detail ? `${tx.desc} — ${tx.detail}` : tx.desc}>
                        {tx.desc}{tx.pending && <span className="text-[10px] ml-1" style={{ color: t.warning }}>en attente</span>}
                        {tx.detail && <span className="text-xs ml-1.5" style={{ color: t.textMuted }}>{tx.detail}</span>}
                      </span>
                      <span className="text-sm shrink-0 font-medium" style={{ color: tx.amt > 0 ? t.gain : t.text, ...NUM }}>
                        {tx.amt > 0 ? "+" : ""}{fmtEURcents(tx.amt)}
                      </span>
                    </div>
                    <div className="flex items-center gap-1">
                      <select value={tx.cat} onChange={(e) => onSetCategory(tx, e.target.value)} className="flex-1 rounded-lg px-2 py-1 text-xs md:w-48" style={select}>
                        {BUDGET_CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.id}</option>)}
                      </select>
                      <NoteButton tx={tx} editing={noteEdit === tx.id} onToggle={() => setNoteEdit(noteEdit === tx.id ? null : tx.id)} />
                    </div>
                  </div>
                  <NoteBlock tx={tx} editing={noteEdit === tx.id} onSave={(v) => { onSetNote(tx.id, v); setNoteEdit(null); }} onCancel={() => setNoteEdit(null)} />
                  </div>
                );
              })}
            </div>
            {monthTx.length > txLimit && (
              <button onClick={() => setTxLimit((l) => l + 300)} className="w-full mt-2 py-2 rounded-lg text-sm" style={{ background: t.panelAlt, color: t.text, border: `1px solid ${t.border}` }}>
                Afficher plus ({monthTx.length - txLimit} restantes)
              </button>
            )}
            {!annual && (
              <div className="mt-4 flex items-center justify-end gap-2 text-xs" style={{ color: t.textMuted }}>
                Supprimer les opérations de ce mois
                <DeleteButton title={`Supprimer les opérations de ${monthLong(current.periode)}`} onConfirm={() => { onDeleteMonth(current.periode); setPeriode(null); }} />
              </div>
            )}
          </Panel>

          {ruleEntries.length > 0 && (
            <Panel title={`Marchands mémorisés (${ruleEntries.length})`} subtitle="Règles que vous avez demandé de retenir. Supprimer une règle (✕) remet les opérations concernées à leur catégorie automatique, sauf celles que vous avez classées à la main." collapsible defaultCollapsed>
              <div className="space-y-1">
                {ruleEntries.map(([key, cat]) => (
                  <div key={key} className="flex items-center justify-between gap-3 text-xs py-1">
                    <span className="truncate" style={{ color: t.text }}>{key}</span>
                    <span className="flex items-center gap-2 shrink-0">
                      <span style={{ color: t.textMuted }}>{cat}</span>
                      <button onClick={() => onDeleteRule(key)} title="Oublier" className="p-1 rounded" style={{ color: t.textMuted }}><X size={13} /></button>
                    </span>
                  </div>
                ))}
              </div>
            </Panel>
          )}
        </div>
      );
    }

    // ================== ONGLET OPÉRATIONS (tous les mouvements) ==================
    const BUDGET_SOURCES = { revolut: "Revolut", "revolut-joint": "Revolut joint", lcl: "LCL" };
    const sourceLabel = (src) => BUDGET_SOURCES[src || "revolut"] || (String(src).startsWith("lcl:") ? `LCL n°${src.slice(4)}` : src);
    const KIND_LABEL = { revenu: "Revenus", depense: "Dépenses", epargne: "Versements vers les placements", neutre: "Virements entre mes comptes" };
    const shortMonth = (p) => periodeDate(p).toLocaleDateString("fr-FR", { month: "short", year: "2-digit" });

    function OperationsTab({ transactions, onImport, onSetCategory, onBulkCategory, onSetNote, catsVersion = "" }) {
      const t = useTheme();
      const isMobile = useIsMobile();
      const [period, setPeriod] = useState("all");
      const [filterCat, setFilterCat] = useState("all");
      const [filterKind, setFilterKind] = useState("all");
      const [filterSource, setFilterSource] = useState("all");
      const [search, setSearch] = useState("");
      const [minAmt, setMinAmt] = useState("");
      const [maxAmt, setMaxAmt] = useState("");
      const [sens, setSens] = useState("all");
      const [sortBy, setSortBy] = useState("date");
      const [noteEdit, setNoteEdit] = useState(null);
      const [limit, setLimit] = useState(150);
      const [selected, setSelected] = useState(() => new Set());
      const [bulkCat, setBulkCat] = useState("Famille & proches");
      const [view, setView] = useState("totaux");

      const allMonths = useMemo(() => [...new Set(transactions.map((tx) => tx.d.slice(0, 7)))].sort().reverse(), [transactions]);
      const years = useMemo(() => [...new Set(allMonths.map((m) => m.slice(0, 4)))], [allMonths]);
      const sources = useMemo(() => [...new Set(transactions.map((tx) => tx.src || "revolut"))], [transactions]);

      // Filtres de période / compte / recherche : ils déterminent aussi la synthèse par catégorie
      const scoped = useMemo(() => {
        const q = normTxt(search);
        // Montant : comparé en valeur absolue (« entre 100 et 500 € », dépense ou rentrée)
        const lo = minAmt === "" ? null : Number(minAmt), hi = maxAmt === "" ? null : Number(maxAmt);
        return transactions.filter((tx) =>
          (period === "all" || tx.d.startsWith(period)) &&
          (filterSource === "all" || (tx.src || "revolut") === filterSource) &&
          (sens === "all" || (sens === "out" ? tx.amt < 0 : tx.amt > 0)) &&
          (lo === null || Math.abs(tx.amt) >= lo) && (hi === null || Math.abs(tx.amt) <= hi) &&
          (!q || normTxt(`${tx.desc} ${tx.detail || ""} ${tx.cat} ${tx.note || ""}`).includes(q))
        );
      }, [transactions, period, filterSource, search, minAmt, maxAmt, sens]);
      const visible = useMemo(() => scoped
        .filter((tx) => (filterCat === "all" || tx.cat === filterCat) && (filterKind === "all" || budgetKind(tx.cat) === filterKind))
        .sort(sortBy === "date" ? (a, b) => b.d.localeCompare(a.d) || a.amt - b.amt
          : sortBy === "desc" ? (a, b) => Math.abs(b.amt) - Math.abs(a.amt) || b.d.localeCompare(a.d)
          : (a, b) => Math.abs(a.amt) - Math.abs(b.amt) || b.d.localeCompare(a.d)), [scoped, filterCat, filterKind, sortBy]);
      const amountFilterOn = minAmt !== "" || maxAmt !== "" || sens !== "all";
      const visibleTotals = useMemo(() => visible.reduce((acc, tx) => { if (tx.amt < 0) acc.out -= tx.amt; else acc.in += tx.amt; return acc; }, { out: 0, in: 0 }), [visible]);

      const months = useMemo(() => [...new Set(scoped.map((tx) => tx.d.slice(0, 7)))].sort(), [scoped]);
      const summary = useMemo(() => {
        const byCat = {};
        scoped.forEach((tx) => {
          const r = (byCat[tx.cat] ||= { cat: tx.cat, kind: budgetKind(tx.cat), total: 0, count: 0, byMonth: {} });
          r.total += tx.amt; r.count++;
          const p = tx.d.slice(0, 7);
          r.byMonth[p] = (r.byMonth[p] || 0) + tx.amt;
        });
        return byCat;
      }, [scoped, catsVersion]);
      const groups = ["depense", "revenu", "epargne", "neutre"].map((kind) => {
        const rows = BUDGET_CATEGORIES.filter((c) => c.kind === kind && summary[c.id]).map((c) => summary[c.id]);
        // Dépenses et versements en positif, revenus en positif : on affiche ce qui « sort » ou « entre »
        const sign = kind === "revenu" || kind === "neutre" ? 1 : -1;
        const list = rows.map((r) => ({ ...r, value: sign * r.total })).sort((a, b) => b.value - a.value);
        return { kind, rows: list, total: list.reduce((s, r) => s + r.value, 0), sign };
      }).filter((g) => g.rows.length);
      const totalDepenses = groups.find((g) => g.kind === "depense")?.total || 0;
      const maxDep = Math.max(1, ...(groups.find((g) => g.kind === "depense")?.rows || []).map((r) => r.value));

      const toggle = (id) => setSelected((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const shown = visible.slice(0, limit);
      const allShownSelected = shown.length > 0 && shown.every((tx) => selected.has(tx.id));
      const select = { background: t.panel, color: t.text, border: `1px solid ${t.border}` };
      const chip = (active) => ({ background: active ? t.panel : "transparent", color: active ? t.text : t.textMuted, fontWeight: active ? 600 : 400 });

      if (!transactions.length) {
        return (
          <div className="space-y-4">
            <BudgetImport onImport={onImport} />
            <p className="text-sm" style={{ color: t.textMuted }}>Aucune opération pour l'instant : importez un relevé.</p>
          </div>
        );
      }

      // Liste regroupée par mois
      const rowsByMonth = [];
      shown.forEach((tx) => {
        // Tri par montant : une seule liste, sans regroupement par mois
        const p = sortBy === "date" ? tx.d.slice(0, 7) : "tri";
        if (!rowsByMonth.length || rowsByMonth[rowsByMonth.length - 1].p !== p) rowsByMonth.push({ p, items: [] });
        rowsByMonth[rowsByMonth.length - 1].items.push(tx);
      });

      return (
        <div className="space-y-3 md:space-y-5">
          <BudgetImport onImport={onImport} />

          <div className="rounded-2xl p-3 md:p-4 flex flex-wrap items-center gap-2" style={{ background: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadow }}>
            <select value={period} onChange={(e) => { setPeriod(e.target.value); setLimit(150); }} className="rounded-lg px-2 py-1.5 text-sm" style={select}>
              <option value="all">Toute la période</option>
              {years.map((y) => (
                <optgroup key={y} label={y}>
                  <option value={y}>Année {y}</option>
                  {allMonths.filter((m) => m.startsWith(y)).map((m) => <option key={m} value={m}>{monthLong(m)}</option>)}
                </optgroup>
              ))}
            </select>
            {sources.length > 1 && (
              <select value={filterSource} onChange={(e) => setFilterSource(e.target.value)} className="rounded-lg px-2 py-1.5 text-sm" style={select}>
                <option value="all">Tous les comptes</option>
                {sources.map((s) => <option key={s} value={s}>{sourceLabel(s)}</option>)}
              </select>
            )}
            <input value={search} onChange={(e) => { setSearch(e.target.value); setLimit(150); }} placeholder="Rechercher un libellé ou un commentaire…"
              className="rounded-lg px-3 py-1.5 text-sm flex-1 min-w-[160px]" style={select} />
            <div className="w-full flex flex-wrap items-center gap-2 text-sm">
              <select value={sens} onChange={(e) => { setSens(e.target.value); setLimit(150); }} className="rounded-lg px-2 py-1.5 text-sm" style={select}>
                <option value="all">Entrées et sorties</option>
                <option value="out">Sorties (dépenses)</option>
                <option value="in">Entrées</option>
              </select>
              <span className="flex items-center gap-1.5" style={{ color: t.textMuted }}>
                Montant
                <input type="number" inputMode="decimal" min="0" value={minAmt} onChange={(e) => { setMinAmt(e.target.value); setLimit(150); }} placeholder="min"
                  className="w-20 rounded-lg px-2 py-1.5 text-sm text-right" style={{ ...select, ...NUM }} />
                à
                <input type="number" inputMode="decimal" min="0" value={maxAmt} onChange={(e) => { setMaxAmt(e.target.value); setLimit(150); }} placeholder="max"
                  className="w-20 rounded-lg px-2 py-1.5 text-sm text-right" style={{ ...select, ...NUM }} />
                €
              </span>
              <select value={sortBy} onChange={(e) => { setSortBy(e.target.value); setLimit(150); }} className="rounded-lg px-2 py-1.5 text-sm" style={select}>
                <option value="date">Tri : date</option>
                <option value="desc">Tri : montant décroissant</option>
                <option value="asc">Tri : montant croissant</option>
              </select>
              {(amountFilterOn || sortBy !== "date") && (
                <button onClick={() => { setMinAmt(""); setMaxAmt(""); setSens("all"); setSortBy("date"); }} className="text-xs px-2 py-1 rounded-lg" style={{ color: t.textMuted, border: `1px solid ${t.border}` }}>
                  Réinitialiser
                </button>
              )}
            </div>
          </div>

          <Panel title="Totaux par catégorie"
            subtitle={`${period === "all" ? "Toute la période" : period.length === 4 ? `Année ${period}` : monthLong(period)} · ${months.length} mois · cliquez une catégorie pour voir ses opérations`}
            action={months.length > 1 && (
              <div className="flex shrink-0 p-0.5 rounded-lg text-xs" style={{ background: t.panelAlt, border: `1px solid ${t.border}` }}>
                {[["totaux", "Totaux"], ["mois", "Par mois"]].map(([v, l]) => (
                  <button key={v} onClick={() => setView(v)} className="px-2.5 py-1 rounded-md" style={chip(view === v)}>{l}</button>
                ))}
              </div>
            )}>
            {view === "totaux" || months.length <= 1 ? (
              <div className="space-y-5">
                {groups.map((g) => (
                  <div key={g.kind}>
                    <div className="flex justify-between text-xs font-semibold mb-2 pb-1" style={{ color: t.text, borderBottom: `1px solid ${t.border}` }}>
                      <span>{KIND_LABEL[g.kind]}</span>
                      <span style={NUM}>{fmtEUR(g.total)}{months.length > 1 && <span style={{ color: t.textMuted, fontWeight: 400 }}> · {fmtEUR(g.total / months.length)} / mois</span>}</span>
                    </div>
                    <div className="space-y-1">
                      {g.rows.map((r) => {
                        const active = filterCat === r.cat;
                        return (
                          <button key={r.cat} type="button" onClick={() => { setFilterCat(active ? "all" : r.cat); setFilterKind("all"); setLimit(150); }}
                            className="w-full text-left rounded-lg px-2 py-1.5" style={{ background: active ? t.panelAlt : "transparent" }}>
                            <div className="flex items-center justify-between gap-2 text-xs">
                              <span style={{ color: t.text, fontWeight: active ? 700 : 500 }}>{r.cat} <span style={{ color: t.textMuted, fontWeight: 400 }}>({r.count})</span></span>
                              <span style={{ color: t.text, ...NUM }}>
                                {fmtEUR(r.value)}
                                {g.kind === "depense" && totalDepenses > 0 && <span style={{ color: t.textMuted }}> · {Math.round((r.value / totalDepenses) * 100)} %</span>}
                                {months.length > 1 && !isMobile && <span style={{ color: t.textMuted }}> · {fmtEUR(r.value / months.length)} / mois</span>}
                              </span>
                            </div>
                            {g.kind === "depense" && (
                              <div className="h-1.5 rounded-full mt-1" style={{ background: t.panelAlt }}>
                                <div className="h-1.5 rounded-full" style={{ width: `${Math.max(0, (r.value / maxDep) * 100)}%`, background: t.s2 }} />
                              </div>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="overflow-x-auto -mx-1">
                <table className="text-xs w-full" style={{ ...NUM, borderCollapse: "collapse" }}>
                  <thead>
                    <tr style={{ color: t.textMuted }}>
                      <th className="text-left font-medium py-1.5 pr-3 sticky left-0" style={{ background: t.panel }}>Catégorie</th>
